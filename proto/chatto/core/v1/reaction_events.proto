syntax = "proto3";

package chatto.core.v1;

import "chatto/core/v1/notification.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/v1;corev1";

// ============================================================================
// REACTION EVENTS (room-scoped, durable in EVT)
//
// Top-level Event oneof tags owned by this file:
//   - 1050-1051: durable reaction events on evt.room.{roomId}.* that kept
//     their pre-EVT field numbers during the cutover
//
// These tags are the exception to the usual "<1000 is durable" convention.
// Treat them as frozen persisted tags, not reusable live-only space.
// Message-internal field numbers are local to each message and do not consume
// top-level Event tag space.
// ============================================================================

message ReactionAddedEvent {
  reserved 1;
  reserved "space_id";

  // Room ID - identifies the room containing the message
  string room_id = 2;

  // Event ID of the message being reacted to (NanoID)
  string message_event_id = 3;

  // The emoji used for the reaction (shortcode name)
  string emoji = 4;

  // Evaluated recipient/cause provenance. Absent for self-reactions or when
  // the recipient's effective reaction policy is Off.
  NotificationCandidate notification_candidate = 5;
}

message ReactionRemovedEvent {
  reserved 1;
  reserved "space_id";

  // Room ID - identifies the room containing the message
  string room_id = 2;

  // Event ID of the message the reaction was removed from (NanoID)
  string message_event_id = 3;

  // The emoji shortcode that was removed
  string emoji = 4;

  // Source identity of the corresponding ReactionAddedEvent and its
  // notification recipient, if that add produced a candidate.
  string notification_source_event_id = 5;
  string notification_recipient_id = 6;
}
