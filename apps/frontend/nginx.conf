server {
    listen 80;
    server_name _;

    # The image keeps the build output read-only. docker/frontend-entrypoint.sh
    # writes the deployment-specific files to /var/run/chatto-frontend.
    root /usr/share/nginx/html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The generated SPA document contains the resource policy with build-specific
    # script hashes. Only HTTP headers can enforce this embedding restriction.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Serve precompressed brotli and gzip files generated by adapter-static
    brotli_static on;
    gzip_static on;

    # Immutable hashed assets — cache forever
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Service worker — validate cheaply, but don't force a full refetch churn
    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # Missing OAuth metadata must not fall back to the SPA document.
    location = /oauth/frontend-client-metadata.json {
        root /var/run/chatto-frontend;
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }

    # The handoff query identifies a community. Do not log it or send it as a
    # referrer on the requests that load the app.
    location = /open {
        root /var/run/chatto-frontend;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files /200.html =500;
    }

    # All other static files — no cache
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri @spa;
    }

    # The rendered SPA document, with this deployment's link-preview tags.
    location @spa {
        root /var/run/chatto-frontend;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files /200.html =500;
    }
}
