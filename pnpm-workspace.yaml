packages:
  - apps/*
  - examples/*
  - packages/*

engineStrict: true

allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': false
  '@google/genai': false
  protobufjs: false

minimumReleaseAgeExclude:
  - runling@0.6.0

patchedDependencies:
  '@sapphi-red/web-noise-suppressor@0.4.0': patches/@sapphi-red__web-noise-suppressor@0.4.0.patch
