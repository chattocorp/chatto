"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[[preview_urls]]
name = "Chatto"
url = "http://chatto.$CONDUCTOR_WORKSPACE_NAME.localhost:$CONDUCTOR_PORT"

[[preview_urls]]
name = "Chatto (Vite)"
url = "http://chatto.$CONDUCTOR_WORKSPACE_NAME.localhost:$((CONDUCTOR_PORT + 1))"

[[preview_urls]]
name = "Authling"
url = "http://authling.$CONDUCTOR_WORKSPACE_NAME.localhost:$((CONDUCTOR_PORT + 2))"

[[preview_urls]]
name = "Runling"
url = "http://localhost:$((CONDUCTOR_PORT + 3))"

[[preview_urls]]
name = "Mailpit"
url = "http://localhost:$((CONDUCTOR_PORT + 9))"

[scripts]
setup = "mise setup"
archive = "exec tools/stop-workspace-dev.sh"
run_mode = "concurrent"

[scripts.run.dev]
command = "exec mise dev"
available_in = [ "local" ]
default = true
icon = "network"

[scripts.run.frontend]
command = "exec mise dev-frontend"
available_in = [ "local" ]
icon = "zap"

[scripts.run.storybook]
command = "exec mise storybook"
available_in = [ "local" ]
icon = "component"

[scripts.run.docs_website]
command = "exec mise dev-docs-website"
available_in = [ "local" ]
icon = "book-open"

[prompts]
create_pr = "Create a full GitHub pull request for the current branch, not a draft PR."

[git]
delete_branch_on_archive = false
worktree_push_auto_setup_remote = true
