syntax = "proto3";

package chatto.realtime.v1;

// RoomGroupCreatedEvent reports a new room group.
message RoomGroupCreatedEvent {
  // ID of the new room group.
  string group_id = 1;
  // Display name of the room group.
  string name = 2;
  // Optional public description of the room group.
  string description = 3;
}
// RoomGroupUpdatedEvent reports changed room-group metadata.
message RoomGroupUpdatedEvent {
  // ID of the changed room group.
  string group_id = 1;
  // Complete new display name.
  string name = 2;
  // Complete new public description.
  string description = 3;
}
// RoomGroupDeletedEvent reports a deleted room group.
message RoomGroupDeletedEvent {
  // ID of the deleted room group.
  string group_id = 1;
}
// RoomAddedToGroupEvent reports that a room was added to a group.
message RoomAddedToGroupEvent {
  // ID of the target room group.
  string group_id = 1;
  // ID of the added room.
  string room_id = 2;
}
// RoomRemovedFromGroupEvent reports that a room was removed from a group.
message RoomRemovedFromGroupEvent {
  // ID of the source room group.
  string group_id = 1;
  // ID of the removed room.
  string room_id = 2;
}
// RoomsInGroupReorderedEvent reports the complete room order in a group.
message RoomsInGroupReorderedEvent {
  // ID of the reordered room group.
  string group_id = 1;
  // Complete ordered list of room IDs.
  repeated string room_ids = 2;
}
// SidebarLinkAddedToGroupEvent reports a new link in a room group.
message SidebarLinkAddedToGroupEvent {
  // ID of the target room group.
  string group_id = 1;
  // ID of the new sidebar link.
  string link_id = 2;
  // Display label of the sidebar link.
  string label = 3;
  // Absolute HTTP(S) URL or server-local path that starts with `/`.
  string url = 4;
}
// SidebarLinkUpdatedEvent reports changed room-group link data.
message SidebarLinkUpdatedEvent {
  // ID of the containing room group.
  string group_id = 1;
  // ID of the changed sidebar link.
  string link_id = 2;
  // Complete new display label.
  string label = 3;
  // Complete new absolute HTTP(S) URL or server-local path.
  string url = 4;
}
// SidebarLinkRemovedFromGroupEvent reports a removed room-group link.
message SidebarLinkRemovedFromGroupEvent {
  // ID of the source room group.
  string group_id = 1;
  // ID of the removed sidebar link.
  string link_id = 2;
}

// Identifies the type of one ordered room-group entry.
enum SidebarGroupEntryKind {
  // Invalid or unknown entry type.
  SIDEBAR_GROUP_ENTRY_KIND_UNSPECIFIED = 0;
  // The entry identifies a room.
  SIDEBAR_GROUP_ENTRY_KIND_ROOM = 1;
  // The entry identifies a sidebar link.
  SIDEBAR_GROUP_ENTRY_KIND_SIDEBAR_LINK = 2;
}

// SidebarGroupEntryReference identifies one entry in a mixed group order.
message SidebarGroupEntryReference {
  // Type of the referenced entry.
  SidebarGroupEntryKind kind = 1;
  // Room ID or sidebar-link ID, as selected by `kind`.
  string id = 2;
}

// SidebarGroupEntriesReorderedEvent reports the complete mixed group order.
message SidebarGroupEntriesReorderedEvent {
  // ID of the reordered room group.
  string group_id = 1;
  // Complete mixed order of rooms and sidebar links.
  repeated SidebarGroupEntryReference entries = 2;
}
// RoomGroupsReorderedEvent reports the complete room-group order.
message RoomGroupsReorderedEvent {
  // Complete ordered list of room-group IDs.
  repeated string group_ids = 1;
}
