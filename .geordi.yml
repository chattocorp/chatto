setup: mise setup
# Each task listens on a named port of its own. Chatto uses that port. The other
# development services use fixed offsets from GEORDI_PORT, the first of the ten
# spare workspace ports; see the `[env]` section of mise.toml.
# The chatto and chatto-full tasks use the same NATS port and data directory,
# so only one runs at a time. The port check of the second task stops it early.
tasks:
  chatto:
    label: Chatto
    command: CHATTO_DEV_CHATTO_PORT_OVERRIDE=$PORT CHATTO_DEV_CHATTO_URL_OVERRIDE=http://localhost:$PORT mise dev
    ports: [chatto]
    url: http://localhost:{chatto}/
    default: true
  chatto-full:
    label: Chatto with Authling, Runling, Mailpit, and LiveKit
    command: CHATTO_DEV_CHATTO_PORT_OVERRIDE=$PORT CHATTO_DEV_CHATTO_URL_OVERRIDE=http://localhost:$PORT mise dev-full
    ports: [chatto-full]
    url: http://localhost:{chatto-full}/
  docs:
    label: Docs website
    command: mise dev-docs-website -- --port "$PORT"
    ports: [docs]
    url: http://localhost:{docs}/
