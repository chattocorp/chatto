packages:
  - ci
  - apps/*
  - examples/*
  - packages/*
  - experimental/chatto-gpuix

engineStrict: true

allowBuilds:
  esbuild: true
  sharp: true
  '@tailwindcss/oxide': false
  '@google/genai': false
  protobufjs: false
  electron-winstaller: false
  core-js: false

minimumReleaseAgeExclude:
  - virtua@0.54.1
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - electron@45.1.0

patchedDependencies:
  app-builder-lib@26.18.0: patches/app-builder-lib@26.18.0.patch
  virtua@0.54.1: patches/virtua@0.54.1.patch
