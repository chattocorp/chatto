name: release

# publish-releases.yml calls this for each Chatto version that Sweet tags in a
# checked push. Manual runs build an image or desktop bundle for verification
# and publish nothing.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Sweet tag, such as v0.6.0.'
        required: true
        type: string
      commit:
        description: 'Tagged commit to build.'
        required: true
        type: string
      version:
        description: 'Release version, such as 0.6.0.'
        required: true
        type: string
      prerelease:
        description: 'Sweet tag entry: the version has a prerelease suffix.'
        required: true
        type: boolean
      highest:
        description: 'Sweet tag entry: the version is the highest stable Chatto version.'
        required: true
        type: boolean
    # The caller passes GORELEASER_GITHUB_TOKEN and HOMEBREW_TAP_GITHUB_TOKEN.
    # The signing jobs read their secrets from their protected environments.
    # No `secrets:` list here: a list hides environment secrets from actionlint.
  workflow_dispatch:
    inputs:
      target:
        description: 'Artifact to build'
        required: true
        default: image
        type: choice
        options:
          - image
          - desktop
      ref:
        description: 'Git ref or SHA to build. Defaults to the selected workflow ref.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'image' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          turbo-remote-cache: 'false'

      - name: Resolve image metadata
        id: image
        run: bash tools/release/image-metadata.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Start BuildKit from the mirror before its registry configuration applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Try the public mirror first to reduce Docker Hub rate limits.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend assets for CLI image
        run: mise build-frontend
        env:
          CHATTO_BUILD_VERSION: ${{ steps.image.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: '1'

      - name: Prepare Docker context
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          context="/tmp/chatto-docker/linux-amd64"
          mkdir -p "$context"
          cp docker/Dockerfile.goreleaser "$context/Dockerfile"
          mkdir -p "$context/docker"
          cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
          cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
          mkdir -p "$context/LICENSES"
          cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
          cp NOTICE "$context/NOTICE"

          (
            cd cli
            # Chatto does not expose Gin's MessagePack binding; omit its large codec.
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -tags=nomsgpack \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "$context/chatto" .
          )

      - name: Build and push Chatto image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/chatto-docker/linux-amd64
          file: /tmp/chatto-docker/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=chatto-manual-amd64
          cache-to: type=gha,mode=max,scope=chatto-manual-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  # All protected environments request approval at the start of a release run.
  # Keep this job independent of builds so one review can approve all three.
  approve-release:
    if: ${{ inputs.tag != '' }}
    environment: chatto-release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Approve release build and publication
        run: echo 'Release build and publication approved.'

  publish-chatto-client:
    needs: [approve-release, build-server-release, assemble-desktop-release]
    if: ${{ inputs.tag != '' }}
    uses: ./.github/workflows/npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      package: packages/chatto-client
      commit: ${{ inputs.commit }}
      prerelease: ${{ inputs.prerelease }}
      highest: ${{ inputs.highest }}

  build-desktop-release:
    if: ${{ inputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    name: build-desktop-release (${{ matrix.platform }})
    environment: ${{ matrix.environment }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            environment: desktop-signing
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            environment: desktop-signing
          - platform: macos
            os: macos-15
            environment: desktop-signing
          - platform: macos-intel
            os: macos-15-intel
            environment: desktop-signing
          - platform: macos-universal
            os: macos-15
            environment: desktop-signing
          - platform: windows
            os: windows-latest
            environment: desktop-windows-signing
    env:
      CHATTO_DESKTOP_ARCH: ${{ matrix.platform == 'macos-universal' && 'universal' || '' }}
      # pnpm 11 has no standalone Intel macOS binary; use its Node.js package.
      MISE_BACKENDS_PNPM: ${{ matrix.platform == 'macos-intel' && 'npm:pnpm' || 'aqua:pnpm/pnpm' }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.ref || github.ref }}
          fetch-depth: 0

      # Keep these two checks inline. They run before any repository code, and a
      # script from the checkout would come from the ref that they check.
      - name: Verify trusted desktop ref
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release-*:refs/remotes/origin/release-*'
          while IFS= read -r ref; do
            if git merge-base --is-ancestor HEAD "$ref"; then
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release-*')

          echo "::error::Desktop signing is restricted to commits reachable from origin/main or an origin/release-* branch."
          exit 1

      - name: Verify immutable GitHub OIDC subject
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SUBJECT_PREFIX: repo:chattocorp@261891647/chatto@1205013299
        run: |
          set -euo pipefail

          if ! configuration="$(
            gh api \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/oidc/customization/sub" \
              --jq '[.use_default, .use_immutable_subject, .sub_claim_prefix] | @tsv'
          )"; then
            echo "::error::Could not read the repository's GitHub OIDC configuration."
            exit 1
          fi

          expected_configuration="$(printf 'true\ttrue\t%s' "${EXPECTED_SUBJECT_PREFIX:?}")"
          if [[ "$configuration" != "$expected_configuration" ]]; then
            echo "::error::Enable the repository's default immutable GitHub OIDC subject before configuring Azure federation. Expected prefix '${EXPECTED_SUBJECT_PREFIX}'."
            exit 1
          fi

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          turbo-remote-cache: 'false'
          install-cli-deps: 'false'

      - name: Resolve desktop version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash tools/release/desktop-version.sh

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Test macOS game-capture helper
        if: runner.os == 'macOS'
        run: mise test-desktop-macos-capture

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.CHATTO_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CHATTO_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_ISSUER_ID }}
        run: bash tools/release/configure-macos-signing.sh

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.CHATTO_WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT_NAME: ${{ vars.CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME }}
          CERTIFICATE_PROFILE_NAME: ${{ vars.CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME }}
          EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $required = @{
            CHATTO_WINDOWS_AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            CHATTO_WINDOWS_AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            CHATTO_WINDOWS_SIGNING_ENDPOINT = $env:SIGNING_ENDPOINT
            CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME = $env:SIGNING_ACCOUNT_NAME
            CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME = $env:CERTIFICATE_PROFILE_NAME
            CHATTO_WINDOWS_EXPECTED_PUBLISHER = $env:EXPECTED_PUBLISHER
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            Write-Error "The following Windows release settings are not configured: $($missing -join ', ')"
            exit 1
          }

      - name: Build desktop bundle
        shell: bash
        env:
          CHATTO_BUILD_VERSION: ${{ steps.version.outputs.frontend_version }}
          CHATTO_DESKTOP_AUTO_UPDATE: ${{ inputs.tag != '' && 'true' || 'false' }}
          CHATTO_WINDOWS_EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mise desktop-build 2>&1 | tee "$RUNNER_TEMP/chatto-macos-notarization.log"
          else
            mise desktop-build
          fi

      - name: Log in to Azure for Windows signing
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.CHATTO_WINDOWS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHATTO_WINDOWS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHATTO_WINDOWS_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows desktop bundle
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.CHATTO_WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\apps\desktop\dist\windows
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Chatto Desktop
          description-url: https://chatto.run

      - name: Verify bundled frontend version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.frontend_version }}
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Verify Windows bundle signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $bundle = Resolve-Path "apps/desktop/dist/windows"
          $files = @(Get-ChildItem -LiteralPath $bundle -File -Recurse | Where-Object {
            $_.Extension -in '.exe', '.dll', '.node'
          })
          if ($files.Count -eq 0) {
            Write-Error "The Windows bundle contains no executable files to verify."
            exit 1
          }
          $application = Join-Path $bundle "chatto-desktop.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            Write-Error "The Windows bundle does not contain chatto-desktop.exe."
            exit 1
          }

          $failed = $false
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            $publisher = $signature.SignerCertificate.Subject
            $hasExpectedPublisher = [string]::Equals(
              $publisher,
              $env:EXPECTED_PUBLISHER,
              [System.StringComparison]::OrdinalIgnoreCase
            )
            $requiresExpectedPublisher = [string]::Equals(
              $file.FullName,
              $application,
              [System.StringComparison]::OrdinalIgnoreCase
            )
            if (
              $signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              ($requiresExpectedPublisher -and -not $hasExpectedPublisher) -or
              $null -eq $signature.TimeStamperCertificate
            ) {
              Write-Error "$($file.FullName): status=$($signature.Status), publisher='$publisher', timestamped=$($null -ne $signature.TimeStamperCertificate)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }
          Write-Host "Verified $($files.Count) valid, timestamped Windows executable signatures; chatto-desktop.exe is published by '$env:EXPECTED_PUBLISHER'."

      # The signing hook also signs and verifies the generated uninstaller
      # before NSIS embeds it, using the Azure login and module above.
      - name: Build signed Windows installer
        if: runner.os == 'Windows'
        env:
          CHATTO_WINDOWS_SIGN_INSTALLER: 'true'
          CHATTO_WINDOWS_SIGNING_ENDPOINT: ${{ vars.CHATTO_WINDOWS_SIGNING_ENDPOINT }}
          CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.CHATTO_WINDOWS_SIGNING_ACCOUNT_NAME }}
          CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME: ${{ vars.CHATTO_WINDOWS_CERTIFICATE_PROFILE_NAME }}
          CHATTO_WINDOWS_EXPECTED_PUBLISHER: ${{ vars.CHATTO_WINDOWS_EXPECTED_PUBLISHER }}
        run: mise x -- pnpm --filter chatto-desktop build:windows-installer

      - name: Test signed Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem apps/desktop/dist/installer/*_Setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./tools/test-desktop-windows-installer.ps1 -Installer $installer[0].FullName
          $msi = @(Get-ChildItem apps/desktop/dist/installer/*_Setup.msi)
          if ($msi.Count -ne 1) { throw 'Expected one Windows MSI package.' }
          mise x -- pnpm --filter chatto-desktop build:windows-installer --msi-upgrade-fixture
          if ($LASTEXITCODE -ne 0) { throw 'MSI upgrade fixture build failed.' }
          ./tools/test-desktop-windows-msi.ps1 -Installer $msi[0].FullName -PreviousInstaller apps/desktop/dist/msi-upgrade-fixture/upgrade-fixture.msi

      - name: Verify macOS binary architectures
        if: runner.os == 'macOS'
        run: bash tools/test-desktop-macos-architectures.sh

      # This is the only notarisation submission. It also staples the app that
      # the next step packages as the updater ZIP.
      - name: Build and test signed macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mise x -- pnpm --filter chatto-desktop build:macos-dmg --release 2>&1 | tee -a "$RUNNER_TEMP/chatto-macos-notarization.log"
          bash tools/test-desktop-macos-dmg.sh apps/desktop/dist/dmg/*.dmg
          mkdir -p .context/desktop-release
          cp apps/desktop/dist/dmg/*.dmg .context/desktop-release/

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact_arch="${CHATTO_DESKTOP_ARCH:-$RUNNER_ARCH}"
          artifact_arch="$(echo "$artifact_arch" | tr '[:lower:]' '[:upper:]')"
          helper="apps/desktop/dist/Chatto.app/Contents/Helpers/Chatto Capture Helper.app/Contents/MacOS/chatto-macos-capture-probe"
          test -x "$helper"
          codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/Chatto.app"
          # build:macos-dmg --release staples and validates the app with bounded network retries.
          spctl --assess --type execute --verbose=4 "apps/desktop/dist/Chatto.app"
          mkdir -p .context/desktop-release
          ditto -c -k --sequesterRsrc --keepParent \
            "apps/desktop/dist/Chatto.app" \
            ".context/desktop-release/chatto-desktop_${VERSION}_macOS_${artifact_arch}.zip"

      - name: Upload macOS notarisation log
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-notarisation-log-${{ github.run_id }}-${{ runner.arch }}
          path: ${{ runner.temp }}/chatto-macos-notarization.log
          if-no-files-found: warn
          retention-days: 90

      - name: Remove macOS signing credentials
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${CHATTO_MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CHATTO_MACOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${CHATTO_MACOS_SIGNING_CERTIFICATE:-$RUNNER_TEMP/chatto-developer-id.p12}" \
            "${CHATTO_MACOS_NOTARY_API_KEY:-$RUNNER_TEMP/chatto-notary-api-key.p8}"

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .context/desktop-release
          tar -C apps/desktop/dist -czf \
            ".context/desktop-release/chatto-desktop_${VERSION}_Linux_${RUNNER_ARCH}.tar.gz" \
            chatto-desktop
          mise x -- pnpm --filter chatto-desktop build:linux-appimage
          bash tools/test-desktop-linux.sh
          cp apps/desktop/dist/appimage/*.AppImage .context/desktop-release/

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force .context/desktop-release | Out-Null
          Copy-Item apps/desktop/dist/installer/*_Setup.exe .context/desktop-release/
          Copy-Item apps/desktop/dist/installer/*_Setup.msi .context/desktop-release/
          Compress-Archive `
            -Path "apps/desktop/dist/windows" `
            -DestinationPath ".context/desktop-release/chatto-desktop_$env:VERSION`_Windows_$env:RUNNER_ARCH.zip"

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.platform }}-${{ runner.arch }}
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 1

  assemble-desktop-release:
    if: ${{ inputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    needs: build-desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          path: .context/desktop-release
          merge-multiple: true

      - name: Generate desktop update manifests
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          node apps/desktop/scripts/update-manifests.mjs .context/desktop-release "$version"

      - name: Generate checksums
        shell: bash
        run: |
          cd .context/desktop-release
          sha256sum chatto-desktop_* > chatto-desktop_checksums.txt

      - name: Upload desktop release verification
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-verification-${{ github.run_id }}
          overwrite: true
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 7

  build-server-release:
    needs: approve-release
    if: ${{ inputs.tag != '' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # GoReleaser reads the release tag from the full history.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          turbo-remote-cache: 'false'

      - name: Build frontend once
        run: mise build-frontend
        env:
          CHATTO_BUILD_VERSION: ${{ inputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: '1'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Start BuildKit from the mirror before its registry configuration applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Try the public mirror first to reduce Docker Hub rate limits.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Keep this aligned with the root mise.toml pin.
          version: 'v2.19.0'
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Several packages can tag the same commit. Name the Chatto tag.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          CHATTO_PUSH_LATEST: ${{ inputs.highest }}

      # Build each platform locally so no registry writes occur before approval.
      - name: Build frontend release image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend.prebuilt
          load: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto-client:${{ inputs.version }}-amd64
          cache-from: type=gha,scope=chatto-client-amd64
          cache-to: type=gha,scope=chatto-client-amd64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ inputs.commit }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Check frontend release image on a read-only file system
        run: sh docker/frontend-image_test.sh "ghcr.io/chattocorp/chatto-client:${VERSION}-amd64"

      - name: Build frontend release image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend.prebuilt
          load: true
          platforms: linux/arm64
          tags: ghcr.io/chattocorp/chatto-client:${{ inputs.version }}-arm64
          cache-from: type=gha,scope=chatto-client-arm64
          cache-to: type=gha,scope=chatto-client-arm64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ inputs.commit }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Save release images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .context/release-images
          docker save --output .context/release-images/images.tar \
            "ghcr.io/chattocorp/chatto:${VERSION}-amd64" \
            "ghcr.io/chattocorp/chatto:${VERSION}-arm64" \
            "ghcr.io/chattocorp/chatto-client:${VERSION}-amd64" \
            "ghcr.io/chattocorp/chatto-client:${VERSION}-arm64"

      - name: Upload server release archives
        uses: actions/upload-artifact@v7
        with:
          name: server-release-${{ github.run_id }}
          overwrite: true
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload release images
        uses: actions/upload-artifact@v7
        with:
          name: release-images-${{ github.run_id }}
          overwrite: true
          path: .context/release-images/images.tar
          if-no-files-found: error
          retention-days: 7

  # Publication uses the initial approval and requires every build to succeed.
  # Every step can run again: Sweet reuses the draft and leaves a published
  # release unchanged, and the image tags point at the same images.
  release:
    needs: [approve-release, build-server-release, assemble-desktop-release, publish-chatto-client]
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: chatto-release-publication-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      # Publication scripts come from the commit of this run, not from the
      # tagged commit. A manual run that publishes an older tag again then uses
      # the current, retry-safe scripts.
      - name: Check out the publication scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .context/release-tools
          persist-credentials: false
          sparse-checkout: tools/release

      - name: Download server release archives
        uses: actions/download-artifact@v8
        with:
          name: server-release-${{ github.run_id }}
          path: .context/server-release

      - name: Download assembled desktop assets
        uses: actions/download-artifact@v8
        with:
          name: desktop-release-verification-${{ github.run_id }}
          path: .context/desktop-release

      - name: Download release images
        uses: actions/download-artifact@v8
        with:
          name: release-images-${{ github.run_id }}
          path: .context/release-images

      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          (cd .context/server-release && sha256sum --check ./*_checksums.txt)
          (cd .context/desktop-release && sha256sum --check chatto-desktop_checksums.txt)
          docker load --input .context/release-images/images.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sweet Release 0.5.0, pinned by commit (see bump-releases.yml).
      - uses: chattocorp/sweet-release/.github/actions/bootstrap@70a402d3552871474f3a0f152fb2795592ec714a # sweet@0.5.0
        with:
          sweet-version: sweet@0.5.0

      # The draft gets the title `Chatto <version>` and the changelog entry.
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
        run: sweet github release "$TAG" --draft .context/server-release/* .context/desktop-release/*

      - name: Publish release images
        env:
          PRERELEASE: ${{ inputs.prerelease }}
          HIGHEST: ${{ inputs.highest }}
        run: bash .context/release-tools/tools/release/publish-images.sh

      # Sweet sets prerelease from the version and makes only the highest
      # stable Chatto version the repository's Latest release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
        run: sweet github release "$TAG"

      - name: Update Homebrew tap
        if: ${{ inputs.highest }}
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: bash .context/release-tools/tools/release/update-homebrew.sh

  publish-stable-docs:
    needs: release
    if: ${{ inputs.highest }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docs-image.yml
    with:
      channel: stable
      # The stable docs build reads its version from the exact tag.
      ref: ${{ inputs.tag }}
