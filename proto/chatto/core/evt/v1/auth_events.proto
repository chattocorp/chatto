syntax = "proto3";

package chatto.core.evt.v1;

import "google/protobuf/timestamp.proto";
import "chatto/core/evt/v1/models.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/evt/v1;evtv1";

message RegistrationVerificationCodeIssuedEvent {
  string email_hash = 1;
  google.protobuf.Timestamp expires_at = 2;
  AuditRequestMetadata request = 3;
}

message EmailVerificationCodeIssuedEvent {
  string user_id = 1;
  string email_hash = 2;
  google.protobuf.Timestamp expires_at = 3;
  AuditRequestMetadata request = 4;
}

message PasswordResetLinkIssuedEvent {
  string user_id = 1;
  string email_hash = 2;
  google.protobuf.Timestamp expires_at = 3;
  AuditRequestMetadata request = 4;
}

message AccountDeletionConfirmationIssuedEvent {
  string user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  AuditRequestMetadata request = 3;
}

message PasswordResetCompletedEvent {
  string user_id = 1;
  AuditRequestMetadata request = 2;
}

message LoginSucceededEvent {
  string user_id = 1;
  string identifier_hash = 2;
  AuditRequestMetadata request = 3;
}

message LoginFailedEvent {
  string identifier_hash = 1;
  AuditRequestMetadata request = 2;
}

message LogoutSucceededEvent {
  string user_id = 1;
  AuditRequestMetadata request = 2;
}

message AuthCodeIssuedEvent {
  string user_id = 1;
  string redirect_uri_hash = 2;
  google.protobuf.Timestamp expires_at = 3;
  AuditRequestMetadata request = 4;
}

message AuthCodeExchangeSucceededEvent {
  string user_id = 1;
  string redirect_uri_hash = 2;
  AuditRequestMetadata request = 3;
}

message AuthCodeExchangeFailedEvent {
  string user_id = 1;
  string redirect_uri_hash = 2;
  string reason = 3;
  AuditRequestMetadata request = 4;
}

message BearerTokenIssuedEvent {
  string user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  string source = 3;
  AuditRequestMetadata request = 4;
}

message BearerTokenRevokedEvent {
  string user_id = 1;
  string reason = 2;
  AuditRequestMetadata request = 3;
}

message OAuthConsentGrantedEvent {
  string user_id = 1;
  string redirect_origin = 2;
  AuditRequestMetadata request = 3;
  string client_id = 4;
  string client_name = 5;
  string client_uri = 6;
}

message OAuthConsentDeniedEvent {
  string user_id = 1;
  string redirect_origin = 2;
  AuditRequestMetadata request = 3;
  string client_id = 4;
  string client_name = 5;
  string client_uri = 6;
}

// OAuthScopedConsentGrantedEvent records one exact resource and scope grant.
// This separate event prevents an older projector from treating a scoped grant
// as legacy broad OAuth consent.
message OAuthScopedConsentGrantedEvent {
  string user_id = 1;
  string redirect_origin = 2;
  AuditRequestMetadata request = 3;
  string client_id = 4;
  string client_name = 5;
  string client_uri = 6;
  string resource = 7;
  repeated string scopes = 8;
}

// OAuthScopedConsentDeniedEvent records denial of one exact resource and scope
// grant without changing the approved grant set.
message OAuthScopedConsentDeniedEvent {
  string user_id = 1;
  string redirect_origin = 2;
  AuditRequestMetadata request = 3;
  string client_id = 4;
  string client_name = 5;
  string client_uri = 6;
  string resource = 7;
  repeated string scopes = 8;
}
