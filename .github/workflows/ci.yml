name: ci

on:
  push:
    branches:
      - main
      - 'release-[0-9]*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  # PRs share a group so superseded revisions are cancelled. Pushes use their
  # immutable commit SHA so each selected main commit can publish an image.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chatto: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.chatto == 'true' }}
      desktop: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.desktop == 'true' }}
      authling: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.authling == 'true' }}
      translatto: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.translatto == 'true' }}
      runling: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.runling == 'true' }}
      chattobot: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.chattobot == 'true' }}
      botto: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.botto == 'true' }}
      docs: ${{ steps.select.outputs.common == 'true' || steps.select.outputs.docs == 'true' }}
    steps:
      # Push filters use git; pull request filters use the GitHub API.
      - name: Checkout for push change detection
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Select affected products
        id: select
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Compare the exact push endpoints, including multi-commit pushes.
          # Pull requests use the API and do not need these git inputs.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.event_name == 'push' && github.sha || '' }}
          predicate-quantifier: some-with-excludes
          # Release-please writes changelogs and the release manifest. Only
          # release tooling reads the changelogs, so they do not select product
          # jobs. Of the products, only a Runling test reads the manifest.
          # Version files in release pull requests still select their product.
          filters: |
            chatto:
              # Authling changes must also verify login and profile transfer into Chatto.
              - 'authling/**'
              - 'cli/**'
              - 'pkg/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - 'proto/**'
              - 'docker/**'
              - '!**/CHANGELOG.md'
            authling:
              # Go workspace dependency selection can change across product modules.
              - 'cli/go.{mod,sum}'
              - 'authling/**'
              - 'pkg/**'
              - '!**/CHANGELOG.md'
            translatto:
              - 'packages/translatto/**'
              - '.release-please-config.json'
              - '.release-please-manifest.json'
              - '!**/CHANGELOG.md'
            runling:
              - 'packages/runling/**'
              # The Runling bot example uses the Chatto client.
              - 'packages/chatto-client/**'
              - 'packages/api-types/**'
              - 'examples/runling-bot/**'
              # A release test compares the manifest with the Runling version.
              - '.release-please-manifest.json'
              - '!**/CHANGELOG.md'
            chattobot:
              - 'packages/chattobot/**'
              - 'packages/runling/**'
              - 'packages/chatto-client/**'
              - 'packages/api-types/**'
              - 'proto/**'
              - '!**/CHANGELOG.md'
            botto:
              - 'examples/botto/**'
              - 'packages/runling/**'
              - 'packages/chatto-client/**'
              - 'packages/api-types/**'
              - 'proto/**'
              - '!**/CHANGELOG.md'
            docs:
              - 'apps/docs-website/**'
              - '!**/CHANGELOG.md'
            desktop:
              - 'apps/desktop/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - '!packages/runling/**'
              - 'proto/**'
              - 'tools/test-desktop-*'
              - '!**/CHANGELOG.md'
            # Files outside product roots and repository documentation run all products.
            common:
              - '**'
              - '!{cli,pkg,authling,packages,proto,docker}/**'
              - '!apps/{frontend,desktop,docs-website}/**'
              - '!examples/botto/**'
              - '!tools/test-desktop-*'
              - '!{docs,.agents,.claude,.conductor}/**'
              # Experimental modules have their own workflow.
              - '!experimental/**'
              - '!*.md'
              - '!.release-please-manifest.json'

  test-translatto-package:
    needs: changes
    if: ${{ needs.changes.outputs.translatto == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise x -- pnpm --filter @chatto/translatto check
      - run: mise x -- pnpm --filter @chatto/translatto test
      - run: mise x -- pnpm --filter @chatto/translatto test:package
        env:
          TRANSLATTO_RELEASE_DIR: ${{ runner.temp }}/translatto-release
      - uses: actions/upload-artifact@v7
        with:
          name: translatto-package
          path: ${{ runner.temp }}/translatto-release/*.tgz
          if-no-files-found: error

  test-runling:
    needs: changes
    if: ${{ needs.changes.outputs.runling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise check-runling
      - run: mise test-runling
      - run: mise test-runling-bot
      - run: mise test-runling-package
      - run: mise x -- pnpm --filter runling test:server

  test-botto:
    needs: changes
    if: ${{ needs.changes.outputs.botto == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise x -- pnpm --filter runling build:runtime
      - run: mise x -- pnpm --filter @chatto/example-botto check
      - name: Test Botto without network access
        working-directory: examples/botto
        # Pi tests use mocks or local transcripts. A separate network namespace
        # also prevents accidental provider requests, including from child processes.
        run: sudo unshare --net -- env PI_OFFLINE=1 "$(mise which node)" node_modules/vitest/vitest.mjs run

  test-chattobot:
    needs: changes
    if: ${{ needs.changes.outputs.chattobot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise check-chattobot
      - run: mise test-chatto-client
      - run: mise x -- pnpm --filter @chatto/client test:package
      - run: mise test-chattobot

  build-main-image-contexts:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.chatto == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-version: ${{ steps.image-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          save-go-build-cache: 'true'
          turbo-remote-cache: 'false'

      - name: Derive main image version
        id: image-version
        shell: bash
        run: |
          set -euo pipefail

          development_version="$(mise env --json | jq -r '.CHATTO_DEVELOPMENT_VERSION // empty')"
          if [[ -z "$development_version" ]]; then
            echo "::error::Could not read CHATTO_DEVELOPMENT_VERSION from mise.toml."
            exit 1
          fi

          echo "version=${development_version}+${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build frontend for production image
        env:
          CHATTO_BUILD_VERSION: ${{ steps.image-version.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: '1'
        run: mise build-frontend

      - name: Verify frontend build version
        env:
          EXPECTED_VERSION: ${{ steps.image-version.outputs.version }}
        shell: bash
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Build production image contexts
        shell: bash
        env:
          VERSION: ${{ steps.image-version.outputs.version }}
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            context=".context/ci/docker/linux-${arch}"
            mkdir -p "$context/docker" "$context/LICENSES"
            cp docker/Dockerfile.goreleaser "$context/Dockerfile"
            cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
            cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
            cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
            cp NOTICE "$context/NOTICE"
            (
              cd cli
              # Chatto does not expose Gin's MessagePack binding; omit its large codec.
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -tags=nomsgpack,nodynamic \
                -ldflags="-s -w -X main.Version=${VERSION}" \
                -o "../$context/chatto" .
            )
          done

      - name: Upload production image contexts
        uses: actions/upload-artifact@v7
        with:
          name: production-image-contexts
          path: .context/ci/docker
          retention-days: 1

  license-check:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Check license metadata
        run: mise license-check

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Check workflows and shell scripts
        run: mise lint-actions

      - name: Test release publication policy
        run: mise test-release-policy

      - name: Test interchange format contract
        run: mise test-interchange

      - name: Test development launchers and routing
        run: mise test-dev-tooling

  desktop:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    name: desktop (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            artifact-path: apps/desktop/dist/chatto-desktop
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            artifact-path: apps/desktop/dist/chatto-desktop
          - platform: macos
            os: macos-15
            artifact-path: apps/desktop/dist/Chatto.app
          - platform: windows
            os: windows-latest
            artifact-path: apps/desktop/dist/windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Cache macOS capture helper build
        if: runner.os == 'macOS'
        uses: ./.github/actions/cache-macos-capture-probe
        with:
          configuration: release

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Build desktop bundle
        run: mise desktop-build

      - name: Verify desktop bundle exists
        shell: bash
        env:
          ARTIFACT_PATH: ${{ matrix.artifact-path }}
        run: test -e "$ARTIFACT_PATH"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: mise x -- pnpm --filter chatto-desktop build:windows-installer

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: mise x -- pnpm --filter chatto-desktop build:linux-appimage

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: chatto-desktop-linux-appimage-${{ runner.arch }}
          path: apps/desktop/dist/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem apps/desktop/dist/installer/*_Setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./tools/test-desktop-windows-installer.ps1 -Installer $installer[0].FullName
          $msi = @(Get-ChildItem apps/desktop/dist/installer/*_Setup.msi)
          if ($msi.Count -ne 1) { throw 'Expected one Windows MSI package.' }
          mise x -- pnpm --filter chatto-desktop build:windows-installer --msi-upgrade-fixture
          if ($LASTEXITCODE -ne 0) { throw 'MSI upgrade fixture build failed.' }
          ./tools/test-desktop-windows-msi.ps1 -Installer $msi[0].FullName -PreviousInstaller apps/desktop/dist/msi-upgrade-fixture/upgrade-fixture.msi

      - name: Upload unsigned Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: chatto-desktop-windows-installer-unsigned
          path: |
            apps/desktop/dist/installer/*_Setup.exe
            apps/desktop/dist/installer/*_Setup.msi
          if-no-files-found: error
          retention-days: 7

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/Chatto.app"

      - name: Verify macOS game-capture helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper="apps/desktop/dist/Chatto.app/Contents/Helpers/Chatto Capture Helper.app/Contents/MacOS/chatto-macos-capture-probe"
          test -x "$helper"
          "$helper" help | grep -F 'publish --window'
          otool -l "$helper" | grep -F '@executable_path/../Frameworks'

      - name: Build and test unsigned macOS DMG
        if: runner.os == 'macOS'
        run: |
          mise x -- pnpm --filter chatto-desktop build:macos-dmg
          bash tools/test-desktop-macos-dmg.sh apps/desktop/dist/dmg/*.dmg

      - name: Upload unsigned macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: chatto-desktop-macos-dmg-unsigned
          path: apps/desktop/dist/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: chatto-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  desktop-macos-capture:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache macOS capture helper build
        uses: ./.github/actions/cache-macos-capture-probe
        with:
          configuration: debug

      - name: Test macOS game-capture helper
        run: tools/test-desktop-macos-capture.sh

  codegen-proto-drift:
    needs: changes
    if: ${{ !cancelled() }}
    # Always verify selection, but skip product checks for unrelated changes.
    env:
      RUN_PROTO_CHECKS: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify job selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success

      - name: Checkout code
        if: env.RUN_PROTO_CHECKS == 'true'
        uses: actions/checkout@v6
        with:
          # The threshold check compares the PR head with its merge base.
          fetch-depth: 0

      - name: Setup environment
        if: env.RUN_PROTO_CHECKS == 'true'
        uses: ./.github/actions/setup

      - name: Test server compatibility label check
        if: env.RUN_PROTO_CHECKS == 'true'
        run: mise x -- node --test tools/check-server-compatibility.test.mjs

      - name: Test Slack importer
        if: env.RUN_PROTO_CHECKS == 'true'
        run: mise test-slack

      - name: Check server compatibility threshold labels
        if: env.RUN_PROTO_CHECKS == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          mise x -- node tools/check-server-compatibility.mjs

      # Breaking checks compare a pull request with its target branch. A push
      # has already passed them as a pull request, and labels that acknowledge
      # public API breaks exist only on pull requests. The target branch can
      # also move during a push run, so a shallow fetch of it is not stable.
      - name: Fetch protobuf breaking base
        if: env.RUN_PROTO_CHECKS == 'true' && github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          git fetch --no-tags origin "${base_ref}:refs/remotes/origin/${base_ref}"

      - name: Lint Chatto protobufs
        if: env.RUN_PROTO_CHECKS == 'true'
        run: mise lint-proto

      - name: Check storage, internal, and Operator protobuf breaking changes
        if: env.RUN_PROTO_CHECKS == 'true' && github.event_name == 'pull_request'
        run: |
          mise x -- node --test tools/check-storage-proto-breaking.test.mjs
          base_ref="${GITHUB_BASE_REF}"
          mise x -- node tools/check-storage-proto-breaking.mjs \
            "../.git#branch=origin/${base_ref},subdir=proto"

      - name: Check projection snapshot schema contracts
        if: env.RUN_PROTO_CHECKS == 'true'
        working-directory: cli
        run: mise x -- go test ./internal/core -run TestProjectionSnapshotContractsIncludeCurrentSchema -count=1

      - name: Check public protobuf packages without acknowledged breaks
        if: env.RUN_PROTO_CHECKS == 'true' && github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          cd proto
          labels='${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}'
          # Check each package once; imported packages have their own checks and labels.
          for package in auth discovery api admin realtime; do
            if [[ ",${labels}," == *",api-breaking-change:${package},"* ]]; then
              echo "::notice::Skipping acknowledged ${package} protobuf break."
              continue
            fi
            path="chatto/${package}/v1"
            mise x -- buf breaking . --against "../.git#branch=origin/${base_ref},subdir=proto" --path "$path" --exclude-imports
          done

      - name: Check Authling persisted protobuf breaking changes
        if: env.RUN_PROTO_CHECKS == 'true' && github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          if git cat-file -e "origin/${base_ref}:authling/buf.yaml" 2>/dev/null; then
            cd authling
            mise x -- buf breaking . \
              --against "../.git#branch=origin/${base_ref},subdir=authling" \
              --exclude-imports
          else
            echo "::notice::Authling protobufs are new; no base schema exists yet."
          fi

      - name: Lint Authling protobufs
        if: env.RUN_PROTO_CHECKS == 'true'
        working-directory: authling
        run: mise x -- buf lint

      - name: Regenerate protobuf bindings
        if: env.RUN_PROTO_CHECKS == 'true'
        run: |
          mise codegen-proto
          cd authling
          mise codegen-proto

      - name: Check generated protobuf bindings are current
        if: env.RUN_PROTO_CHECKS == 'true'
        run: |
          if ! git diff --exit-code; then
            git status --short
            exit 1
          fi

  check-workspace:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.desktop == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Run workspace typechecks
        run: pnpm run check

      - name: Run workspace linters
        run: pnpm run lint

      - name: Build Storybook design-system catalog
        run: pnpm run build:storybook

  test-workspace-packages:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # The frontend suite is the longest, so it runs on its own runner. The other
    # entry excludes only the frontend, so new workspace tests run without a
    # matrix change.
    name: test-workspace (${{ matrix.name }})
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    # Only browser tests need the image; other workspace tests use the host.
    container:
      image: ${{ matrix.playwright && 'ghcr.io/chattocorp/media-e2e@sha256:51b6faaf77532ea291a0840bc53200199722d048aa31cf7490d9278649957287' || '' }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            filter: chatto-frontend
            playwright: true
          - name: packages
            filter: '!chatto-frontend'
            playwright: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trust the mounted checkout
        if: matrix.playwright
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Setup Playwright
        if: matrix.playwright
        uses: ./.github/actions/setup-playwright
        with:
          use-image: 'true'

      - name: Run workspace unit tests
        env:
          TURBO_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run test --concurrency=1 "--filter=$TURBO_FILTER"

  test-workspace:
    needs: [changes, test-workspace-packages]
    if: ${{ always() && needs.changes.outputs.chatto == 'true' }}
    # Keep this job name stable because it can be a required branch check.
    runs-on: ubuntu-latest
    steps:
      - name: Verify workspace test jobs
        env:
          PACKAGES_RESULT: ${{ needs.test-workspace-packages.result }}
        run: test "$PACKAGES_RESULT" = success

  test-cli-shared:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-cli-shared
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Authling tests
        if: needs.changes.outputs.authling == 'true'
        working-directory: authling
        run: mise test

      - name: Lint shared Go modules
        run: |
          mise lint-appconfig
          mise lint-datacrypto
          mise lint-events
          mise lint-jetstreamutil
          mise lint-natsruntime

      - name: Run application configuration tests
        run: mise test-appconfig

      - name: Run data cryptography tests
        run: mise test-datacrypto

      - name: Run event framework tests
        run: mise test-events

      - name: Run JetStream utility tests
        run: mise test-jetstreamutil

      - name: Run embedded NATS runtime tests
        run: mise test-natsruntime

  test-cli-chatto:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-cli-chatto
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build frontend
        run: mise build-frontend

      - name: Verify development build freshness
        run: mise test-chatto-build

      - name: Verify development data seeding
        run: mise x -- node tools/dev-seed-smoke.mjs

      - name: Run Go tests
        run: cd cli && go test -trimpath -tags test_endpoints ./...

  lint-cli:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: lint-cli
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # staticcheck keeps its analysis results outside the Go build cache.
      - name: Restore staticcheck cache
        id: staticcheck-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/staticcheck
          key: staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cli/go.sum') }}-${{ github.sha }}
          restore-keys: |
            staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cli/go.sum') }}-
            staticcheck-${{ runner.os }}-${{ runner.arch }}-

      - name: Vet and check Go code for unused code and outdated idioms
        run: mise lint-cli

      - name: Save staticcheck cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/staticcheck
          key: ${{ steps.staticcheck-cache.outputs.cache-primary-key }}

  test-oidc-conformance:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Authling toolchain and browser dependencies
        working-directory: authling
        run: |
          mise install
          mise deps-web
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: authling
      - name: Configure Docker Hub mirror for conformance containers
        # Compose pulls images through Docker, outside the BuildKit configuration.
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          mirrors = config.get("registry-mirrors", [])
          config["registry-mirrors"] = ["https://mirror.gcr.io"] + [
              mirror for mirror in mirrors if mirror != "https://mirror.gcr.io"
          ]
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config) + "\n")
          PY
          sudo systemctl restart docker
      - name: Run official provider and client checks
        run: mise test-oidc-conformance
      - name: Upload outcome summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: oidc-conformance-results
          path: authling/conformance-results.json
          retention-days: 14

  test-cli:
    needs: [changes, test-cli-shared, test-cli-chatto, lint-cli]
    if: ${{ always() && (needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLI test and lint jobs
        env:
          CHATTO_CHANGED: ${{ needs.changes.outputs.chatto }}
          SHARED_RESULT: ${{ needs.test-cli-shared.result }}
          CHATTO_RESULT: ${{ needs.test-cli-chatto.result }}
          LINT_RESULT: ${{ needs.lint-cli.result }}
        run: |
          test "$SHARED_RESULT" = success
          if [[ "$CHATTO_CHANGED" == true ]]; then
            test "$CHATTO_RESULT" = success
            test "$LINT_RESULT" = success
          fi

  test-authling-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.authling == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/chattocorp/media-e2e@sha256:51b6faaf77532ea291a0840bc53200199722d048aa31cf7490d9278649957287
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Authling E2E dependencies
        working-directory: authling
        run: |
          mise install
          mise deps-web

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: authling
          use-image: 'true'

      - name: Run Authling E2E tests
        working-directory: authling
        run: mise test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: authling-playwright-report
          path: |
            authling/playwright-report/
            authling/test-results/
          retention-days: 14

  test-e2e-shards:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/chattocorp/media-e2e@sha256:51b6faaf77532ea291a0840bc53200199722d048aa31cf7490d9278649957287
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    # Each shard spends about two minutes on setup and builds, so more shards
    # give less benefit. The test-e2e job reports the result of all shards.
    name: test-e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-e2e
          # Only one matrix job writes the cache. All E2E jobs can restore it
          # on the next run without concurrent cache-save attempts.
          save-go-build-cache: ${{ matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          use-image: 'true'

      - name: Build E2E dependencies
        run: |
          mise build-e2e-server
          mise build-runling-bot

      - name: Run E2E tests
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results.json
        run: |
          cd apps/frontend
          node --test scripts/run-e2e-shard.test.mjs
          node scripts/run-e2e-shard.mjs "$E2E_SHARD" --grep-invert @ffmpeg

      - name: Upload E2E timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: apps/frontend/e2e-results.json
          retention-days: 14

      - name: Report disk use after E2E
        if: always()
        run: bash "$GITHUB_WORKSPACE/tools/ci-disk-usage.sh"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e:
    needs: [changes, test-e2e-shards]
    if: ${{ always() && needs.changes.outputs.chatto == 'true' }}
    # Keep this job name stable because it can be a required branch check.
    runs-on: ubuntu-latest
    steps:
      - name: Verify E2E shards
        env:
          SHARDS_RESULT: ${{ needs.test-e2e-shards.result }}
        run: test "$SHARDS_RESULT" = success

  test-e2e-media:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    # Update this digest in a PR to verify a new image before changing main.
    container:
      image: ghcr.io/chattocorp/media-e2e@sha256:51b6faaf77532ea291a0840bc53200199722d048aa31cf7490d9278649957287
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - name: Check selected image
        run: |
          test -f /opt/media-e2e-playwright-version
          ffmpeg -version
          ffprobe -version

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trust the mounted checkout
        # The runner owns the mount; the container builds as root. Checkout's
        # temporary Git configuration does not apply to later Go VCS stamping.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain

      - name: Setup environment
        uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          go-build-cache-scope: test-e2e

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          use-image: 'true'

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run media E2E tests
        run: cd apps/frontend && pnpm exec playwright test --grep @ffmpeg

      - name: Report disk use after media E2E
        if: always()
        run: bash "$GITHUB_WORKSPACE/tools/ci-disk-usage.sh"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-media
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e-performance:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/chattocorp/media-e2e@sha256:51b6faaf77532ea291a0840bc53200199722d048aa31cf7490d9278649957287
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-e2e

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          use-image: 'true'

      - name: Install performance summary dependency
        run: |
          apt-get update
          apt-get install --no-install-recommends -y jq

      - name: Build E2E server
        run: mise build-e2e-server

      # Runner speed changes from run to run, so CI reports the measurements
      # and does not compare them with other runs. Compare a baseline and a
      # candidate on the same machine with mise compare-e2e-performance.
      - name: Run large-server E2E performance test
        run: mise test-e2e-performance

      - name: Report disk use after performance E2E
        if: always()
        run: bash "$GITHUB_WORKSPACE/tools/ci-disk-usage.sh"

      - name: Summarize performance results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          result=$(find apps/frontend/test-results/performance -name performance-results.json -print -quit 2>/dev/null || true)
          if [[ -z "$result" ]]; then
            echo "No performance results were written."
            exit 0
          fi
          {
            echo "## Large-server E2E performance"
            echo ""
            echo "> Runner speed changes from run to run. Do not compare these values with other runs."
            echo ""
            jq -r '"Fixture: \(.measurements.syntheticUsers) users, \(.measurements.messages) messages; \(.measurements.sampleCount)-sample medians (\(.measurements.startupMode) startup)"' "$result"
            echo ""
            echo "| Measurement | Duration (ms) |"
            echo "| --- | ---: |"
            jq -r '.measurements | to_entries[] | select(.key | endswith("Ms")) | "| \(.key) | \(.value | round) |"' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: e2e-performance-results
          path: |
            apps/frontend/test-results/performance/
            apps/frontend/playwright-report-performance/
          retention-days: 30

  publish-main-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.chatto == 'true'
    needs:
      - changes
      - build-main-image-contexts
      - license-check
      - workflow-lint
      - codegen-proto-drift
      - check-workspace
      - test-workspace
      - test-cli
      - test-e2e
      - test-e2e-media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download production image contexts
        uses: actions/download-artifact@v8
        with:
          name: production-image-contexts
          path: docker-contexts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Start BuildKit from the mirror before its registry configuration applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Try the public mirror first to reduce Docker Hub rate limits.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable main image tag
        id: main-image
        shell: bash
        run: echo "tag=main-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: docker-contexts/linux-amd64
          file: docker-contexts/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-amd64
          cache-from: type=gha,scope=chatto-main-amd64
          cache-to: type=gha,scope=chatto-main-amd64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: docker-contexts/linux-arm64
          file: docker-contexts/linux-arm64/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-arm64
          cache-from: type=gha,scope=chatto-main-arm64
          cache-to: type=gha,scope=chatto-main-arm64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Publish multi-platform commit image
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/chattocorp/chatto:${GITHUB_SHA}" \
            --tag "ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-amd64" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-arm64"

          {
            echo "### Main commit image"
            echo
            echo "\`ghcr.io/chattocorp/chatto:${GITHUB_SHA}\`"
            echo "\`ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}\`"
            echo
            echo "Version: \`${{ needs.build-main-image-contexts.outputs.image-version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  check-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: pnpm turbo run check --filter=docs-website
      - run: pnpm run build:docs
