services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    command: ["--smtp", "0.0.0.0:1025", "--listen", "0.0.0.0:8025"]
    labels:
      dev.orbstack.http-port: "8025"

  livekit:
    image: livekit/livekit-server:v1.13.5
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        keys:
          devkey: compose-only-livekit-secret-change-me
        webhook:
          urls:
            - https://chatto.${COMPOSE_PROJECT_NAME}.orb.local/webhooks/livekit
          api_key: devkey
        logging:
          level: info
    labels:
      dev.orbstack.http-port: "7880"

  docs-website:
    build:
      context: .
      dockerfile: apps/docs-website/Dockerfile
      args:
        CHATTO_DOCS_SITE_URL: https://docs-website.${COMPOSE_PROJECT_NAME}.orb.local
    labels:
      dev.orbstack.http-port: "8080"

  storybook:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["docker/compose-dev-entrypoint.sh", "storybook"]
    init: true
    volumes:
      - type: bind
        source: .
        target: /workspace
      - storybook_node_modules:/workspace/node_modules
      - storybook_frontend_node_modules:/workspace/apps/frontend/node_modules
      - storybook_api_types_node_modules:/workspace/packages/api-types/node_modules
      - storybook_lingua_node_modules:/workspace/packages/lingua/node_modules
      - storybook_pnpm_store:/pnpm-store
    labels:
      dev.orbstack.http-port: "8080"
    develop:
      watch:
        - action: rebuild
          path: docker/Dockerfile.dev
        - action: restart
          path: docker/compose-dev-entrypoint.sh
        - action: restart
          path: package.json
        - action: restart
          path: pnpm-lock.yaml
        - action: restart
          path: pnpm-workspace.yaml
        - action: restart
          path: .npmrc
        - action: restart
          path: apps/frontend/package.json
        - action: restart
          path: packages/api-types/package.json
        - action: restart
          path: packages/lingua/package.json

  authling:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["docker/compose-dev-entrypoint.sh", "authling"]
    init: true
    depends_on:
      mailpit:
        condition: service_started
    environment:
      AUTHLING_HTTP_BIND_ADDRESS: 0.0.0.0:8080
      AUTHLING_HTTP_PUBLIC_URL: https://authling.${COMPOSE_PROJECT_NAME}.orb.local
      AUTHLING_AUTHENTICATION_PASSWORD_MINIMUM_LENGTH: "10"
      AUTHLING_OIDC_CIMD_TRUSTED_PRIVATE_HOSTS: chatto.${COMPOSE_PROJECT_NAME}.orb.local
      AUTHLING_NATS_REPLICAS: "1"
      AUTHLING_NATS_EMBEDDED_ENABLED: "true"
      AUTHLING_NATS_EMBEDDED_DATA_DIR: /data/nats
      AUTHLING_SMTP_ENABLED: "true"
      AUTHLING_SMTP_HOST: mailpit
      AUTHLING_SMTP_PORT: "1025"
      AUTHLING_SMTP_TLS: opportunistic
      AUTHLING_SMTP_FROM: authling@authling.local
    volumes:
      - type: bind
        source: .
        target: /workspace
      - authling_data:/data
      - authling_node_modules:/workspace/authling/node_modules
      - authling_web_node_modules:/workspace/authling/web/node_modules
      - authling_pnpm_store:/pnpm-store
      - compose_go_mod_cache:/go/pkg/mod
      - compose_go_build_cache:/root/.cache/go-build
    labels:
      dev.orbstack.http-port: "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "Host: authling.${COMPOSE_PROJECT_NAME}.orb.local", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    develop:
      watch:
        - action: rebuild
          path: docker/Dockerfile.dev
        - action: restart
          path: docker/compose-dev-entrypoint.sh
        - action: restart
          path: authling/package.json
        - action: restart
          path: authling/pnpm-lock.yaml
        - action: restart
          path: authling/pnpm-workspace.yaml
        - action: restart
          path: authling/.npmrc
        - action: restart
          path: authling/web/package.json

  chatto:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    command: ["docker/compose-dev-entrypoint.sh", "chatto"]
    init: true
    depends_on:
      authling:
        condition: service_healthy
      livekit:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      CHATTO_DEVELOPMENT_VERSION: 0.5.0-dev
      CHATTO_BACKEND_URL: http://127.0.0.1:4001
      CHATTO_LOG_LEVEL: debug
      CHATTO_LOG_FORMAT: text
      CHATTO_WEBSERVER_URL: https://chatto.${COMPOSE_PROJECT_NAME}.orb.local
      CHATTO_WEBSERVER_PORT: "4001"
      CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET: 871a846584490a6153305533cce100b8e6f39d4184c2fb499d2ed198a9ed37a3
      CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET: a3955a342ba4cb4ffb457a1177295779fbbb73f8e22cd4f68ecb9fb584afcf66
      CHATTO_FRONTEND_AUTHLING_ISSUER: https://authling.${COMPOSE_PROJECT_NAME}.orb.local
      CHATTO_OPERATOR_API_ENABLED: "false"
      CHATTO_SEARCH_ENABLED: "true"
      CHATTO_SEARCH_PROVIDER_ENABLED: "true"
      CHATTO_SEARCH_PROVIDER_DIRECTORY: /data/search
      CHATTO_SEARCH_PROVIDER_LANGUAGES: de,en
      CHATTO_CORE_SECRET_KEY: 2ff88b0e8ceb09c399193d1b9339577e6b0fac883777176231e84f92aa78f794
      CHATTO_CORE_PROJECTION_SNAPSHOTS: "true"
      CHATTO_CORE_ASSETS_SIGNING_SECRET: 2e5cac66f8ea81759952186886d233410c1e6e18e3048bc680792935206240e0
      CHATTO_CORE_ASSETS_MAX_UPLOAD_SIZE: 25MB
      CHATTO_CORE_ASSETS_CACHE_ENABLED: "true"
      CHATTO_CORE_ASSETS_CACHE_TTL: 7d
      CHATTO_AUTH_ACCOUNT_CREATION_POLICY: invite_only
      CHATTO_AUTH_PROVIDERS_0_ID: authling
      CHATTO_AUTH_PROVIDERS_0_TYPE: oidc
      CHATTO_AUTH_PROVIDERS_0_LABEL: Authling
      CHATTO_AUTH_PROVIDERS_0_ISSUER_URL: https://authling.${COMPOSE_PROJECT_NAME}.orb.local
      CHATTO_AUTH_PROVIDERS_0_CLIENT_ID: https://chatto.${COMPOSE_PROJECT_NAME}.orb.local/oauth/client-metadata.json
      CHATTO_AUTH_PROVIDERS_0_SCOPES: openid
      CHATTO_AUTH_PROVIDERS_0_REQUEST_EMAIL: "false"
      CHATTO_AUTH_PROVIDERS_0_AUTO_PROVISION: "true"
      CHATTO_SMTP_ENABLED: "true"
      CHATTO_SMTP_HOST: mailpit
      CHATTO_SMTP_PORT: "1025"
      CHATTO_SMTP_TLS: opportunistic
      CHATTO_SMTP_FROM: chatto@chatto.local
      CHATTO_VIDEO_ENABLED: "true"
      CHATTO_ASSET_PROCESSING_ENABLED: "true"
      CHATTO_LIVEKIT_ENABLED: "true"
      CHATTO_LIVEKIT_URL: wss://livekit.${COMPOSE_PROJECT_NAME}.orb.local
      CHATTO_LIVEKIT_API_KEY: devkey
      CHATTO_LIVEKIT_API_SECRET: compose-only-livekit-secret-change-me
      CHATTO_LIVEKIT_WEBHOOK_URL: https://chatto.${COMPOSE_PROJECT_NAME}.orb.local/webhooks/livekit
      CHATTO_NATS_EMBEDDED_ENABLED: "true"
      CHATTO_NATS_EMBEDDED_DATA_DIR: /data/nats
      CHATTO_NATS_EMBEDDED_AUTH_TOKEN: a4a3102bf032b2d8ec14cf4c23fe54cb6a2054e1ad5e24aa4ada78768340e263
      CHATTO_BOOTSTRAP_USERS_0_LOGIN: alice
      CHATTO_BOOTSTRAP_USERS_0_DISPLAY_NAME: Alice
      CHATTO_BOOTSTRAP_USERS_0_EMAIL: alice@example.com
      CHATTO_BOOTSTRAP_USERS_0_PASSWORD: foobar123
      CHATTO_BOOTSTRAP_USERS_0_SERVER_ROLE: owner
      CHATTO_BOOTSTRAP_USERS_1_LOGIN: bob
      CHATTO_BOOTSTRAP_USERS_1_DISPLAY_NAME: Bob
      CHATTO_BOOTSTRAP_USERS_1_EMAIL: bob@example.com
      CHATTO_BOOTSTRAP_USERS_1_PASSWORD: foobar123
      CHATTO_BOOTSTRAP_SERVER_NAME: Chatto + Authling
      VITE_PORT: "4000"
    volumes:
      - type: bind
        source: .
        target: /workspace
      - chatto_data:/data
      - chatto_node_modules:/workspace/node_modules
      - chatto_frontend_node_modules:/workspace/apps/frontend/node_modules
      - chatto_api_types_node_modules:/workspace/packages/api-types/node_modules
      - chatto_lingua_node_modules:/workspace/packages/lingua/node_modules
      - chatto_pnpm_store:/pnpm-store
      - compose_go_mod_cache:/go/pkg/mod
      - compose_go_build_cache:/root/.cache/go-build
    labels:
      dev.orbstack.http-port: "4000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--header", "Host: chatto.${COMPOSE_PROJECT_NAME}.orb.local", "http://127.0.0.1:4001/readyz"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 20s
    develop:
      watch:
        - action: rebuild
          path: docker/Dockerfile.dev
        - action: restart
          path: docker/compose-dev-entrypoint.sh
        - action: restart
          path: package.json
        - action: restart
          path: pnpm-lock.yaml
        - action: restart
          path: pnpm-workspace.yaml
        - action: restart
          path: .npmrc
        - action: restart
          path: apps/frontend/package.json
        - action: restart
          path: packages/api-types/package.json
        - action: restart
          path: packages/lingua/package.json

volumes:
  authling_node_modules:
  authling_pnpm_store:
  authling_data:
  authling_web_node_modules:
  chatto_api_types_node_modules:
  chatto_data:
  chatto_frontend_node_modules:
  chatto_lingua_node_modules:
  chatto_node_modules:
  chatto_pnpm_store:
  compose_go_build_cache:
  compose_go_mod_cache:
  storybook_api_types_node_modules:
  storybook_frontend_node_modules:
  storybook_lingua_node_modules:
  storybook_node_modules:
  storybook_pnpm_store:
