syntax = "proto3";

package chatto.api.v1;

import "google/protobuf/duration.proto";

// Fully resolved configuration governing a room.
message RoomConfig {
  // Maximum message age for author edits. Zero disables author edits. Users
  // with message.manage remain unrestricted by this window.
  google.protobuf.Duration author_edit_window = 1;
}
