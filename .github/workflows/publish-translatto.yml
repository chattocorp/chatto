name: publish-translatto

on:
  push:
    tags:
      - 'translatto/v*'
  # Manual runs verify and save a package without publishing it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-translatto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-remote-cache: 'false'
          install-cli-deps: 'false'
      - name: Check package identity
        run: mise x -- pnpm --filter @chatto/translatto check:release --verify-only
      - name: Check release tag and registry history
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: mise x -- pnpm --filter @chatto/translatto check:release
      - run: mise x -- pnpm --filter @chatto/translatto check
      - run: mise x -- pnpm --filter @chatto/translatto test
      - name: Build and test the release tarball
        run: mise x -- pnpm --filter @chatto/translatto test:package
        env:
          TRANSLATTO_RELEASE_DIR: ${{ runner.temp }}/translatto-release
      - uses: actions/upload-artifact@v7
        with:
          name: translatto-package
          path: ${{ runner.temp }}/translatto-release/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v8
        with:
          name: translatto-package
          path: release
      - name: Publish the tested tarball with trusted publishing
        run: |
          shopt -s nullglob
          packages=(./release/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
