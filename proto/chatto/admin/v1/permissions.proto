syntax = "proto3";

package chatto.admin.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/roles.proto";
import "chatto/api/v1/pagination.proto";

// Trinary permission decision used by permission matrices and write requests.
enum PermissionDecision {
  // Unspecified decision; rejected for writes.
  PERMISSION_DECISION_UNSPECIFIED = 0;
  // Explicit allow.
  PERMISSION_DECISION_ALLOW = 1;
  // Explicit deny.
  PERMISSION_DECISION_DENY = 2;
  // No explicit decision; clears the permission state on writes.
  PERMISSION_DECISION_NONE = 3;
}

// Scope tier for permission matrices and write requests.
enum PermissionScopeKind {
  // Unspecified scope; treated as server scope where older clients omit it.
  PERMISSION_SCOPE_KIND_UNSPECIFIED = 0;
  // Server tier.
  PERMISSION_SCOPE_KIND_SERVER = 1;
  // Room-group tier.
  PERMISSION_SCOPE_KIND_GROUP = 2;
  // Room tier.
  PERMISSION_SCOPE_KIND_ROOM = 3;
  // Server-wide direct-message tier.
  PERMISSION_SCOPE_KIND_DM = 4;
}

// Permission scope reference.
message PermissionScope {
  // Scope tier.
  PermissionScopeKind kind = 1 [(buf.validate.field).enum.defined_only = true];
  // Scope ID for group or room scope. Empty for server or direct-message scope.
  string id = 2;
}

// Explicit permission grants of a role at a single tier.
message TierPermissions {
  reserved 2;
  reserved "permission_denials";

  // Explicitly granted permissions. Roles only grant, so a role has no
  // explicit denies.
  repeated string permissions = 1;
}

// One role's permission state at a single tier.
message TierRole {
  reserved 1 to 5, 8;
  reserved "role_name", "display_name", "description", "is_system", "position", "inherited_denials";

  // Explicit state at this tier.
  TierPermissions override = 6;
  // Allows inherited from broader tiers.
  repeated string inherited_allows = 7;
  // Public role metadata.
  chatto.api.v1.Role role = 9;
  // Permissions that a member with only this role is allowed at this tier.
  // The server resolves them with the same rules as authorization: the
  // everyone baseline and inclusion. They do not include settings on single
  // users, the owner override, or privileged mode. Other applicable
  // permissions have no allow, which means no access.
  repeated string effective_allows = 10;
}

// Role permission matrix for one tier.
message TierRoles {
  // Permissions configurable at this tier.
  repeated string applicable_permissions = 1;
  // Roles in role order, highest first.
  repeated TierRole roles = 2;
  // Applicable permissions that the caller may change at this tier. A caller
  // who is not an owner must hold the permission here.
  repeated string viewer_changeable_permissions = 3;
}

// Request a role-permission tier matrix.
message GetRolePermissionTierMatrixRequest {
  // Target scope. Omit or use SERVER for server scope.
  PermissionScope scope = 1;
}

// Response containing a role-permission tier matrix.
message GetRolePermissionTierMatrixResponse {
  // Requested matrix.
  TierRoles matrix = 1;
}

// Request an access summary for one channel room or room group.
message GetAccessSummaryRequest {
  // ROOM or GROUP scope with its id.
  PermissionScope scope = 1;
}

// Who can find and join a channel room, or the rooms of a room group. Explicit
// room members, and owners in privileged mode, have access whatever the
// summary says.
message GetAccessSummaryResponse {
  // Whether every member can find the room (room.list).
  bool everyone_can_list = 1;
  // Whether every member can join the room (room.join).
  bool everyone_can_join = 2;
  // Roles whose holders can find the room although everyone cannot, highest
  // first. Empty when everyone can.
  repeated string roles_can_list = 3;
  // Roles whose holders can join the room although everyone cannot, highest
  // first. Empty when everyone can.
  repeated string roles_can_join = 4;
}

// Matrix column scope.
message PermissionMatrixScope {
  // Stable scope ID for the server, direct messages, a group, or a room.
  string id = 1;
  // Human-readable label.
  string label = 2;
  // Scope tier.
  PermissionScopeKind kind = 3;
  // Parent group ID for room scopes.
  string parent_group_id = 4;
}

// Matrix cell for one permission and scope.
message PermissionMatrixCell {
  // Permission identifier.
  string permission = 1;
  // Scope ID matching PermissionMatrixScope.id.
  string scope_id = 2;
  // Explicit decision at this scope.
  PermissionDecision override = 3;
  // Effective decision at this scope. For a human account, this is the result
  // without privileged mode.
  PermissionDecision effective = 4;
  // Whether an explicit allow may currently be stored for this target. Absent
  // when no additional delegation ceiling applies.
  optional bool allow_permitted = 5;
  // For a human account, the effective decision while the account has
  // privileged mode active. It differs from effective for elevation-required
  // permissions and for owners. Unspecified for roles and bots.
  PermissionDecision effective_with_privileged_mode = 6;
  // Whether the caller may change this setting. A caller who is not an owner
  // must hold the permission at this scope. Absent for bot cells, which use
  // allow_permitted.
  optional bool viewer_can_change = 7;
}

// Permission matrix for one role within a scope page.
message RolePermissionMatrix {
  // Role name.
  string role_name = 1;
  // Permissions rendered as rows.
  repeated string applicable_permissions = 2;
  // Scopes rendered as columns.
  repeated PermissionMatrixScope scopes = 3;
  // Sparse matrix cells.
  repeated PermissionMatrixCell cells = 4;
}

// Request one role's permission matrix.
message GetRolePermissionMatrixRequest {
  // Stable role name.
  string role_name = 1 [(buf.validate.field).string.min_len = 1];
  // Include the direct-message scope column. Defaults to false so an older
  // client does not receive a scope kind that it cannot interpret.
  bool include_direct_message_scope = 2;
  // Scope page. Default 20 scopes, maximum 100. Offsets count scopes, not decisions.
  chatto.api.v1.PageRequest page = 3;
  // Optional exact scope filter. Missing or inaccessible scopes produce an empty page.
  // SERVER and DM require an empty ID; GROUP and ROOM require an ID.
  PermissionScope scope = 4;
}

// Response containing one role's permission matrix.
message GetRolePermissionMatrixResponse {
  // Requested matrix.
  RolePermissionMatrix matrix = 1;
  // Total matching scopes and whether another scope page exists.
  chatto.api.v1.PageInfo page = 2;
}

// Permission matrix for one user within a scope page.
message UserPermissionMatrix {
  // User ID.
  string user_id = 1;
  // Permissions rendered as rows.
  repeated string applicable_permissions = 2;
  // Scopes rendered as columns.
  repeated PermissionMatrixScope scopes = 3;
  // Sparse matrix cells.
  repeated PermissionMatrixCell cells = 4;
}

// One resource-oriented permission decision at a concrete scope.
//
// This is the row-oriented counterpart to PermissionMatrixCell. Prefer this
// shape when building integrations that do not need matrix column joins.
message ScopedPermissionDecision {
  // Permission identifier.
  string permission = 1;
  // Server, direct-message, group, or room scope for this decision.
  PermissionScope scope = 2;
  // Explicit decision stored at this scope.
  PermissionDecision override = 3;
  // Effective decision after inherited broader scopes are applied.
  PermissionDecision effective = 4;
}

// Stored permission decision returned after a write.
message PermissionDecisionUpdate {
  // Permission identifier.
  string permission = 1;
  // Server, direct-message, group, or room scope for this decision.
  PermissionScope scope = 2;
  // Stored decision after the write. NONE means no explicit decision remains.
  PermissionDecision decision = 3;
}

// Request explicit/effective permission decisions for one role.
message ListRolePermissionDecisionsRequest {
  // Stable role name.
  string role_name = 1 [(buf.validate.field).string.min_len = 1];
  // Include direct-message decisions. Defaults to false for older clients.
  bool include_direct_message_scope = 2;
  // Scope page. Default 20 scopes, maximum 100. Offsets count scopes, not decisions.
  chatto.api.v1.PageRequest page = 3;
  // Optional exact scope filter. Missing or inaccessible scopes produce an empty page.
  // SERVER and DM require an empty ID; GROUP and ROOM require an ID.
  PermissionScope scope = 4;
}

// Resource-oriented permission decisions for one role.
message ListRolePermissionDecisionsResponse {
  // Stable role name.
  string role_name = 1;
  // Permission decisions keyed by permission and typed scope.
  repeated ScopedPermissionDecision decisions = 2;
  // Total matching scopes and whether another scope page exists.
  chatto.api.v1.PageInfo page = 3;
  // Scopes in this page, including scopes with no applicable decisions.
  repeated PermissionScope scopes = 4;
}

// Request explicit/effective permission decisions for one user.
message ListUserPermissionDecisionsRequest {
  // User ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Include direct-message decisions. Defaults to false for older clients.
  bool include_direct_message_scope = 2;
  // Scope page. Default 20 scopes, maximum 100. Offsets count scopes, not decisions.
  chatto.api.v1.PageRequest page = 3;
  // Optional exact scope filter. Missing or inaccessible scopes produce an empty page.
  // SERVER and DM require an empty ID; GROUP and ROOM require an ID.
  PermissionScope scope = 4;
}

// Resource-oriented permission decisions for one user.
message ListUserPermissionDecisionsResponse {
  // User ID.
  string user_id = 1;
  // Permission decisions keyed by permission and typed scope.
  repeated ScopedPermissionDecision decisions = 2;
  // Total matching scopes and whether another scope page exists.
  chatto.api.v1.PageInfo page = 3;
  // Scopes in this page, including scopes with no applicable decisions.
  repeated PermissionScope scopes = 4;
}

// Level at which a permission explanation found a decision.
enum PermissionDecisionLevel {
  // No decision level was reached.
  PERMISSION_DECISION_LEVEL_UNSPECIFIED = 0;
  // Server-level role or user decision.
  PERMISSION_DECISION_LEVEL_SERVER = 1;
  // Room-group-level role or user decision.
  PERMISSION_DECISION_LEVEL_GROUP = 2;
  // Room-level role or user decision.
  PERMISSION_DECISION_LEVEL_ROOM = 3;
  // Direct-message-level role or user decision.
  PERMISSION_DECISION_LEVEL_DM = 4;
}

// One explicit decision encountered while explaining a permission.
message PermissionTraceEntry {
  // Level at which this decision was observed.
  PermissionDecisionLevel level = 1;
  // Role name, user ID, or policy marker that produced the decision.
  string role_name = 2;
  // Decision observed at this trace step.
  PermissionDecision decision = 3;
  // Whether this entry is the winning decision.
  bool applied = 4;
}

// Full decision trace for one permission and target user.
message PermissionExplanation {
  // Permission identifier.
  string permission = 1;
  // Overall decision after resolving named subjects and the everyone baseline.
  PermissionDecision state = 2;
  // Level of the winning decision, when state is not NONE.
  PermissionDecisionLevel decided_at = 3;
  // Role name, user ID, or policy marker that produced the winning decision.
  string decided_by_role = 4;
  // Ordered decision trace. The first entry is the winning decision.
  repeated PermissionTraceEntry trace = 5;
  // Permission whose effective allow includes this permission. Empty when the
  // permission was resolved directly.
  string included_by_permission = 6;
}

// Request permission explanations for a user at a typed scope.
message ExplainPermissionsRequest {
  // User whose permissions should be explained.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Legacy room scope. Omit for server-scoped permissions. A request that
  // also supplies scope must identify the same room.
  string room_id = 2;
  // Optional typed target. Use DM with an empty ID for direct messages. Omit
  // for server scope. This field replaces room_id for new clients.
  PermissionScope scope = 3;
}

// Permission explanations for all permissions applicable at the requested scope.
message ExplainPermissionsResponse {
  // Explanation rows sorted by permission metadata order.
  repeated PermissionExplanation explanations = 1;
}

// Request one user's permission matrix.
message GetUserPermissionMatrixRequest {
  // User ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Include the direct-message scope column. Defaults to false so an older
  // client does not receive a scope kind that it cannot interpret.
  bool include_direct_message_scope = 2;
  // Scope page. Default 20 scopes, maximum 100. Offsets count scopes, not decisions.
  chatto.api.v1.PageRequest page = 3;
  // Optional exact scope filter. Missing or inaccessible scopes produce an empty page.
  // SERVER and DM require an empty ID; GROUP and ROOM require an ID.
  PermissionScope scope = 4;
}

// Response containing one user's permission matrix.
message GetUserPermissionMatrixResponse {
  // Requested matrix.
  UserPermissionMatrix matrix = 1;
  // Total matching scopes and whether another scope page exists.
  chatto.api.v1.PageInfo page = 2;
}

// Request to set one role permission state.
message SetRolePermissionRequest {
  // Role name.
  string role_name = 1 [(buf.validate.field).string.min_len = 1];
  // Permission identifier.
  string permission = 2 [(buf.validate.field).string.min_len = 1];
  // New decision. NONE clears the explicit state. Roles only
  // grant, so DENY returns INVALID_ARGUMENT.
  PermissionDecision decision = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Target scope. Omit or use SERVER for server scope.
  PermissionScope scope = 4;
}

// Result of setting one role permission state.
message SetRolePermissionResponse {
  // Updated permission decision for the requested role/scope cell.
  PermissionDecisionUpdate decision = 1;
}

// Request to set one user permission state.
message SetUserPermissionRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Permission identifier.
  string permission = 2 [(buf.validate.field).string.min_len = 1];
  // New decision. NONE clears the explicit state.
  PermissionDecision decision = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Target scope. Omit or use SERVER for server scope.
  PermissionScope scope = 4;
}

// Result of setting one user permission state.
message SetUserPermissionResponse {
  // Updated permission decision for the requested user/scope cell.
  PermissionDecisionUpdate decision = 1;
}

// Provides permission reads and admin permission writes.
// Matrix and decision pages use the same scope order: SERVER, DM, then each GROUP
// followed by its ROOM scopes. Groups and rooms within each group use ascending
// resource IDs. Only requested scopes are evaluated.
// Pages are live reads; layout or visibility changes can shift offsets. Keep the
// same filters on each request and advance by the number of returned scopes.
// A scope filter of DM selects DM even when include_direct_message_scope is false.
service AdminPermissionService {
  // Gets the role-permission matrix for a single tier. Server scope requires
  // role.manage; group and room scopes require role.manage or effective
  // room.manage at the requested resource.
  rpc GetRolePermissionTierMatrix(GetRolePermissionTierMatrixRequest) returns (GetRolePermissionTierMatrixResponse);
  // Summarizes who can find and join a channel room or the rooms of a room
  // group. New rooms and room groups start closed, so clients use it to warn
  // operators. Requires role.manage or effective room.manage at the room or
  // group. Only ROOM and GROUP scopes are accepted.
  rpc GetAccessSummary(GetAccessSummaryRequest) returns (GetAccessSummaryResponse);
  // Gets one page of a role's permission matrix. Requires role.manage. Returns
  // NOT_FOUND when the role does not exist.
  rpc GetRolePermissionMatrix(GetRolePermissionMatrixRequest) returns (GetRolePermissionMatrixResponse);
  // Lists one role's permission decisions as resource-oriented rows. Requires
  // role.manage. Returns NOT_FOUND when the role does not exist.
  rpc ListRolePermissionDecisions(ListRolePermissionDecisionsRequest) returns (ListRolePermissionDecisionsResponse);
  // Gets one page of a user's permission matrix. Human targets require
  // user.manage-permissions; bot targets require ownership or bot.manage.
  // Returns NOT_FOUND when the user does not exist.
  rpc GetUserPermissionMatrix(GetUserPermissionMatrixRequest) returns (GetUserPermissionMatrixResponse);
  // Lists one user's permission decisions as resource-oriented rows. Human
  // targets require user.manage-permissions; bot targets require ownership or
  // bot.manage. Returns NOT_FOUND when the user does not exist.
  rpc ListUserPermissionDecisions(ListUserPermissionDecisionsRequest) returns (ListUserPermissionDecisionsResponse);
  // Explains permission resolution for another user. Requires role.manage.
  rpc ExplainPermissions(ExplainPermissionsRequest) returns (ExplainPermissionsResponse);
  // Sets one role permission decision. Server scope requires role.manage;
  // group and room scopes also accept effective room.manage at that resource.
  // A caller with role.manage can change every role except owner. Other
  // callers who are not owners can change only roles below their own highest
  // role. Every caller who is not an owner must have the permission at the
  // target scope; otherwise the call returns PERMISSION_DENIED. Everyone ranks
  // below every account. Roles, everyone included, only grant: a deny for any
  // role returns INVALID_ARGUMENT. Set a deny on a single user instead.
  rpc SetRolePermission(SetRolePermissionRequest) returns (SetRolePermissionResponse);
  // Sets one user permission decision. Human targets require
  // user.manage-permissions. A caller who is not an owner must also have the
  // permission at the target scope and must outrank any other target;
  // otherwise the call returns PERMISSION_DENIED. Bot targets require
  // ownership, or bot.manage and a higher rank than the bot and its owner, and
  // accept only allow or clear within the bot owner's current authority. A
  // caller who does not own the bot must also have the permission they allow.
  rpc SetUserPermission(SetUserPermissionRequest) returns (SetUserPermissionResponse);
}
