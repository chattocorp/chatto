syntax = "proto3";

package chatto.core.evt.v1;

import "google/protobuf/timestamp.proto";
import "chatto/core/event/v1/options.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/evt/v1;evtv1";

// ============================================================================
// PERSISTED MODERATION EVENT MESSAGE DEFINITIONS
// Changing field numbers or structure below affects JetStream-stored data.
//
// Top-level Event oneof tags owned by this file:
//   - 840-899: moderation events
//
// Keep these tags coordinated with event.proto. Message-internal field numbers
// are local to each message and do not consume top-level Event tag space.
// ============================================================================

// RoomMemberBannedEvent records a moderator banning a user from a channel room.
// The Event envelope actor_id is the moderator. The payload user_id is the
// target. Absence of expires_at means the ban is indefinite.
message RoomMemberBannedEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string user_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string reason = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_STORAGE_ONLY];
  optional google.protobuf.Timestamp expires_at = 4 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// RoomMemberUnbannedEvent records a moderator removing a room ban.
// The Event envelope actor_id is the moderator. The payload user_id is the
// target.
message RoomMemberUnbannedEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string user_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string reason = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_STORAGE_ONLY];
}

// RoomMemberAddedEvent records a manager adding a user to a channel room.
// The Event envelope actor_id is the manager. The payload user_id is the
// target.
message RoomMemberAddedEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string user_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// RoomMemberRemovedEvent records a manager removing a user from a channel room.
// The Event envelope actor_id is the manager. The payload user_id is the
// target.
message RoomMemberRemovedEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string user_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}
