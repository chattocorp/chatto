[general]
# Log level. Possible values: debug, info, warn, error.
log_level = 'info'
# Log output format. Possible values: auto, text, json, logfmt. Default: auto (text on terminals, JSON otherwise).
# log_format = 'auto'

# Email addresses that confer owner status.
[owners]
# Email addresses that confer owner status. Users with these verified emails get full instance access, including /admin routes.
emails = []

[webserver]
# Public URL where the webserver is accessible. Used for generating absolute URLs.
url = 'http://localhost:4000'
# Additional exact public origins that can use cookie authentication, publish the bundled frontend OAuth identity, and serve MCP through a reverse proxy. API responses to a request on such an origin use that origin in absolute URLs. Do not include paths or configure both HTTP and HTTPS for the same request host. Wildcards apply only to CORS and authorize none of these behaviors.
# allowed_origins = []
# Port for the webserver to listen on.
port = 4000
# IP addresses or CIDR ranges of reverse proxies allowed to supply forwarded host and client-IP headers. Default: none.
# trusted_proxies = []
# Secret for signing browser-flow cookies and CSRF proofs. NEVER SHARE THIS!
# If it leaks, change it immediately. Existing browser flows must restart and CSRF cookies will refresh; opaque chatto_auth_* sessions use core.secret_key instead.
cookie_signing_secret = 'cff07051167536f7e1546397a93caf33932dbe72efbdfb46c780a4149d616165'
# Optional hex-encoded secret used to encrypt session cookies (in addition to signing). Must decode to 16, 24, or 32 bytes (AES-128/192/256). If unset, cookies are signed but not encrypted — anything ever written to the session is readable by anyone who steals the cookie.
cookie_encryption_secret = 'b0e2d3920e0894267e532d7f16bc5d92314c8a690262720eb2061f42a8a2096d'

# Automatic TLS configuration via Let's Encrypt.
[webserver.tls]
# Enable automatic TLS via Let's Encrypt. Note: default ports 80/443 require elevated privileges.
enabled = false
# Domain name for the TLS certificate. Required when TLS is enabled.
# domain = ''
# Email address for Let's Encrypt notifications. Required when TLS is enabled.
# email = ''
# Directory to cache TLS certificates. Default: .chatto/certs
# cache_dir = ''
# Port for HTTP server (ACME challenges and HTTPS redirect). Default: 80. Use a higher port if running without elevated privileges.
# http_port = 0

# Public Shields.io-compatible community badges. Disabled by default.
# [webserver.shields]
# Expose public Shields.io-compatible badge endpoints for aggregate community counts. Disabled by default because counts reveal server size and activity.
# enabled = false

# Process-local Prometheus metrics endpoint.
# [metrics]
# Expose a Prometheus-compatible metrics endpoint on a separate internal HTTP listener. Default: false.
# enabled = false
# Address to bind the metrics listener. Default: 127.0.0.1 (localhost only).
# bind_address = ''
# Port for the metrics listener. Default: 9090.
# port = 0
# HTTP path for Prometheus scrapes. Default: /metrics.
# path = ''
# Expose Go pprof debug endpoints on the metrics listener under /debug/pprof/. Default: false.
# pprof = false

# Deployment-wide Prometheus metrics exporter.
# [exporter]
# Start the deployment-wide Prometheus exporter from chatto run. Default: false.
# enabled = false
# Address to bind the exporter listener. Default: 127.0.0.1 (localhost only).
# bind_address = ''
# Port for the exporter listener. Default: 9100.
# port = 0
# HTTP path for Prometheus scrapes. Default: /metrics.
# path = ''
# How often to refresh cached S3 bucket size metrics. Default: 15m.
# s3_refresh_interval = 0
# Timeout for one S3 bucket-size refresh. Default: 30s.
# s3_timeout = 0

# Experimental MCP integration on the public HTTP server. Disabled by default.
# [mcp]
# Expose the experimental MCP routes on the public HTTP server. Default: false.
# enabled = false

# Consumer-facing message search configuration.
# [search]
# Enable consumer-facing message search queries. Default: false.
# enabled = false

# Bundled Bleve message search provider.
# [search_provider]
# Start the bundled Bleve search provider from chatto run. Default: false.
# enabled = false
# Directory for the disposable local Bleve index. Default: ./data/search.
# directory = ''
# Bleve language analyzers used for message indexing and queries. Omit to enable all bundled analyzers; use an empty list for literal matching only.
# languages = []

# Opt-in diagnostics for local benchmarking and operator troubleshooting.
# [diagnostics]
# Write a Go CPU profile covering process startup through core boot to this path. Disabled when empty.
# startup_cpu_profile = ''

# Local root-equivalent operator API Unix socket. Disabled by default.
# [operator_api]
# Enable the local operator API Unix socket. Default: false.
# enabled = false
# Unix socket path for local operator commands. Default: /tmp/chatto/operator.sock.
# socket_path = ''

# Core service configuration.
[core]
# Disable the first-run web setup wizard. Does not reset server initialization. Default: false.
# skip_setup_wizard = false
# Server-wide secret for deriving HMAC verifiers for bearer tokens, account-flow credentials, and invite links, and for sealing public cursors. NEVER SHARE THIS!
# If it changes, existing bearer tokens, invite links, public cursors, and pending registration, verification, password reset, account deletion, and OAuth authorization-code credentials become invalid. Projection snapshots also become unreadable and are rebuilt from EVT.
secret_key = 'd1e9c41e5162ab5aeb20d38f81fa15960c9a37f83ec963aad90c4bda4911ed23'
# Persist encrypted projection snapshots and replay only the later EVT delta at startup. Missing or incompatible snapshots safely fall back to EVT replay. Default: false.
# projection_snapshots = false
# How long projection snapshot generations are retained. NATS enforces this as an Object Store TTL; Chatto uses it for optional S3 cleanup. Supports '7d', '1w', '168h', etc. Default: 7d.
# projection_snapshot_retention = 0
# How long an EVT record stays in the process-local timeline read cache after its last access. Supports '15m', '1h', etc. Default: 15m.
# evt_read_cache_idle_ttl = 0

# Retained operational log.
# [core.log]
# Operational log retention. Default: 7d. Expired records cannot be recovered.
# retention = 0

# Outbound bot webhook delivery policy.
# [core.bot_webhooks]
# Maximum outbound webhook delivery attempts, including the first attempt. Default: 5.
# max_attempts = 0
# Initial retry delay. Doubles after each attempt, up to 30m. Default: 30s.
# retry_delay = 0
# Delivery lifetime from the source message time. Default: 24h.
# expiry = 0

[core.assets]
# Secret for signing asset URLs. NEVER SHARE THIS!
# If it leaks, regenerate it. Existing signed URLs will become invalid but will be regenerated on next request.
signing_secret = '5ed996ff66f69d12d17ab0b0736425faf30a3b6616e32c8f524a10210905eeba'
# Maximum size for uploaded files. Supports human-readable formats like '25 MB', '25MB', '25MiB'.
max_upload_size = '25MB'
# Where to store new uploads: 'nats' (default) or 's3'. Existing assets are served from their original location regardless of this setting.
storage_backend = 'nats'

# S3-compatible storage configuration. Only used when storage_backend = 's3'.
# [core.assets.s3]
# S3 endpoint URL. Use 's3.amazonaws.com' for AWS, or custom endpoint for MinIO, Wasabi, etc.
# endpoint = ''
# S3 bucket name for storing assets.
# bucket = ''
# Optional object key prefix for all S3 assets. Stored asset references remain prefix-free so this can be changed after moving objects in S3.
# path_prefix = ''
# AWS region. Optional for non-AWS S3-compatible services.
# region = ''
# S3 access key ID.
# access_key_id = ''
# S3 secret access key. NEVER SHARE THIS!
# secret_access_key = ''

# Instance-wide resource limits. Use -1 for unlimited.
# [limits]
# Maximum number of verified accounts allowed in this instance. -1 = unlimited (default), 0 = no new signups, positive = cap. Counts users with at least one verified email or linked SSO identity.
# max_users = -1

# Transactional email transport configuration. SMTP is the default transport.
[email]
# Transactional email transport: smtp (default) or jmap.
transport = 'smtp'

# JMAP transactional email configuration. Used only when email.transport = 'jmap'.
# [email.jmap]
# JMAP session resource URL. Must use HTTPS.
# session_url = ''
# Bearer access token for the JMAP account. NEVER SHARE THIS!
# access_token = ''
# From address for outgoing emails. It must match a JMAP identity. Example: noreply@example.com
# from = ''
# Optional JMAP account ID. Defaults to the session's primary submission account.
# account_id = ''
# Optional JMAP identity ID. Defaults to the identity matching jmap.from.
# identity_id = ''
# Optional JMAP Drafts mailbox ID. Defaults to the mailbox with role 'drafts'.
# draft_mailbox_id = ''

# SMTP configuration for transactional emails.
[smtp]
# Enable SMTP for sending transactional emails (verification, password reset, etc.).
enabled = false
# SMTP server hostname. Example: smtp.example.com
host = ''
# SMTP server port. Common value: 587 (STARTTLS).
port = 587
# SMTP TLS policy: mandatory STARTTLS (default), implicit TLS/SMTPS, or opportunistic. Opportunistic allows plaintext fallback and should only be used when explicitly required.
tls = 'mandatory'
# SMTP TLS server name for certificate verification and SNI. Use when smtp.host is an IP address or internal alias but the certificate is issued for a DNS name.
# tls_server_name = ''
# Disable SMTP TLS certificate verification. Insecure; use only for trusted internal SMTP servers with self-signed or mismatched certificates.
# tls_skip_verify = false
# SMTP authentication username.
username = ''
# SMTP authentication password. NEVER SHARE THIS!
password = ''
# From address for outgoing emails. Example: noreply@example.com
from = ''

# Web Push notification configuration.
# [push]
# Enable Web Push notifications. Default: false (opt-in to avoid third-party server contact).
# enabled = false
# VAPID public key (base64-encoded). Generate with: openssl ecparam -genkey -name prime256v1 | openssl ec -pubout
# vapid_public_key = ''
# VAPID private key (base64-encoded). NEVER SHARE THIS!
# vapid_private_key = ''
# VAPID subject (operator email, optional mailto: prefix, or https: URL). Used by push services to contact the operator.
# vapid_subject = ''

# Video uploads and derivative settings.
# [video]
# Allow video uploads and enqueue derivative processing. Requires at least one asset-processing worker.
# enabled = false
# Maximum size for video uploads. Supports human-readable formats like '100 MB'. Default: 100 MB.
# max_upload_size = '0B'

# Built-in durable asset-processing worker.
[asset_processing]
# Start the built-in asset-processing worker inside chatto run.
enabled = true
# Path to ffmpeg binary. Auto-detected from PATH if empty.
# ffmpeg_path = ''
# Path to ffprobe binary. Auto-detected from PATH if empty.
# ffprobe_path = ''
# Maximum number of asset-processing jobs to run simultaneously in this process. Default: 2.
# max_concurrent_jobs = 0
# Temporary directory for asset processing. Default: system temp directory.
# temp_dir = ''

# LiveKit voice call configuration.
# [livekit]
# Enable LiveKit voice call support. Requires a running LiveKit server.
# enabled = false
# LiveKit server WebSocket URL. Example: ws://localhost:7880 (dev) or wss://livekit.example.com (prod).
# url = ''
# LiveKit API key.
# api_key = ''
# LiveKit API secret. NEVER SHARE THIS!
# api_secret = ''
# URL where LiveKit sends webhook events. Defaults to {webserver.url}/webhooks/livekit.
# webhook_url = ''
# Unique identifier for this server, prefixed to LiveKit room names. Required when multiple Chatto servers share the same LiveKit cluster.
# server_id = ''
# Deprecated alias for server_id. Prefer server_id / CHATTO_LIVEKIT_SERVER_ID.
# instance_id = ''
# API key LiveKit uses to sign webhooks. Falls back to api_key if not set. Required when the webhook signing key differs from the per-server API key.
# webhook_api_key = ''
# API secret for webhook signature validation. Falls back to api_secret if not set.
# webhook_api_secret = ''

# Dev/E2E-only: users, bots, and server data auto-created on first startup. ONLY honored by builds compiled with the 'bootstrap' build tag; release binaries ignore this section entirely.
# [bootstrap]
# users = []
# bots = []

[nats]
# Number of replicas for JetStream streams, KV buckets, and object stores. Must be 1, 3, or 5 (odd numbers for quorum). Use 3 or 5 only with a matching NATS cluster.
replicas = 1

# External NATS client settings. To use an external server or cluster, set nats.embedded.enabled = false, then uncomment and update this section. Embedded NATS derives its client settings automatically.
# [nats.client]
# NATS server URL. Use a comma-separated list for cluster failover, e.g. nats://n1:4222,nats://n2:4222.
# url = 'nats://nats.example.com:4222'
# Authentication method for the external NATS server: none, token, userpass, credentials, or nkey.
# auth_method = 'token'
# Token for token auth. Only used when auth_method = 'token'. NEVER SHARE THIS!
# token = 'replace-me'
# Username for userpass auth. Only used when auth_method = 'userpass'.
# username = ''
# Password for userpass auth. Only used when auth_method = 'userpass'. NEVER SHARE THIS!
# password = ''
# Path to a NATS .creds file. Only used when auth_method = 'credentials'.
# credentials_file = ''
# NKey seed. Only used when auth_method = 'nkey'. NEVER SHARE THIS!
# nkey_seed = ''
# PEM-encoded CA certificate for verifying the NATS server's TLS certificate. When set, the connection uses TLS.
# ca_cert = ''

[nats.embedded]
# Enable embedded NATS server.
enabled = true
# Uncomment to expose embedded NATS over TCP for nats CLI/admin commands. When left commented, Chatto connects in-process and no NATS port is opened.
# port = 4222
# Address to bind NATS ports. Default: 127.0.0.1 (localhost only).
# bind_address = '127.0.0.1'
# NATS monitoring/stats HTTP port. Set to 0 to disable.
# http_port = 8222
# Directory where the embedded NATS server stores its data.
data_dir = './data'
# How often JetStream syncs file data to disk. Use a duration such as '2m', or use 'always' to sync every write. If unset, NATS uses its default.
# sync_interval = 'always'
# Authentication token for NATS connections. Auto-generated on init.
auth_token = '93ffd0f35609e8a98f0c48e7f0240878c703cb643abd63d196dbc11980028791'

[auth]
# Enable direct (email/password) registration. When false, self-service account creation is disabled; existing accounts can still sign in. Default: true.
direct_registration = true
# Enable direct login with a username or email address and password. When false, users must sign in via configured SSO providers. Default: true.
direct_login = true
# Account admission policy: open or invite_only. Default: open. Upgrade every serving replica before enabling invite_only.
# account_creation_policy = ''
# Renewal window for active human sessions and lifetime of each same-origin cookie credential. Supports human-readable durations like '90d', '2160h'. Default: 90d.
# token_ttl = 0
# Lifetime for renewable bearer access tokens. Supports human-readable durations like '15m'. Default: 15m.
# access_token_ttl = 0
# Let a Chatto web client that runs on a local address of the user's device, such as a development server on localhost, sign in to this server. Its sessions end at most 24 hours after sign-in. Disabling this setting also ends existing sessions of that client. Upgrade every serving replica before enabling, and use the same value on every replica; sign-ins made while replicas differ can end. Default: false.
# loopback_client_enabled = false
# External login providers. Uncomment and adapt one or more [[auth.providers]] tables.
#
# [[auth.providers]]
# id = 'chatto-hub'
# type = 'oidc'
# label = 'Chatto Hub'
# issuer_url = 'https://id.example.com/realms/chatto'
# client_id = 'chatto'
# client_secret = 'replace-me'
# request_email = true
#
# [[auth.providers]]
# id = 'github'
# type = 'github'
# client_id = 'replace-me'
# client_secret = 'replace-me'

# Email OTP guardrails for registration and email verification.
[auth.email_otp]
# Enable email OTP throttling for registration and email verification. Default: true.
throttling_enabled = true
# How long registration and email-verification codes stay valid. Default: 30m.
# ttl = '30m'
# Maximum successfully delivered codes per email challenge before throttling. Default: 10.
# max_delivered_codes = 10
# Maximum wrong-code attempts per email challenge before throttling. Default: 5.
# max_wrong_attempts = 5
