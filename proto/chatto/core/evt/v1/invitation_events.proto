syntax = "proto3";

package chatto.core.evt.v1;

import "google/protobuf/timestamp.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/evt/v1;evtv1";

// InvitationCreatedEvent establishes one server invitation and its immutable
// admission constraints. The shareable signed code is deliberately not stored.
message InvitationCreatedEvent {
  string invitation_id = 1;
  optional uint32 max_uses = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// InvitationRedeemedEvent records the account admitted by an invitation.
message InvitationRedeemedEvent {
  string invitation_id = 1;
  string user_id = 2;
}

// InvitationRevokedEvent permanently revokes an invitation.
message InvitationRevokedEvent {
  string invitation_id = 1;
}
