syntax = "proto3";

package chatto.realtime.v1;

import "chatto/realtime/v1/events.proto";

// UserCreatedSyncEvent reports a newly materialized public user profile.
message UserCreatedSyncEvent {
  // ID of the new user.
  string user_id = 1;
  // Current public login name.
  string login = 2;
  // Current public display name.
  string display_name = 3;
}

// UserProfileSyncEvent reports the current public profile after a change.
message UserProfileSyncEvent {
  // ID of the changed user.
  string user_id = 1;
  // Current public display name.
  string display_name = 2;
  // Current public avatar URL.
  string avatar_url = 3;
  // Current public login name.
  string login = 4;
  // Current public biography.
  string bio = 5;
  // Current public time zone, or empty when sharing is disabled.
  string timezone = 6;
}

// RealtimeTimeFormat identifies a client time-display preference.
enum RealtimeTimeFormat {
  // Use the client locale default.
  REALTIME_TIME_FORMAT_UNSPECIFIED = 0;
  // Display time with a 12-hour clock.
  REALTIME_TIME_FORMAT_12H = 1;
  // Display time with a 24-hour clock.
  REALTIME_TIME_FORMAT_24H = 2;
}
// ServerUserPreferencesSyncEvent reports current client display preferences.
message ServerUserPreferencesSyncEvent {
  // Current private IANA time-zone preference.
  string timezone = 1;
  // Current time-display preference.
  RealtimeTimeFormat time_format = 2;
  // Whether the caller shares its time zone in public profiles.
  bool share_timezone = 3;
}

// ThreadFollowChangedSyncEvent reports the viewer's current thread follow state.
message ThreadFollowChangedSyncEvent {
  // ID of the containing room.
  string room_id = 1;
  // Event ID of the thread root.
  string thread_root_event_id = 2;
  // Current follow state for the caller.
  bool is_following = 3;
}

// ServerMemberDeletedSyncEvent reports a removed server member.
message ServerMemberDeletedSyncEvent {
  // ID of the removed user.
  string user_id = 1;
}

// ServerUpdatedSyncEvent reports the current public server profile.
message ServerUpdatedSyncEvent {
  // Stable server ID.
  string server_id = 1;
  // Current public server name.
  string name = 2;
  // Current public server description.
  string description = 3;
  // Current public server logo URL.
  string logo_url = 4;
  // Current public server banner URL.
  string banner_url = 5;
}

// UserTypingSignalEvent reports current typing activity.
message UserTypingSignalEvent {
  // ID of the room in which the actor is typing.
  string room_id = 1;
  // Event ID of the thread root when the actor is typing in a thread.
  optional string thread_root_event_id = 2;
}

// PresenceChangedSignalEvent reports the actor's current presence.
message PresenceChangedSignalEvent {
  // Current presence status.
  string status = 1;
}

// CallParticipantJoinedSignalEvent reports a transient call join.
message CallParticipantJoinedSignalEvent {
  // ID of the containing room.
  string room_id = 1;
  // Cause of the call-participant change.
  CallParticipantEventSource source = 2;
  // ID of the active call.
  string call_id = 3;
}

// CallParticipantLeftSignalEvent reports a transient call leave.
message CallParticipantLeftSignalEvent {
  // ID of the containing room.
  string room_id = 1;
  // Cause of the call-participant change.
  CallParticipantEventSource source = 2;
  // ID of the active call.
  string call_id = 3;
}

// NotificationOccurrencesInvalidatedEvent requests notification reconciliation.
message NotificationOccurrencesInvalidatedEvent {
  // Notification that can cause a visual alert after reconciliation.
  optional string alert_candidate_notification_id = 1;
  // Notification that can cause a sound after reconciliation.
  optional string sound_candidate_notification_id = 2;
}

// NotificationUnreadChangedEvent requests unread-state reconciliation.
message NotificationUnreadChangedEvent {
  // ID of the room with changed unread state.
  string room_id = 1;
  // Event ID of the affected thread root, or empty for room state.
  string thread_root_event_id = 2;
}

// RoomMarkedAsReadSyncEvent reports a viewer read-state change.
message RoomMarkedAsReadSyncEvent {
  // ID of the room that the caller marked as read.
  string room_id = 1;
}

// MentionStatusClearedSyncEvent reports a cleared room mention indicator.
message MentionStatusClearedSyncEvent {
  // ID of the room with a cleared mention indicator.
  string room_id = 1;
}

// SessionTerminatedSignalEvent reports that the current session ended.
message SessionTerminatedSignalEvent {
  // Safe reason for the session termination.
  string reason = 1;
}
