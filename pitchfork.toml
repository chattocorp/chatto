[settings.general]
mise = true

[settings.proxy]
enable = true
port = 42443
https = true
auto_trust = true
sync_hosts = false
worktree = false

[daemons.mailpit-server]
run = "exec mailpit --listen 127.0.0.1:$PORT0 --smtp 127.0.0.1:$PORT1"
port = { expect = [8025, 1025], bump = true }
ready_output = "accessible via http://"

[daemons.mailpit-proxy]
run = "workspace_slug=$(cat .context/dev/workspace-slug) && export XDG_DATA_HOME=\"$PWD/.context/dev/$workspace_slug/caddy\" && exec caddy reverse-proxy --from http://127.0.0.1:$PORT --to http://127.0.0.1:{{ daemons['mailpit-server'].port }}"
port = { expect = [18025], bump = true }
ready_output = "caddy proxying"
depends = ["mailpit-server"]

[daemons.livekit-server]
run = """
workspace_slug=$(cat .context/dev/workspace-slug)
livekit_config=$(printf 'port: %s\nrtc:\n  tcp_port: %s\n  udp_port: %s\n  use_external_ip: false\n  enable_loopback_candidate: true\nkeys:\n  devkey: compose-only-livekit-secret-change-me\nwebhook:\n  urls:\n    - https://chatto-%s.localhost:42443/webhooks/livekit\n  api_key: devkey\nlogging:\n  level: info\n' "$PORT0" "$PORT1" "$PORT2" "$workspace_slug")
exec server --bind 127.0.0.1 --node-ip 127.0.0.1 --config-body "$livekit_config"
"""
port = { expect = [7880, 7881, 7882], bump = true }
ready_output = "starting LiveKit server"

[daemons.livekit-proxy]
run = "workspace_slug=$(cat .context/dev/workspace-slug) && export XDG_DATA_HOME=\"$PWD/.context/dev/$workspace_slug/caddy\" && exec caddy reverse-proxy --from http://127.0.0.1:$PORT --to http://127.0.0.1:{{ daemons['livekit-server'].port }}"
port = { expect = [17880], bump = true }
ready_output = "caddy proxying"
depends = ["livekit-server"]

[daemons.authling]
run = """
workspace_slug=$(cat .context/dev/workspace-slug)
data_root=".context/dev/$workspace_slug"
mkdir -p "$data_root/authling/nats"
cd authling
mise build
cd ..
export AUTHLING_HTTP_BIND_ADDRESS="127.0.0.1:$PORT"
export AUTHLING_HTTP_PUBLIC_URL="https://authling-$workspace_slug.localhost:42443"
export AUTHLING_OIDC_CIMD_TRUSTED_LOOPBACK_HOSTS="chatto-$workspace_slug.localhost"
export AUTHLING_NATS_EMBEDDED_DATA_DIR="$data_root/authling/nats"
exec authling/bin/authling run
"""
port = { expect = [8080], bump = true }
ready_output = "Authling is ready"
depends = ["mailpit-server"]
env = {
  AUTHLING_HTTP_TRUST_PROXY_HEADERS = "true",
  AUTHLING_AUTHENTICATION_PASSWORD_MINIMUM_LENGTH = "10",
  AUTHLING_NATS_REPLICAS = "1",
  AUTHLING_NATS_EMBEDDED_ENABLED = "true",
  AUTHLING_SMTP_ENABLED = "true",
  AUTHLING_SMTP_HOST = "127.0.0.1",
  AUTHLING_SMTP_PORT = "{{ daemons['mailpit-server'].ports[1] }}",
  AUTHLING_SMTP_TLS = "opportunistic",
  AUTHLING_SMTP_FROM = "authling@authling.local",
}
watch = [
  "authling/**/*.go",
  "authling/**/*.templ",
  "authling/web/src/**/*",
  "authling/package.json",
  "authling/pnpm-lock.yaml",
  "authling/web/package.json",
  "pkg/**/*.go",
]

[daemons.chatto-backend]
dir = "cli"
run = """
workspace_slug=$(cat ../.context/dev/workspace-slug)
data_root="../.context/dev/$workspace_slug"
mkdir -p internal/http_server/.client "$data_root/chatto/nats" "$data_root/chatto/search"
touch internal/http_server/.client/.gitkeep
go build -trimpath -tags 'bootstrap nomsgpack' -ldflags '-X main.Version=0.5.0-dev' -o bin/chatto-dev .
export CHATTO_WEBSERVER_PORT="$PORT"
export CHATTO_WEBSERVER_URL="https://chatto-$workspace_slug.localhost:42443"
export CHATTO_METRICS_PORT="$PORT1"
export CHATTO_EXPORTER_PORT="$PORT2"
export CHATTO_SEARCH_PROVIDER_DIRECTORY="$data_root/chatto/search"
export CHATTO_AUTH_PROVIDERS_0_ISSUER_URL="https://authling-$workspace_slug.localhost:42443"
export CHATTO_AUTH_PROVIDERS_0_CLIENT_ID="https://chatto-$workspace_slug.localhost:42443/oauth/client-metadata.json"
export CHATTO_LIVEKIT_URL="wss://livekit-$workspace_slug.localhost:42443"
export CHATTO_LIVEKIT_WEBHOOK_URL="https://chatto-$workspace_slug.localhost:42443/webhooks/livekit"
export CHATTO_NATS_EMBEDDED_DATA_DIR="$data_root/chatto/nats"
exec ./bin/chatto-dev start
"""
port = { expect = [4001, 9090, 9100], bump = true }
ready_output = "Starting HTTP server"
depends = ["authling", "livekit-proxy", "mailpit-server"]
env = {
  CHATTO_DEVELOPMENT_VERSION = "0.5.0-dev",
  CHATTO_LOG_LEVEL = "debug",
  CHATTO_LOG_FORMAT = "text",
  CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET = "871a846584490a6153305533cce100b8e6f39d4184c2fb499d2ed198a9ed37a3",
  CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET = "a3955a342ba4cb4ffb457a1177295779fbbb73f8e22cd4f68ecb9fb584afcf66",
  CHATTO_OPERATOR_API_ENABLED = "false",
  CHATTO_SEARCH_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_LANGUAGES = "de,en",
  CHATTO_CORE_SECRET_KEY = "2ff88b0e8ceb09c399193d1b9339577e6b0fac883777176231e84f92aa78f794",
  CHATTO_CORE_PROJECTION_SNAPSHOTS = "true",
  CHATTO_CORE_ASSETS_SIGNING_SECRET = "2e5cac66f8ea81759952186886d233410c1e6e18e3048bc680792935206240e0",
  CHATTO_CORE_ASSETS_MAX_UPLOAD_SIZE = "25MB",
  CHATTO_CORE_ASSETS_CACHE_ENABLED = "true",
  CHATTO_CORE_ASSETS_CACHE_TTL = "7d",
  CHATTO_AUTH_ACCOUNT_CREATION_POLICY = "invite_only",
