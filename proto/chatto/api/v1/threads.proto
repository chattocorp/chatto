syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/message_types.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/read_state.proto";
import "chatto/api/v1/room_timeline.proto";
import "chatto/api/v1/rooms.proto";
import "google/protobuf/timestamp.proto";

// Current follow state for one thread and viewer.
message ThreadFollowState {
  // Room containing the thread.
  string room_id = 1;
  // Event ID of the root message for the thread.
  string thread_root_event_id = 2;
  // True when the current user follows the thread.
  bool following = 3;
}

// Request to follow one message thread.
message FollowThreadRequest {
  // Required. Room containing the thread.
  string room_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required. Event ID of the root message for the thread.
  string thread_root_event_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of following a thread.
message FollowThreadResponse {
  // True when the current user follows the thread after the operation.
  bool following = 1;
  // Current follow state after the operation.
  ThreadFollowState state = 2;
}

// Request to stop following one message thread.
message UnfollowThreadRequest {
  // Required. Room containing the thread.
  string room_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required. Event ID of the root message for the thread.
  string thread_root_event_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of unfollowing a thread.
message UnfollowThreadResponse {
  // True when the current user follows the thread after the operation.
  bool following = 1;
  // Current follow state after the operation.
  ThreadFollowState state = 2;
}

// One followed thread for the current user.
message FollowedThread {
  reserved 1 to 3, 5 to 7;
  reserved "room_id", "room_name", "thread_root_event_id", "reply_count", "last_reply_at", "has_unread";

  // Renderable root message, when the root is still visible.
  Message root_message = 4;
  // Room containing the thread.
  RoomSummary room = 8;
  // Aggregated thread state.
  ThreadSummary thread = 9;
}

// Request for a page of followed threads for the current user.
message ListFollowedThreadsRequest {
  reserved 1, 2;
  reserved "limit", "offset";

  // Page request. Defaults to 20 results when absent or limit is zero.
  PageRequest page = 3;
}

// Response containing one followed-thread page.
message ListFollowedThreadsResponse {
  reserved 2, 3;
  reserved "total_count", "has_more";

  // Followed threads in newest-activity-first order.
  repeated FollowedThread threads = 1;
  // Hot-path related entities needed to render this feed page without
  // per-thread hydration.
  RoomTimelineIncludes includes = 4;
  // Page metadata.
  PageInfo page = 5;
}

// Post-time reason that the current account is related to one thread.
enum ThreadInteractionCauseType {
  // The cause is absent or unknown.
  THREAD_INTERACTION_CAUSE_TYPE_UNSPECIFIED = 0;
  // The current account authored the thread root.
  THREAD_INTERACTION_CAUSE_TYPE_ROOT_AUTHORED = 1;
  // Another account directly mentioned the current account.
  THREAD_INTERACTION_CAUSE_TYPE_DIRECT_MENTION = 2;
}

// One post-time fact that established a thread interaction relationship.
message ThreadInteractionCause {
  // Relationship cause.
  ThreadInteractionCauseType type = 1;
  // Message event that established the cause.
  string source_message_event_id = 2;
  // Time when the source message was posted.
  google.protobuf.Timestamp created_at = 3;
}

// One active interaction relationship for the current account.
message ThreadInteraction {
  // Channel room containing the thread.
  string room_id = 1;
  // Event ID of the thread root message.
  string thread_root_event_id = 2;
  // Post-time facts that established the relationship.
  repeated ThreadInteractionCause causes = 3;
  // Latest visible activity in the thread.
  google.protobuf.Timestamp last_activity_at = 4;
}

// Request for one interaction relationship of the current account.
message GetInteractionRequest {
  // Required. Channel room containing the thread.
  string room_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required. Event ID of the thread root message.
  string thread_root_event_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Response containing one current interaction relationship.
message GetInteractionResponse {
  // Current relationship.
  ThreadInteraction interaction = 1;
}

// Request for a page of the current account's interaction relationships.
message ListInteractionsRequest {
  // Page request. Defaults to 20 results when absent or limit is zero.
  PageRequest page = 1;
}

// Response containing one interaction relationship page.
message ListInteractionsResponse {
  // Relationships in newest-activity-first order.
  repeated ThreadInteraction interactions = 1;
  // Page metadata.
  PageInfo page = 2;
}

// Manages thread follow state for the current user.
service ThreadService {
  // Returns one active interaction relationship for the current account.
  // Room membership and message.read-interactions are required. Returns
  // NOT_FOUND when no relationship exists.
  rpc GetInteraction(GetInteractionRequest) returns (GetInteractionResponse);
  // Lists active interaction relationships for the current account. Rows
  // without current room membership or message.read-interactions are omitted.
  // Clients can use this list to recover thread access after a realtime reset.
  rpc ListInteractions(ListInteractionsRequest) returns (ListInteractionsResponse);
  // Returns followed threads in rooms where the current user is a member.
  // Channel-room threads also require message.read or an active relationship
  // with message.read-interactions. Historical DM threads use DM membership.
  // The result includes enough root-message data for clients to render the
  // list without extra per-field fetches.
  rpc ListFollowedThreads(ListFollowedThreadsRequest) returns (ListFollowedThreadsResponse);
  // Follows a thread for the current user. Room membership plus message.read or
  // an active relationship with message.read-interactions are required. DMs do
  // not support current thread actions.
  // Followed threads can be surfaced in clients and can participate in thread
  // notification behavior.
  rpc FollowThread(FollowThreadRequest) returns (FollowThreadResponse);
  // Stops following a thread for the current user. Room membership plus
  // message.read or an active relationship with message.read-interactions are
  // required. DMs do not support current thread actions. The response reports
  // the resulting follow state so clients can update local UI immediately.
  rpc UnfollowThread(UnfollowThreadRequest) returns (UnfollowThreadResponse);
  // Returns one page of events in a message thread. Room membership is
  // required. Channel-room reads also require message.read or an active
  // relationship with message.read-interactions. Historical DM threads use DM
  // membership. Initial pages include the thread root message; cursor pages
  // return replies in the requested direction.
  rpc GetThreadEvents(GetThreadEventsRequest) returns (GetThreadEventsResponse);
  // Returns a thread timeline window centered around a specific event. Use this
  // to open a reply from a notification or search result in context. Returns
  // NOT_FOUND when the thread root or anchor event is missing or hidden.
  // Returns PERMISSION_DENIED when room membership is missing, both read modes
  // are missing, or an interaction-scoped account has no relationship with the
  // thread. Historical DM threads use DM membership.
  rpc GetThreadEventsAround(GetThreadEventsAroundRequest) returns (GetThreadEventsAroundResponse);
  // Marks a thread timeline as read through the supplied event without changing
  // the room-level read marker. Room membership plus message.read or an active
  // relationship with message.read-interactions are required. DMs do not
  // support current thread actions.
  rpc MarkThreadAsRead(MarkThreadAsReadRequest) returns (MarkThreadAsReadResponse);
}
