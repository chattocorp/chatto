syntax = "proto3";

package chatto.core.v1;

import "chatto/core/v1/models.proto";
import "chatto/core/v1/user_preferences.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/v1;corev1";

// ============================================================================
// CONFIG EVENTS
//
// Top-level Event oneof tags owned by this file:
//   - 500: reserved tombstone for the abandoned server_config_changed snapshot
//   - 501-519: durable server/user/room configuration events on evt.config.*
//
// Keep these tags coordinated with event.proto. Message-internal field numbers
// are local to each message and do not consume top-level Event tag space.
// ============================================================================

message ServerNameChangedEvent {
  string name = 1;
}

message ServerDescriptionChangedEvent {
  string description = 1;
}

message ServerWelcomeMessageChangedEvent {
  string welcome_message = 1;
}

message ServerMotdChangedEvent {
  string motd = 1;
}

message ServerBlockedUsernamesChangedEvent {
  string blocked_usernames = 1;
}

message ServerLogoSetEvent {
  AssetRecord asset = 1;
}

message ServerLogoClearedEvent {}

message ServerBannerSetEvent {
  AssetRecord asset = 1;
}

message ServerBannerClearedEvent {}

message UserTimezoneChangedEvent {
  string user_id = 1;
  string timezone = 2;
}

message UserTimezoneClearedEvent {
  string user_id = 1;
}

message UserTimeFormatChangedEvent {
  string user_id = 1;
  TimeFormat time_format = 2;
}

message UserTimeFormatClearedEvent {
  string user_id = 1;
}

message UserServerNotificationLevelSetEvent {
  string user_id = 1;
  NotificationLevel level = 2;
}

message UserServerNotificationLevelClearedEvent {
  string user_id = 1;
}

message UserRoomNotificationLevelSetEvent {
  string user_id = 1;
  string room_id = 2;
  NotificationLevel level = 3;
}

message UserRoomNotificationLevelClearedEvent {
  string user_id = 1;
  string room_id = 2;
}

// Scope that contributes one sparse layer to effective room configuration.
message RoomConfigScope {
  oneof scope {
    // Server scope. Must be true when selected.
    bool server = 1;
    // Room-group scope.
    string room_group_id = 2;
    // Channel-room scope.
    string room_id = 3;
  }
}

// Sparse room-configuration values contributed by one scope.
message RoomConfigLayer {
  // Maximum message age for author edits. Zero disables author edits. Absence
  // means the layer does not contribute this setting.
  google.protobuf.Duration author_edit_window = 1;
}

// Records selected changes to one room-configuration layer. Paths in
// changed_fields are relative to changes. A selected field that is absent from
// changes is removed from the layer; unselected fields remain unchanged.
message RoomConfigChangedEvent {
  // Layer receiving the selected changes.
  RoomConfigScope scope = 1;
  // New values for selected fields. Selected fields absent here are removed.
  RoomConfigLayer changes = 2;
  // Layer field paths changed by this event. Unknown paths are ignored during
  // replay so older binaries can process events written by newer versions.
  google.protobuf.FieldMask changed_fields = 3;
}
