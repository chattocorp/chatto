name: Prepare releases

on:
  push:
    branches: [main]
    paths:
      - '**/.sweet/**'
      - '**/.sweet.yml'
      - '.sweet.config.yml'
      - '.github/workflows/bump-releases.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@11dc11d022585610ad9d751c3f0262f6ef754179 # sweet@0.4.0
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_PAT }}
