[package]
name = "chatto-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "AGPL-3.0-or-later"
description = "Experimental native Chatto app built with GPUI"

[features]
# Local native screenshot checks; captures only --preview fixtures.
preview-capture = ["gpui/test-support"]

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = "0.4"
chatto = { path = "../chatto-rs" }
# Keep the GPUI runtime, components, and assets on Kit’s matched release.
gpui = { package = "gpui-kit", version = "=0.9.0" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = "3"
uuid = { version = "1", features = ["v4"] }
url = "2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.9.0", features = ["test-support"] }
