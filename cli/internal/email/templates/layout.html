<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{.Subject}}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f4f4f5">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">{{.Preheader}}</div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f4f4f5"
    >
      <tr>
        <td
          align="center"
          style="
            padding: 32px 16px;
            font-family:
              -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          "
        >
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 520px"
          >
            <tr>
              <td style="padding: 0 8px 16px; font-size: 15px; font-weight: 700; color: #18181b">
                {{.ServerName}}
              </td>
            </tr>
            <tr>
              <td style="background: #ffffff; border-radius: 12px; padding: 32px">
                <h1 style="margin: 0 0 12px; font-size: 22px; line-height: 1.3; color: #18181b">
                  {{.Heading}}
                </h1>
                <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #3f3f46">
                  {{.Intro}}
                </p>
                {{- if .Code}}
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      align="center"
                      style="background:{{.Accent.Tint}};border-radius:8px;padding:20px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:.25em;color:{{.Accent.Strong}};"
                    >
                      {{.Code}}
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 16px 0 0;
                    font-size: 13px;
                    line-height: 1.5;
                    color: #71717a;
                    text-align: center;
                  "
                >
                  {{.Expiry}}
                </p>
                {{- end}} {{- if .ButtonURL}}
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background:{{.Accent.Strong}};border-radius:8px;">
                      <a
                        href="{{.ButtonURL}}"
                        style="
                          display: inline-block;
                          padding: 12px 24px;
                          font-size: 15px;
                          font-weight: 600;
                          color: #ffffff;
                          text-decoration: none;
                        "
                        >{{.ButtonLabel}}</a
                      >
                    </td>
                  </tr>
                </table>
                <p style="margin: 24px 0 4px; font-size: 13px; line-height: 1.5; color: #71717a">
                  {{.Expiry}} If the button doesn't work, open this address:
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; word-break: break-all">
                  <a href="{{.ButtonURL}}" style="color:{{.Accent.Strong}};">{{.ButtonURL}}</a>
                </p>
                {{- end}}
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 8px 0; font-size: 12px; line-height: 1.6; color: #a1a1aa">
                {{.Footer}}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
