name: ci

on:
  push:
    branches:
      - main
      - 'release-[0-9]*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

concurrency:
  # PRs share a group so superseded revisions are cancelled. Pushes use their
  # immutable commit SHA so every main commit can publish an image.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      chatto: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.chatto == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.desktop == 'true' }}
      authling: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.authling == 'true' }}
      runling: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.runling == 'true' }}
      chattobot: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.chattobot == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.select.outputs.common == 'true' || steps.select.outputs.docs == 'true' }}
    steps:
      - name: Select affected products
        if: github.event_name == 'pull_request'
        id: select
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          predicate-quantifier: some-with-excludes
          # Release-please writes changelogs and the release manifest. Only
          # release tooling reads the changelogs, so they do not select product
          # jobs. Of the products, only a Runling test reads the manifest.
          # Version files in release pull requests still select their product.
          filters: |
            chatto:
              # Authling changes must also verify login and profile transfer into Chatto.
              - 'authling/**'
              - 'cli/**'
              - 'pkg/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - 'proto/**'
              - 'docker/**'
              - '!**/CHANGELOG.md'
            authling:
              # Go workspace dependency selection can change across product modules.
              - 'cli/go.{mod,sum}'
              - 'authling/**'
              - 'pkg/**'
              - '!**/CHANGELOG.md'
            runling:
              - 'packages/runling/**'
              # The Runling bot example uses the Chatto client.
              - 'packages/chatto-client/**'
              - 'packages/api-types/**'
              - 'examples/runling-bot/**'
              # A release test compares the manifest with the Runling version.
              - '.release-please-manifest.json'
              - '!**/CHANGELOG.md'
            chattobot:
              - 'packages/chattobot/**'
              - 'packages/runling/**'
              - 'packages/chatto-client/**'
              - 'packages/api-types/**'
              - 'proto/**'
              - '!**/CHANGELOG.md'
            docs:
              - 'apps/docs-website/**'
              - '!**/CHANGELOG.md'
            desktop:
              - 'apps/desktop/**'
              - 'apps/frontend/**'
              - 'packages/**'
              - '!packages/runling/**'
              - 'proto/**'
              - 'tools/test-desktop-*'
              - '!**/CHANGELOG.md'
            # Files outside product roots and repository documentation run all products.
            common:
              - '**'
              - '!{cli,pkg,authling,packages,proto,docker}/**'
              - '!apps/{frontend,desktop,docs-website}/**'
              - '!tools/test-desktop-*'
              - '!{docs,.agents,.claude,.conductor}/**'
              - '!*.md'
              - '!.release-please-manifest.json'

  test-runling:
    needs: changes
    if: ${{ needs.changes.outputs.runling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise check-runling
      - run: mise test-runling
      - run: mise test-runling-bot
      - run: mise test-runling-package

  test-chattobot:
    needs: changes
    if: ${{ needs.changes.outputs.chattobot == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: mise check-chattobot
      - run: mise test-chatto-client
      - run: mise test-chattobot

  build-main-image-contexts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-version: ${{ steps.image-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          save-go-build-cache: 'true'
          turbo-remote-cache: 'false'

      - name: Derive main image version
        id: image-version
        shell: bash
        run: |
          set -euo pipefail

          development_version="$(mise env --json | jq -r '.CHATTO_DEVELOPMENT_VERSION // empty')"
          if [[ -z "$development_version" ]]; then
            echo "::error::Could not read CHATTO_DEVELOPMENT_VERSION from mise.toml."
            exit 1
          fi

          echo "version=${development_version}+${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build frontend for production image
        env:
          CHATTO_BUILD_VERSION: ${{ steps.image-version.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: '1'
        run: mise build-frontend

      - name: Verify frontend build version
        env:
          EXPECTED_VERSION: ${{ steps.image-version.outputs.version }}
        shell: bash
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Build production image contexts
        shell: bash
        env:
          VERSION: ${{ steps.image-version.outputs.version }}
        run: |
          set -euo pipefail

          for arch in amd64 arm64; do
            context=".context/ci/docker/linux-${arch}"
            mkdir -p "$context/docker" "$context/LICENSES"
            cp docker/Dockerfile.goreleaser "$context/Dockerfile"
            cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
            cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
            cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
            cp NOTICE "$context/NOTICE"
            (
              cd cli
              # Chatto does not expose Gin's MessagePack binding; omit its large codec.
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
                -tags=nomsgpack \
                -ldflags="-s -w -X main.Version=${VERSION}" \
                -o "../$context/chatto" .
            )
          done

      - name: Upload production image contexts
        uses: actions/upload-artifact@v7
        with:
          name: production-image-contexts
          path: .context/ci/docker
          retention-days: 1

  license-check:
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Check license metadata
        run: mise license-check

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Check workflows and shell scripts
        run: mise lint-actions

  desktop:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    name: desktop (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            artifact-path: apps/desktop/dist/chatto-desktop
          - platform: macos
            os: macos-15
            artifact-path: apps/desktop/dist/Chatto Desktop.app
          - platform: windows
            os: windows-latest
            artifact-path: apps/desktop/dist/windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Build desktop bundle
        run: mise desktop-build

      - name: Verify desktop bundle exists
        shell: bash
        env:
          ARTIFACT_PATH: ${{ matrix.artifact-path }}
        run: test -e "$ARTIFACT_PATH"

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/Chatto Desktop.app"

      - name: Verify macOS game-capture helper
        if: runner.os == 'macOS'
        shell: bash
        run: |
          helper="apps/desktop/dist/Chatto Desktop.app/Contents/Helpers/Chatto Capture Helper.app/Contents/MacOS/chatto-macos-capture-probe"
          test -x "$helper"
          "$helper" help | grep -F 'publish --window'
          otool -l "$helper" | grep -F '@executable_path/../Frameworks'

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: chatto-desktop-${{ matrix.platform }}-${{ runner.arch }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7

  desktop-macos-capture:
    needs: changes
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test macOS game-capture helper
        run: tools/test-desktop-macos-capture.sh

  codegen-proto-drift:
    needs: changes
    if: ${{ !cancelled() }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify job selection
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTION_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      # Breaking checks compare a pull request with its target branch. A push
      # has already passed them as a pull request, and labels that acknowledge
      # public API breaks exist only on pull requests. The target branch can
      # also move during a push run, so a shallow fetch of it is not stable.
      - name: Fetch protobuf breaking base
        if: github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          git fetch --no-tags --depth=1 origin "${base_ref}:refs/remotes/origin/${base_ref}"

      - name: Lint Chatto protobufs
        run: mise lint-proto

      - name: Check storage, internal, and Operator protobuf breaking changes
        if: github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          mise x -- node tools/check-storage-proto-breaking.mjs \
            "../.git#branch=origin/${base_ref},subdir=proto"

      - name: Check projection snapshot schema contracts
        working-directory: cli
        run: mise x -- go test ./internal/core -run TestProjectionSnapshotContractsIncludeCurrentSchema -count=1

      - name: Check public protobuf packages without acknowledged breaks
        if: github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          cd proto
          labels='${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}'
          # Check each package once; imported packages have their own checks and labels.
          for package in auth discovery api admin realtime; do
            if [[ ",${labels}," == *",api-breaking-change:${package},"* ]]; then
              echo "::notice::Skipping acknowledged ${package} protobuf break."
              continue
            fi
            path="chatto/${package}/v1"
            mise x -- buf breaking . --against "../.git#branch=origin/${base_ref},subdir=proto" --path "$path" --exclude-imports
          done

      - name: Check Authling persisted protobuf breaking changes
        if: github.event_name == 'pull_request'
        run: |
          base_ref="${GITHUB_BASE_REF}"
          if git cat-file -e "origin/${base_ref}:authling/buf.yaml" 2>/dev/null; then
            cd authling
            mise x -- buf breaking . \
              --against "../.git#branch=origin/${base_ref},subdir=authling" \
              --exclude-imports
          else
            echo "::notice::Authling protobufs are new; no base schema exists yet."
          fi

      - name: Lint Authling protobufs
        working-directory: authling
        run: mise x -- buf lint

      - name: Regenerate protobuf bindings
        run: |
          mise codegen-proto
          cd authling
          mise codegen-proto

      - name: Check generated protobuf bindings are current
        run: |
          if ! git diff --exit-code; then
            git status --short
            exit 1
          fi

  check-workspace:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.desktop == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Run workspace typechecks
        run: pnpm run check

      - name: Run workspace linters
        run: pnpm run lint

      - name: Build Storybook design-system catalog
        run: pnpm run build:storybook

  test-workspace-packages:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # The frontend suite is the longest, so it runs on its own runner. The other
    # entry excludes only the frontend, so new workspace tests run without a
    # matrix change.
    name: test-workspace (${{ matrix.name }})
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            filter: chatto-frontend
            playwright: true
          - name: packages
            filter: '!chatto-frontend'
            playwright: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'

      - name: Setup Playwright
        if: matrix.playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          save-cache: 'true'

      - name: Run workspace unit tests
        env:
          TURBO_FILTER: ${{ matrix.filter }}
        run: pnpm turbo run test --concurrency=1 "--filter=$TURBO_FILTER"

  test-workspace:
    needs: [changes, test-workspace-packages]
    if: ${{ always() && needs.changes.outputs.chatto == 'true' }}
    # Keep this job name stable because it can be a required branch check.
    runs-on: ubuntu-latest
    steps:
      - name: Verify workspace test jobs
        env:
          PACKAGES_RESULT: ${{ needs.test-workspace-packages.result }}
        run: test "$PACKAGES_RESULT" = success

  test-cli-shared:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-cli-shared
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Authling tests
        if: needs.changes.outputs.authling == 'true'
        working-directory: authling
        run: mise test

      - name: Lint shared Go modules
        run: |
          mise lint-appconfig
          mise lint-datacrypto
          mise lint-events
          mise lint-jetstreamutil
          mise lint-natsruntime

      - name: Run application configuration tests
        run: mise test-appconfig

      - name: Run data cryptography tests
        run: mise test-datacrypto

      - name: Run event framework tests
        run: mise test-events

      - name: Run JetStream utility tests
        run: mise test-jetstreamutil

      - name: Run embedded NATS runtime tests
        run: mise test-natsruntime

  test-cli-chatto:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-cli-chatto
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build frontend
        run: mise build-frontend

      - name: Verify development data seeding
        run: mise x -- node tools/dev-seed-smoke.mjs

      - name: Run Go tests
        run: cd cli && go test -trimpath -tags test_endpoints ./...

  lint-cli:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: lint-cli
          # PR caches are isolated from main and cannot accelerate a merge run.
          save-go-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # staticcheck keeps its analysis results outside the Go build cache.
      - name: Restore staticcheck cache
        id: staticcheck-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/staticcheck
          key: staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cli/go.sum') }}-${{ github.sha }}
          restore-keys: |
            staticcheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'cli/go.sum') }}-
            staticcheck-${{ runner.os }}-${{ runner.arch }}-

      - name: Vet and check Go code for unused code and outdated idioms
        run: mise lint-cli

      - name: Save staticcheck cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/staticcheck
          key: ${{ steps.staticcheck-cache.outputs.cache-primary-key }}

  test-oidc-conformance:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Authling toolchain and browser dependencies
        working-directory: authling
        run: |
          mise install
          mise deps-web
      - uses: ./.github/actions/setup-playwright
        with:
          working-directory: authling
      - name: Run official provider and client checks
        run: mise test-oidc-conformance
      - name: Upload outcome summary only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: oidc-conformance-results
          path: authling/conformance-results.json
          retention-days: 14

  test-cli:
    needs: [changes, test-cli-shared, test-cli-chatto, lint-cli]
    if: ${{ always() && (needs.changes.outputs.chatto == 'true' || needs.changes.outputs.authling == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLI test and lint jobs
        env:
          CHATTO_CHANGED: ${{ needs.changes.outputs.chatto }}
          SHARED_RESULT: ${{ needs.test-cli-shared.result }}
          CHATTO_RESULT: ${{ needs.test-cli-chatto.result }}
          LINT_RESULT: ${{ needs.lint-cli.result }}
        run: |
          test "$SHARED_RESULT" = success
          if [[ "$CHATTO_CHANGED" == true ]]; then
            test "$CHATTO_RESULT" = success
            test "$LINT_RESULT" = success
          fi

  test-authling-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.authling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Setup Authling E2E dependencies
        working-directory: authling
        run: |
          mise install
          mise deps-web

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15
        with:
          working-directory: authling

      - name: Run Authling E2E tests
        working-directory: authling
        run: mise test-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: authling-playwright-report
          path: |
            authling/playwright-report/
            authling/test-results/
          retention-days: 14

  test-e2e-shards:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each shard spends about two minutes on setup and builds, so more shards
    # give less benefit. The test-e2e job reports the result of all shards.
    name: test-e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-e2e
          # Only one matrix job writes the cache. All E2E jobs can restore it
          # on the next run without concurrent cache-save attempts.
          save-go-build-cache: ${{ matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Build E2E dependencies
        run: |
          mise build-e2e-server
          mise build-runling-bot

      - name: Run E2E tests
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results.json
        run: |
          cd apps/frontend
          node --test scripts/run-e2e-shard.test.mjs
          node scripts/run-e2e-shard.mjs "$E2E_SHARD" --grep-invert @ffmpeg

      - name: Upload E2E timings
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: apps/frontend/e2e-results.json
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e:
    needs: [changes, test-e2e-shards]
    if: ${{ always() && needs.changes.outputs.chatto == 'true' }}
    # Keep this job name stable because it can be a required branch check.
    runs-on: ubuntu-latest
    steps:
      - name: Verify E2E shards
        env:
          SHARDS_RESULT: ${{ needs.test-e2e-shards.result }}
        run: test "$SHARDS_RESULT" = success

  test-e2e-media:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          go-build-cache-scope: test-e2e
          install-ffmpeg: 'true'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run media E2E tests
        run: cd apps/frontend && pnpm exec playwright test --grep @ffmpeg

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report-media
          path: apps/frontend/playwright-report/
          retention-days: 14

  test-e2e-performance:
    needs: changes
    if: ${{ needs.changes.outputs.chatto == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          go-build-cache-scope: test-e2e

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        timeout-minutes: 15

      - name: Prepare performance baseline
        id: performance-baseline
        shell: bash
        env:
          PERFORMANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          baseline_dir="$RUNNER_TEMP/chatto-performance-base"
          if [[ -z "$PERFORMANCE_BASE_SHA" || "$PERFORMANCE_BASE_SHA" =~ ^0+$ ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${PERFORMANCE_BASE_SHA}:apps/frontend/e2e-performance/large-server.performance.test.ts"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add --detach "$baseline_dir" "$PERFORMANCE_BASE_SHA"
          cp apps/frontend/e2e-performance/large-server.performance.test.ts \
            "$baseline_dir/apps/frontend/e2e-performance/large-server.performance.test.ts"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run base-revision performance test
        id: performance-baseline-test
        if: steps.performance-baseline.outputs.available == 'true'
        working-directory: ${{ runner.temp }}/chatto-performance-base
        continue-on-error: true
        env:
          CHATTO_E2E_PERF_ALLOW_MISSING_REALTIME_SNAPSHOT_METRIC: true
        run: mise test-e2e-performance

      - name: Preserve base-revision results
        if: steps.performance-baseline.outputs.available == 'true' && steps.performance-baseline-test.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          comparison_dir="apps/frontend/test-results/performance-comparison"
          mkdir -p "$comparison_dir"
          base_result=$(find "$RUNNER_TEMP/chatto-performance-base/apps/frontend/test-results/performance" -name performance-results.json -print -quit)
          cp "$base_result" "$comparison_dir/base.json"
          cp -R "$RUNNER_TEMP/chatto-performance-base/apps/frontend/playwright-report-performance" apps/frontend/playwright-report-performance-base

      - name: Build E2E server
        run: mise build-e2e-server

      - name: Run large-server E2E performance test
        run: mise test-e2e-performance

      - name: Preserve candidate results
        shell: bash
        run: |
          set -euo pipefail
          comparison_dir="apps/frontend/test-results/performance-comparison"
          mkdir -p "$comparison_dir"
          candidate_result=$(find apps/frontend/test-results/performance -name performance-results.json -print -quit)
          cp "$candidate_result" "$comparison_dir/candidate.json"

      - name: Compare performance with base revision
        if: steps.performance-baseline.outputs.available == 'true' && steps.performance-baseline-test.outcome == 'success'
        working-directory: apps/frontend
        shell: bash
        run: |
          set -o pipefail
          node scripts/compare-e2e-performance.mjs \
            test-results/performance-comparison/base.json \
            test-results/performance-comparison/candidate.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize candidate-only performance results
        if: steps.performance-baseline.outputs.available != 'true' || steps.performance-baseline-test.outcome == 'failure'
        shell: bash
        run: |
          result="apps/frontend/test-results/performance-comparison/candidate.json"
          {
            echo "## Large-server E2E performance"
            if [[ "${{ steps.performance-baseline-test.outcome }}" == 'failure' ]]; then
              echo "> Warning: The base-revision benchmark failed, so these candidate results are not compared with the base revision."
              echo ""
            fi
            jq -r '"Fixture: \(.measurements.syntheticUsers) users, \(.measurements.messages) messages; \(.measurements.sampleCount)-sample medians (\(.measurements.startupMode) startup)"' "$result"
            echo ""
            echo "| Measurement | Duration (ms) |"
            echo "| --- | ---: |"
            jq -r '.measurements | to_entries[] | select(.key | endswith("Ms")) | "| \(.key) | \(.value | round) |"' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove performance baseline worktree
        if: ${{ always() && steps.performance-baseline.outputs.available == 'true' }}
        shell: bash
        run: git worktree remove --force "$RUNNER_TEMP/chatto-performance-base"

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: e2e-performance-results
          path: |
            apps/frontend/test-results/performance/
            apps/frontend/test-results/performance-comparison/
            apps/frontend/playwright-report-performance/
            apps/frontend/playwright-report-performance-base/
          retention-days: 30

  publish-main-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-main-image-contexts
      - license-check
      - workflow-lint
      - codegen-proto-drift
      - check-workspace
      - test-workspace
      - test-cli
      - test-e2e
      - test-e2e-media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download production image contexts
        uses: actions/download-artifact@v8
        with:
          name: production-image-contexts
          path: docker-contexts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable main image tag
        id: main-image
        shell: bash
        run: echo "tag=main-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: docker-contexts/linux-amd64
          file: docker-contexts/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-amd64
          cache-from: type=gha,scope=chatto-main-amd64
          cache-to: type=gha,scope=chatto-main-amd64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: docker-contexts/linux-arm64
          file: docker-contexts/linux-arm64/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/chattocorp/chatto:${{ github.sha }}-arm64
          cache-from: type=gha,scope=chatto-main-arm64
          cache-to: type=gha,scope=chatto-main-arm64,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-main-image-contexts.outputs.image-version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Publish multi-platform commit image
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/chattocorp/chatto:${GITHUB_SHA}" \
            --tag "ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-amd64" \
            "ghcr.io/chattocorp/chatto:${GITHUB_SHA}-arm64"

          {
            echo "### Main commit image"
            echo
            echo "\`ghcr.io/chattocorp/chatto:${GITHUB_SHA}\`"
            echo "\`ghcr.io/chattocorp/chatto:${{ steps.main-image.outputs.tag }}\`"
            echo
            echo "Version: \`${{ needs.build-main-image-contexts.outputs.image-version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  check-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          install-cli-deps: 'false'
      - run: pnpm turbo run check --filter=docs-website
      - run: pnpm run build:docs
