syntax = "proto3";

package chatto.admin.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

// Current state of a single-use registration code.
enum InvitationCodeStatus {
  INVITATION_CODE_STATUS_UNSPECIFIED = 0;
  INVITATION_CODE_STATUS_ACTIVE = 1;
  INVITATION_CODE_STATUS_EXPIRED = 2;
  INVITATION_CODE_STATUS_USED = 3;
  INVITATION_CODE_STATUS_REVOKED = 4;
}

// Permission to create one account on an invite-only server. Anyone who holds
// the code can use it; it is not bound to an email address or recipient.
message InvitationCode {
  string id = 1;
  // Recoverable capability, visible to its creator with user.invite or to invitation managers. Never log it.
  string code = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  // Absent means no expiry. Revocation and successful account creation still invalidate the code.
  google.protobuf.Timestamp expires_at = 5;
  InvitationCodeStatus status = 6;
  google.protobuf.Timestamp revoked_at = 7;
  // Optional creation-time note for the creator and invitation managers. Empty means no note.
  // This does not restrict who can redeem the code.
  string note = 8;
}

// Lists codes newest first, with ID as the tie-breaker.
message ListInvitationCodesRequest {
  // Default limit: 20. Maximum: 100.
  chatto.api.v1.PageRequest page = 1;
}
message ListInvitationCodesResponse {
  repeated InvitationCode invitation_codes = 1;
  chatto.api.v1.PageInfo page = 2;
}
message GetInvitationCodeRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message GetInvitationCodeResponse {
  InvitationCode invitation_code = 1;
}
// Creates one single-use code. The server sets expiry to seven days after creation.
message CreateInvitationCodeRequest {
  reserved 1;
  reserved "expires_at";
  // Optional plain-text note, up to 250 Unicode characters. Surrounding whitespace is removed.
  // Visible to the creator and invitation managers; it does not bind the code to a recipient.
  string note = 2 [(buf.validate.field).string.max_len = 250];
}
message CreateInvitationCodeResponse {
  InvitationCode invitation_code = 1;
}
message RevokeInvitationCodeRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message RevokeInvitationCodeResponse {
  InvitationCode invitation_code = 1;
}

// Issues and manages registration codes. user.invite permits access to own codes.
// Effective user.manage-invites permits access to all codes and requires
// privileged mode for human sessions.
// External systems can issue codes with an authorized API credential.
service AdminInvitationCodeService {
  // Lists visible current and historical codes. Pagination and totals include only visible codes.
  rpc ListInvitationCodes(ListInvitationCodesRequest) returns (ListInvitationCodesResponse);
  // Reads a code by ID. Returns NOT_FOUND for an unknown or inaccessible ID.
  rpc GetInvitationCode(GetInvitationCodeRequest) returns (GetInvitationCodeResponse);
  // Creates a code that expires seven days after creation for every caller.
  // Not idempotent: retrying creates another code.
  rpc CreateInvitationCode(CreateInvitationCodeRequest) returns (CreateInvitationCodeResponse);
  // Revokes a code without deleting its history. Repeating revocation is safe.
  // Returns NOT_FOUND for an unknown or inaccessible ID.
  rpc RevokeInvitationCode(RevokeInvitationCodeRequest) returns (RevokeInvitationCodeResponse);
}
