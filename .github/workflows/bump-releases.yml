name: Prepare releases

on:
  push:
    branches: [main]
    paths:
      - '**/.sweet/**'
      - '**/.sweet.yml'
      - '.sweet.config.yml'
      - '.github/workflows/bump-releases.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Sweet Release 0.5.0, pinned by commit. Keep every Sweet pin and
    # `sweet-version` equal, and equal to the Sweet version in mise.toml.
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@70a402d3552871474f3a0f152fb2795592ec714a # sweet@0.5.0
    with:
      sweet-version: sweet@0.5.0
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_PAT }}
