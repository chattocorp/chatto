syntax = "proto3";
package chatto.core.runtime_state.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/chattocorp/chatto/cli/internal/pb/chatto/core/runtime_state/v1;runtimestatev1";

// EmailDelivery is encrypted before storage in the expiring runtime record.
// It holds what the email says, not its wording or layout. The worker renders
// the email with the current templates and server branding when it sends it.
message EmailDelivery {
  // An unreleased development version stored a rendered HTML body and a sender
  // name here. The storage check accepts this reviewed removal.
  reserved 4, 5;
  reserved "html_body", "from_name";

  string to = 1;

  // `subject` and `body` hold a rendered plain-text email from a version before
  // `content`. Current versions do not write them. The worker sends such a
  // record as it is.

  // Rendered subject.
  string subject = 2;
  // Rendered plain-text body.
  string body = 3;

  oneof content {
    EmailCode registration_code = 6;
    EmailCode email_verification_code = 7;
    PasswordResetEmail password_reset = 8;
  }
}

// EmailCode is a one-time code and its lifetime, which the email shows.
message EmailCode {
  string code = 1;
  google.protobuf.Duration ttl = 2;
}

// PasswordResetEmail is a password reset token and its lifetime. The worker
// builds the reset link from the public web server URL.
message PasswordResetEmail {
  string token = 1;
  google.protobuf.Duration ttl = 2;
}

// SealedEmailDelivery binds ciphertext to its runtime key through associated data.
message SealedEmailDelivery {
  bytes nonce = 1;
  bytes ciphertext = 2;
}
