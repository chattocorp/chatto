[settings.general]
mise = true
autostop_delay = "0s"

[settings.proxy]
enable = true
port = 42443
https = true
auto_trust = true
auto_start = false
sync_hosts = false
worktree = false

[daemons.mailpit]
run = """
port_base=$(cat .context/dev/port-base)
workspace_slug=$(cat .context/dev/workspace-slug)
smtp_port=$((port_base + 8))
ui_port=$((port_base + 9))
exec mailpit \
  --smtp "127.0.0.1:$smtp_port" \
  --listen "127.0.0.1:$ui_port" \
  --api-cors "mailpit-$workspace_slug.localhost:42443"
"""
ready_output = "accessible via http://"
auto = ["stop"]

[daemons.livekit]
run = """
port_base=$(cat .context/dev/port-base)
http_port=$((port_base + 5))
rtc_tcp_port=$((port_base + 6))
udp_port=$((port_base + 7))
webhook_port=$((port_base + 1))
livekit_config=$(printf 'port: %s\nrtc:\n  tcp_port: %s\n  udp_port: %s\n  use_external_ip: false\n  enable_loopback_candidate: true\nkeys:\n  devkey: compose-only-livekit-secret-change-me\nwebhook:\n  urls:\n    - http://localhost:%s/webhooks/livekit\n  api_key: devkey\nlogging:\n  level: info\n' "$http_port" "$rtc_tcp_port" "$udp_port" "$webhook_port")
exec mise x 'go:github.com/livekit/livekit-server/cmd/server@v1.13.5' -- \
  server --bind 127.0.0.1 --node-ip 127.0.0.1 --config-body "$livekit_config"
"""
ready_output = "starting LiveKit server"
auto = ["stop"]

[daemons.authling]
run = """
project_dir=$(pwd -P)
port_base=$(cat .context/dev/port-base)
workspace_slug=$(cat .context/dev/workspace-slug)
authling_port=$((port_base + 2))
smtp_port=$((port_base + 8))
data_root="$project_dir/.context/dev/$workspace_slug"
mkdir -p "$data_root/authling/nats"
cd authling
mise build
export AUTHLING_HTTP_BIND_ADDRESS="127.0.0.1:$authling_port"
export AUTHLING_HTTP_PUBLIC_URL="https://authling-$workspace_slug.localhost:42443"
export AUTHLING_NATS_EMBEDDED_DATA_DIR="$data_root/authling/nats"
export AUTHLING_OIDC_CIMD_TRUSTED_LOOPBACK_HOSTS="chatto-$workspace_slug.localhost"
export AUTHLING_SMTP_PORT="$smtp_port"
exec bin/authling run
"""
ready_output = "Authling is ready"
depends = ["mailpit"]
auto = ["stop"]
env = {
  AUTHLING_HTTP_TRUST_PROXY_HEADERS = "true",
  AUTHLING_AUTHENTICATION_PASSWORD_MINIMUM_LENGTH = "10",
  AUTHLING_NATS_REPLICAS = "1",
  AUTHLING_NATS_EMBEDDED_ENABLED = "true",
  AUTHLING_SMTP_ENABLED = "true",
  AUTHLING_SMTP_HOST = "127.0.0.1",
  AUTHLING_SMTP_TLS = "opportunistic",
  AUTHLING_SMTP_FROM = "authling@authling.local",
}
watch = [
  "authling/**/*.go",
  "authling/**/*.templ",
  "authling/web/src/**/*",
  "authling/package.json",
  "authling/pnpm-lock.yaml",
  "authling/web/package.json",
  "pkg/**/*.go",
]

[daemons.chatto-backend]
dir = "cli"
run = """
project_dir=$(cd .. && pwd -P)
port_base=$(cat ../.context/dev/port-base)
workspace_slug=$(cat ../.context/dev/workspace-slug)
backend_port=$((port_base + 1))
nats_port=$((port_base + 4))
smtp_port=$((port_base + 8))
data_root="$project_dir/.context/dev/$workspace_slug"
mkdir -p internal/http_server/.client "$data_root/chatto/nats" "$data_root/chatto/search"
touch internal/http_server/.client/.gitkeep
go build -trimpath -tags 'bootstrap nomsgpack' -ldflags "-X main.Version=$CHATTO_DEVELOPMENT_VERSION" -o bin/chatto-dev .
export CHATTO_WEBSERVER_PORT="$backend_port"
export CHATTO_WEBSERVER_URL="https://chatto-$workspace_slug.localhost:42443"
export CHATTO_SEARCH_PROVIDER_DIRECTORY="$data_root/chatto/search"
export CHATTO_AUTH_PROVIDERS_0_ISSUER_URL="https://authling-$workspace_slug.localhost:42443"
export CHATTO_AUTH_PROVIDERS_0_CLIENT_ID="https://chatto-$workspace_slug.localhost:42443/oauth/client-metadata.json"
export CHATTO_LIVEKIT_URL="wss://livekit-$workspace_slug.localhost:42443"
export CHATTO_LIVEKIT_WEBHOOK_URL="http://localhost:$backend_port/webhooks/livekit"
export CHATTO_NATS_EMBEDDED_DATA_DIR="$data_root/chatto/nats"
export CHATTO_NATS_EMBEDDED_PORT="$nats_port"
export CHATTO_SMTP_PORT="$smtp_port"
exec ./bin/chatto-dev start
"""
