name: Setup Playwright
description: Cache and install the Chromium browser and system dependencies used by Playwright
inputs:
  working-directory:
    description: Directory whose Playwright dependency selects the browser build
    required: false
    default: apps/frontend
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: playwright-version
      shell: bash
      run: |
        version="$(pnpm --dir "${{ inputs.working-directory }}" exec playwright --version)"
        echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Playwright dependencies
      shell: bash
      run: pnpm --dir "${{ inputs.working-directory }}" exec playwright install chromium --with-deps
