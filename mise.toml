[tools]
actionlint = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:axllent/mailpit" = "1.30.6"
buf = "latest"
go = "1.26.7"
goreleaser = "latest"
node = "lts"
pnpm = "11.25.0"
uv = "0.11.30"

[env]
_.file = '.env'
CHATTO_DEVELOPMENT_VERSION = "0.5.0-dev"
CHATTO_DEV_PORT_BASE = "{{env.CONDUCTOR_PORT | default(value='4000')}}"
# The development stack runs this pinned LiveKit server through `mise x`.
CHATTO_DEV_LIVEKIT_SERVER = "go:github.com/livekit/livekit-server/cmd/server@v1.13.5"
# Browser-facing development services use `<service>.<workspace>.localhost`.
# These names resolve to loopback without DNS or /etc/hosts changes. They also
# give concurrent workspaces separate cookie scopes, because cookies ignore ports.
CHATTO_DEV_WORKSPACE = "{{env.CONDUCTOR_WORKSPACE_NAME | default(value='local')}}"
CHATTO_DEV_AUTHLING_URL = "http://authling.{{env.CHATTO_DEV_WORKSPACE}}.localhost:{{env.CHATTO_DEV_PORT_BASE | int + 2}}"
CHATTO_DEV_AUTHLING_CLIENT_ID = "chatto-dev"
CHATTO_DEV_AUTHLING_CLIENT_SECRET = "development-only-chatto-authling-client-secret"

# =============================================================================
# Setup
# =============================================================================

# Setup installs dependencies and tools only. Build tasks create binaries and
# package dists when a task needs them.
[tasks.setup]
description = "Install development dependencies and tools"
run = [
    { task = "setup-appconfig" },
    { task = "setup-cli" },
    { task = "setup-datacrypto" },
    { task = "setup-events" },
    { task = "setup-natsruntime" },
    { task = "setup-frontend" },
    { task = "setup-livekit" },
    { task = "setup-authling" },
]

# =============================================================================
# Dependencies
# =============================================================================

[tasks.deps-cli]
description = "Install Go dependencies"
dir = "cli"
run = "go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-appconfig]
description = "Install application configuration dependencies"
dir = "pkg/appconfig"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-datacrypto]
description = "Install data cryptography dependencies"
dir = "pkg/datacrypto"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-events]
description = "Install event framework Go dependencies"
dir = "pkg/events"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-natsruntime]
description = "Install embedded NATS runtime Go dependencies"
dir = "pkg/natsruntime"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-frontend]
description = "Install frontend dependencies"
dir = "."
run = "pnpm install"
# package.json also contains app metadata and scripts; the lockfile is the
# dependency-resolution input that should trigger installs.
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", "apps/*/package.json", "examples/*/package.json", "packages/*/package.json"]

[tasks.deps]
description = "Install all dependencies"
run = { task = "deps-*" }

[tasks.setup-cli]
description = "Set up the CLI module"
depends = ["deps-cli", "sync-cli-legal"]

[tasks.setup-appconfig]
description = "Set up the application configuration module"
depends = ["deps-appconfig"]

[tasks.setup-datacrypto]
description = "Set up the data cryptography module"
depends = ["deps-datacrypto"]

[tasks.setup-events]
description = "Set up the event framework module"
depends = ["deps-events"]

[tasks.setup-natsruntime]
description = "Set up the embedded NATS runtime module"
depends = ["deps-natsruntime"]

[tasks.setup-frontend]
description = "Set up the frontend module"
depends = ["deps-frontend"]

[tasks.setup-livekit]
description = "Install the LiveKit server that the development stack runs"
# `mise x` installs the pinned server on first use without activating it globally.
run = 'mise x "$CHATTO_DEV_LIVEKIT_SERVER" -- server --version'

[tasks.setup-authling]
description = "Install the Authling tools and dependencies that the development stack runs"
# Authling owns its toolchain and task catalog in `authling/mise.toml`. This
# task only calls into it, so Authling can move to its own repository unchanged.
dir = "authling"
run = "mise trust && mise install && mise run deps"

# =============================================================================
# License Metadata
# =============================================================================

[tasks.license-check]
description = "Check SPDX/REUSE license metadata"
run = "uvx --with charset-normalizer 'reuse==6.2.0' lint"

[tasks.lint-actions]
description = "Check GitHub Actions workflows and repository shell scripts"
run = ["actionlint", "shellcheck --severity=warning tools/*.sh"]

# =============================================================================
# Code Generation
# =============================================================================

[tasks.lint-proto]
description = "Check Chatto protobuf naming and schema conventions"
dir = "proto"
run = "buf lint"

[tasks.codegen-proto]
description = "Generate Go and frontend code from protobuf schemas"
depends = ["setup-cli", "setup-frontend"]
dir = "proto"
run = [
    "pnpm --dir ../packages/api-types run clean",
    "buf generate",
    "node ../tools/split-connectrpc-docs.mjs",
    "node ../tools/trim-proto-codegen-output.mjs",
]

[tasks.codegen-emoji]
description = "Generate Go emoji map from gemoji npm package"
depends = ["setup-frontend"]
run = "node tools/gen-emoji-map.mjs"

[tasks.codegen]
description = "Run all code generation tasks"
run = { task = "codegen-*" }

# =============================================================================
# Build
# =============================================================================

# Chatto does not expose Gin's MessagePack binding. Keep the nomsgpack tag on
# every Chatto binary build so the large, unused ugorji codec is not linked.

[tasks.sync-cli-legal]
description = "Copy root legal files into the CLI module for go:embed"
run = [
    "mkdir -p cli/cmd/embedded",
    "cp LICENSES/AGPL-3.0-or-later.txt cli/LICENSE",
    "cp NOTICE cli/NOTICE",
    "cp LICENSES/AGPL-3.0-or-later.txt cli/cmd/embedded/LICENSE",
    "cp NOTICE cli/cmd/embedded/NOTICE",
]
sources = ["LICENSES/AGPL-3.0-or-later.txt", "NOTICE"]
outputs = ["cli/LICENSE", "cli/NOTICE", "cli/cmd/embedded/LICENSE", "cli/cmd/embedded/NOTICE"]

[tasks.build]
description = "Build Chatto and its bundled frontend"
run = [{ task = "build-*" }, "ls -lah cli/bin/*"]

[tasks.desktop-build]
description = "Build the experimental Chatto desktop app for the host platform"
depends = ["build-frontend"]
dir = "apps/desktop"
run = "pnpm build"

[tasks.mobile-ios-sync]
description = "Bundle the shared frontend into the experimental iOS app"
depends = ["build-frontend"]
dir = "apps/mobile"
run = "pnpm sync:ios"

[tasks.mobile-ios-open]
description = "Open the current iOS app in Xcode"
depends = ["mobile-ios-sync"]
dir = "apps/mobile"
run = "pnpm open:ios"

[tasks.mobile-ios-build]
description = "Build the experimental iOS app for Simulator without signing"
depends = ["mobile-ios-sync"]
dir = "apps/mobile"
run = "pnpm build:ios"

[tasks.build-api-types]
description = "Build the generated TypeScript API package"
depends = ["setup-frontend"]
run = "pnpm run build:api-types"

[tasks.build-lingua]
description = "Build the JSON internationalisation runtime package"
depends = ["setup-frontend"]
run = "pnpm run build:lingua"

[tasks.test-runling-bot]
description = "Test the Runling webhook bot example"
depends = ["setup-frontend"]
run = "pnpm turbo run test --filter=@chatto/runling-bot"

[tasks.build-runling]
description = "Build the Runling runtime and web console"
depends = ["setup-frontend"]
run = "pnpm run build:runling"

[tasks.build-chatto-client]
description = "Build the framework-neutral Chatto integration client"
depends = ["setup-frontend"]
run = "pnpm run build:chatto-client"

[tasks.test-chatto-client]
description = "Check and test the Chatto integration client"
depends = ["setup-frontend"]
run = "pnpm turbo run check test --filter=@chatto/client"

[tasks.build-chatto-bot-client]
description = "Build the framework-neutral Chatto bot helpers"
depends = ["setup-frontend"]
run = "pnpm turbo run build --filter=@chatto/bot-client"

[tasks.test-chatto-bot-client]
description = "Check and test the Chatto bot helpers"
depends = ["setup-frontend"]
run = "pnpm turbo run check test --filter=@chatto/bot-client"

[tasks.check-runling]
description = "Check Runling types and Svelte components"
depends = ["setup-frontend"]
run = "pnpm run check:runling"

[tasks.dev-chattobot]
description = "Run ChattoBot with its Runling console"
depends = ["setup-frontend"]
run = "pnpm run dev:chattobot"

[tasks.check-chattobot]
description = "Check the ChattoBot package types"
depends = ["setup-frontend"]
run = "pnpm run check:chattobot"

[tasks.test-chattobot]
description = "Test the ChattoBot package"
depends = ["setup-frontend"]
run = "pnpm run test:chattobot"

[tasks.test-runling]
description = "Run Runling unit and integration tests"
depends = ["setup-frontend"]
run = "pnpm run test:runling"

[tasks.test-runling-package]
description = "Build Runling and test its installed npm package"
depends = ["build-runling"]
run = "pnpm --filter runling test:package"

[tasks.build-frontend]
description = "Build the frontend application"
depends = ["setup-frontend"]
dir = "apps/frontend"
# Turbo restores an unchanged build from the cache that all worktrees share.
run = [
    "pnpm --dir ../.. run build:frontend",
    "bash ../../tools/prepare-embedded-frontend.sh build ../../cli/internal/http_server/.client",
]

[tasks.build-dev-cli]
description = "Build the development CLI application for the current architecture"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
# `-w` omits DWARF debug information. This reduces each link by approximately
# 5 seconds. Stack traces still work. Remove `-w` locally to debug with Delve.
run = "go build -trimpath -tags 'bootstrap nomsgpack' -ldflags \"-w -X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o bin/chatto ."
sources = [
    "go.mod",
    "go.sum",
    "**/*.go",
    "!**/*_test.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["bin/chatto"]

[tasks.seed]
description = "Add reproducible synthetic data to the running development server"
depends = ["build-dev-cli"]
dir = "cli"
run = '''
exec ./bin/chatto operator seed --operator-socket "${CHATTO_DEV_DATA_ROOT:-./data}/operator/operator.sock" "$@"
'''

[tasks.build-e2e-server]
description = "Build the E2E test server binary with dev bootstrap and test endpoints enabled"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
# `bootstrap` enables the [bootstrap] section in chatto.toml, which seeds
# the e2eadmin user the harness logs in as. `test_endpoints` exposes the
# test-only HTTP endpoints (e.g. /auth/test/create-user) used by per-test
# fixtures. Deliberately scoped — the e2e binary should NOT pull in any
# future broader dev-only code that might land under a separate tag.
run = "CGO_ENABLED=0 go build -trimpath -tags 'bootstrap nomsgpack test_endpoints' -ldflags \"-s -w -X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o ../apps/frontend/e2e/fixtures/bin/chatto ."
sources = [
    "**/*.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["../apps/frontend/e2e/fixtures/bin/chatto"]

[tasks.build-compatibility-server]
description = "Build the production Chatto binary used as the current side of compatibility tests"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
run = "CGO_ENABLED=0 go build -trimpath -tags nomsgpack -ldflags \"-s -w -X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o ../apps/frontend/e2e/fixtures/bin/chatto-current ."
sources = [
    "**/*.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["../apps/frontend/e2e/fixtures/bin/chatto-current"]

[tasks.storybook]
description = "Run the Storybook design-system catalog"
depends = ["setup-frontend", "build-api-types"]
dir = "apps/frontend"
# `mise dev` and `mise dev-frontend` use the complete workspace port block.
# Storybook therefore uses the first free loopback port from 6006. Storybook's
# own fallback checks a different address than the loopback listener.
run = '''
port=6006
while lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1; do
  port=$((port + 1))
done
exec pnpm exec storybook dev --host 127.0.0.1 --port "$port" --exact-port --no-open
'''

[tasks.desktop-dev]
description = "Run the experimental Chatto desktop app with the latest frontend build"
depends = ["build-frontend"]
dir = "apps/desktop"
run = "pnpm dev"

# The development stack uses the workspace port block as follows. The base is
# `CONDUCTOR_PORT`, or 4000 outside Conductor.
#
#   +0  Chatto with its embedded frontend (`mise dev`)
#   +1  Vite frontend development server (`mise dev-frontend`)
#   +2  Authling
#   +3  Runling bot console
#   +4  Chatto embedded NATS
#   +5  LiveKit HTTP and WebSocket signaling
#   +6  LiveKit RTC over TCP
#   +7  LiveKit RTC over UDP
#   +8  Mailpit SMTP
#   +9  Mailpit web UI

[tasks.dev]
description = "Build and run Chatto, Authling, Runling, Mailpit, and LiveKit"
depends = ["build-dev-cli", "build-runling"]
run = '''
CONDUCTOR_WORKSPACE_PATH="$PWD" tools/stop-workspace-dev.sh "$CHATTO_DEV_PORT_BASE"
exec "$PWD/tools/dev-supervisor.sh" mise run --jobs 5 --output prefix \
  dev-stack-mailpit ::: dev-stack-livekit ::: dev-stack-authling ::: \
  dev-stack-backend ::: dev-stack-runling-bot
'''

[tasks.dev-frontend]
description = "Run the Vite frontend development server against a Chatto server"
depends = ["setup-frontend", "build-api-types", "build-lingua"]
dir = "apps/frontend"
env = { VITE_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 1}}" }
# CHATTO_BACKEND_URL selects the proxied Chatto server. The default is the
# server that `mise dev` runs in the same workspace.
run = '''
export CHATTO_BACKEND_URL="${CHATTO_BACKEND_URL:-http://127.0.0.1:$CHATTO_DEV_PORT_BASE}"
echo "Vite: http://chatto.$CHATTO_DEV_WORKSPACE.localhost:$VITE_PORT (Chatto server: $CHATTO_BACKEND_URL)"
exec ./node_modules/.bin/vite dev --host 127.0.0.1
'''

[tasks.dev-stack-mailpit]
hide = true
env = {
  CHATTO_DEV_MAILPIT_SMTP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 8}}",
  CHATTO_DEV_MAILPIT_UI_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 9}}",
}
run = '''
echo "Mailpit: http://localhost:$CHATTO_DEV_MAILPIT_UI_PORT"
exec mailpit --smtp "127.0.0.1:$CHATTO_DEV_MAILPIT_SMTP_PORT" \
  --listen "127.0.0.1:$CHATTO_DEV_MAILPIT_UI_PORT"
'''

[tasks.dev-stack-livekit]
hide = true
env = {
  CHATTO_DEV_BACKEND_PORT = "{{env.CHATTO_DEV_PORT_BASE}}",
  CHATTO_DEV_LIVEKIT_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 5}}",
  CHATTO_DEV_LIVEKIT_RTC_TCP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 6}}",
  CHATTO_DEV_LIVEKIT_UDP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 7}}",
}
run = '''
set -eu
livekit_config=$(printf 'port: %s\nrtc:\n  tcp_port: %s\n  udp_port: %s\n  use_external_ip: false\n  enable_loopback_candidate: true\nkeys:\n  devkey: compose-only-livekit-secret-change-me\nwebhook:\n  urls:\n    - http://127.0.0.1:%s/webhooks/livekit\n  api_key: devkey\nlogging:\n  level: info\n' "$CHATTO_DEV_LIVEKIT_PORT" "$CHATTO_DEV_LIVEKIT_RTC_TCP_PORT" "$CHATTO_DEV_LIVEKIT_UDP_PORT" "$CHATTO_DEV_BACKEND_PORT")
exec mise x "$CHATTO_DEV_LIVEKIT_SERVER" -- \
  server --bind 127.0.0.1 --node-ip 127.0.0.1 --config-body "$livekit_config"
'''

[tasks.dev-stack-authling]
hide = true
env = {
  AUTHLING_HTTP_BIND_ADDRESS = "127.0.0.1:{{env.CHATTO_DEV_PORT_BASE | int + 2}}",
  AUTHLING_AUTHENTICATION_PASSWORD_MINIMUM_LENGTH = "10",
  AUTHLING_NATS_REPLICAS = "1",
  AUTHLING_NATS_EMBEDDED_ENABLED = "true",
  AUTHLING_SMTP_ENABLED = "true",
  AUTHLING_SMTP_HOST = "127.0.0.1",
  AUTHLING_SMTP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 8}}",
  AUTHLING_SMTP_TLS = "opportunistic",
  AUTHLING_SMTP_FROM = "authling@authling.local",
}
# CIMD client identifiers require HTTPS. The plain-HTTP stack therefore
# registers Chatto as a conventional confidential client. The generated file
# extends Authling's development configuration. Environment values override it.
run = '''
set -eu
project_dir=$(pwd -P)
chatto_url="http://chatto.$CHATTO_DEV_WORKSPACE.localhost:$CHATTO_DEV_PORT_BASE"
data_root="$project_dir/.context/dev/$CHATTO_DEV_WORKSPACE/authling"
config_path="$data_root/authling.toml"
mkdir -p "$data_root/nats"
cd authling
mise build
cp authling.toml "$config_path"
cat >>"$config_path" <<TOML

[[oidc.clients]]
id = '$CHATTO_DEV_AUTHLING_CLIENT_ID'
name = 'Chatto'
secret = '$CHATTO_DEV_AUTHLING_CLIENT_SECRET'
redirect_uris = ['$chatto_url/auth/providers/authling/callback']
TOML
export AUTHLING_HTTP_PUBLIC_URL="$CHATTO_DEV_AUTHLING_URL"
export AUTHLING_NATS_EMBEDDED_DATA_DIR="$data_root/nats"
echo "Authling: $AUTHLING_HTTP_PUBLIC_URL"
exec bin/authling run --config "$config_path"
'''

[tasks.dev-stack-backend]
hide = true
depends = ["build-dev-cli"]
shell = "bash -c"
env = {
  CHATTO_WEBSERVER_PORT = "{{env.CHATTO_DEV_PORT_BASE}}",
  CHATTO_WEBSERVER_URL = "http://chatto.{{env.CHATTO_DEV_WORKSPACE}}.localhost:{{env.CHATTO_DEV_PORT_BASE}}",
  CHATTO_NATS_EMBEDDED_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 4}}",
  CHATTO_SMTP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 8}}",
  CHATTO_LOG_LEVEL = "debug",
  CHATTO_LOG_FORMAT = "text",
  CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET = "871a846584490a6153305533cce100b8e6f39d4184c2fb499d2ed198a9ed37a3",
  CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET = "a3955a342ba4cb4ffb457a1177295779fbbb73f8e22cd4f68ecb9fb584afcf66",
  CHATTO_METRICS_ENABLED = "false",
  CHATTO_EXPORTER_ENABLED = "false",
  CHATTO_OPERATOR_API_ENABLED = "true",
  CHATTO_MCP_ENABLED = "true",
  CHATTO_SEARCH_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_LANGUAGES = "de,en",
  CHATTO_CORE_SECRET_KEY = "2ff88b0e8ceb09c399193d1b9339577e6b0fac883777176231e84f92aa78f794",
  CHATTO_CORE_PROJECTION_SNAPSHOTS = "true",
  CHATTO_CORE_ASSETS_SIGNING_SECRET = "2e5cac66f8ea81759952186886d233410c1e6e18e3048bc680792935206240e0",
  CHATTO_CORE_ASSETS_MAX_UPLOAD_SIZE = "25MB",
  CHATTO_CORE_ASSETS_CACHE_ENABLED = "true",
  CHATTO_CORE_ASSETS_CACHE_TTL = "7d",
  CHATTO_AUTH_ACCOUNT_CREATION_POLICY = "open",
  CHATTO_AUTH_PROVIDERS_0_ID = "authling",
  CHATTO_AUTH_PROVIDERS_0_TYPE = "oidc",
  CHATTO_AUTH_PROVIDERS_0_LABEL = "Authling",
  CHATTO_AUTH_PROVIDERS_0_ISSUER_URL = "{{env.CHATTO_DEV_AUTHLING_URL}}",
  CHATTO_AUTH_PROVIDERS_0_CLIENT_ID = "{{env.CHATTO_DEV_AUTHLING_CLIENT_ID}}",
  CHATTO_AUTH_PROVIDERS_0_CLIENT_SECRET = "{{env.CHATTO_DEV_AUTHLING_CLIENT_SECRET}}",
  CHATTO_AUTH_PROVIDERS_0_REQUEST_EMAIL = "false",
  CHATTO_AUTH_PROVIDERS_0_AUTO_PROVISION = "true",
  CHATTO_SMTP_ENABLED = "true",
  CHATTO_SMTP_HOST = "127.0.0.1",
  CHATTO_SMTP_TLS = "opportunistic",
  CHATTO_SMTP_FROM = "chatto@chatto.local",
  CHATTO_VIDEO_ENABLED = "true",
  CHATTO_ASSET_PROCESSING_ENABLED = "true",
  CHATTO_LIVEKIT_ENABLED = "true",
  CHATTO_LIVEKIT_URL = "ws://localhost:{{env.CHATTO_DEV_PORT_BASE | int + 5}}",
  CHATTO_LIVEKIT_WEBHOOK_URL = "http://127.0.0.1:{{env.CHATTO_DEV_PORT_BASE}}/webhooks/livekit",
  CHATTO_LIVEKIT_API_KEY = "devkey",
  CHATTO_LIVEKIT_API_SECRET = "compose-only-livekit-secret-change-me",
  CHATTO_NATS_EMBEDDED_ENABLED = "true",
  CHATTO_NATS_EMBEDDED_AUTH_TOKEN = "a4a3102bf032b2d8ec14cf4c23fe54cb6a2054e1ad5e24aa4ada78768340e263",
  CHATTO_BOOTSTRAP_USERS_0_LOGIN = "alice",
  CHATTO_BOOTSTRAP_USERS_0_DISPLAY_NAME = "Alice",
  CHATTO_BOOTSTRAP_USERS_0_EMAIL = "alice@example.com",
  CHATTO_BOOTSTRAP_USERS_0_PASSWORD = "foobar123",
  CHATTO_BOOTSTRAP_USERS_0_SERVER_ROLE = "owner",
  CHATTO_BOOTSTRAP_USERS_1_LOGIN = "bob",
  CHATTO_BOOTSTRAP_USERS_1_DISPLAY_NAME = "Bob",
  CHATTO_BOOTSTRAP_USERS_1_EMAIL = "bob@example.com",
  CHATTO_BOOTSTRAP_USERS_1_PASSWORD = "foobar123",
  CHATTO_BOOTSTRAP_BOTS_0_LOGIN = "test_bot",
  CHATTO_BOOTSTRAP_BOTS_0_DISPLAY_NAME = "TestBot",
  CHATTO_BOOTSTRAP_BOTS_0_BIO = "I'm **TestBot**, Chatto's development assistant. Mention `@test_bot` in a channel or send me a direct message.",
  CHATTO_BOOTSTRAP_BOTS_0_OWNER_LOGIN = "alice",
  CHATTO_BOOTSTRAP_BOTS_0_API_KEY_NAME = "Local development",
  CHATTO_BOOTSTRAP_BOTS_0_OUTBOUND_WEBHOOK_URL = "http://localhost:{{env.CHATTO_DEV_PORT_BASE | int + 3}}/api/runs/start/chatto",
  CHATTO_BOOTSTRAP_BOTS_0_CREDENTIAL_FILE = "./data/bootstrap/test_bot.key",
  CHATTO_BOOTSTRAP_BOTS_0_PERMISSIONS = "room.join,room.list,message.read,message.post-in-thread",
  CHATTO_BOOTSTRAP_BOTS_0_ROOMS = "general",
  CHATTO_BOOTSTRAP_SERVER_NAME = "Chatto + Authling",
}
run = '''
set -eu
project_dir=$(pwd -P)
data_root=${CHATTO_DEV_DATA_ROOT:-$project_dir/cli/data}
mkdir -p "$data_root/bootstrap" "$data_root/nats" "$data_root/search"
export CHATTO_OPERATOR_API_SOCKET_PATH="$data_root/operator/operator.sock"
export CHATTO_NATS_EMBEDDED_DATA_DIR="$data_root/nats"
export CHATTO_SEARCH_PROVIDER_DIRECTORY="$data_root/search"
export CHATTO_BOOTSTRAP_BOTS_0_CREDENTIAL_FILE="$data_root/bootstrap/test_bot.key"
echo "Chatto: $CHATTO_WEBSERVER_URL"
exec cli/bin/chatto start
'''

[tasks.dev-stack-runling-bot]
hide = true
env = {
  CHATTO_RUNLING_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 3}}",
  CHATTO_RUNLING_SERVER_URL = "http://127.0.0.1:{{env.CHATTO_DEV_PORT_BASE}}",
}
run = '''
set -eu
project_dir=$(pwd -P)
data_root=${CHATTO_DEV_DATA_ROOT:-$project_dir/cli/data}
export CHATTO_RUNLING_API_KEY_FILE="$data_root/bootstrap/test_bot.key"
cd examples/runling-bot
echo "Runling: http://localhost:$CHATTO_RUNLING_PORT"
exec node "$project_dir/packages/runling/bin/runling.js" serve --host 127.0.0.1 --port "$CHATTO_RUNLING_PORT"
'''

[tasks.dev-docs-website]
description = "Run the docs website development server"
depends = ["setup-frontend"]
dir = "apps/docs-website"
# Astro starts at port 4321 and selects the next free port when another
# workspace already uses it.
run = "exec pnpm astro dev --host 127.0.0.1"

[tasks.chatto]
description = "Build and run the bundled Chatto CLI command with the development stack's ports"
depends = ["build-dev-cli"]
dir = "cli"
env = {
  CHATTO_WEBSERVER_PORT = "{{env.CHATTO_DEV_PORT_BASE}}",
  CHATTO_WEBSERVER_URL = "http://chatto.{{env.CHATTO_DEV_WORKSPACE}}.localhost:{{env.CHATTO_DEV_PORT_BASE}}",
  CHATTO_NATS_EMBEDDED_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 4}}",
  CHATTO_NATS_CLIENT_URL = "nats://localhost:{{env.CHATTO_DEV_PORT_BASE | int + 4}}",
  CHATTO_MCP_ENABLED = "true",
  CHATTO_LIVEKIT_ENABLED = "true",
  CHATTO_LIVEKIT_URL = "ws://localhost:{{env.CHATTO_DEV_PORT_BASE | int + 5}}",
  CHATTO_LIVEKIT_API_KEY = "devkey",
  CHATTO_LIVEKIT_API_SECRET = "compose-only-livekit-secret-change-me",
  CHATTO_LIVEKIT_WEBHOOK_URL = "http://127.0.0.1:{{env.CHATTO_DEV_PORT_BASE}}/webhooks/livekit",
  CHATTO_SMTP_ENABLED = "true",
  CHATTO_SMTP_HOST = "127.0.0.1",
  CHATTO_SMTP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 8}}",
  CHATTO_SMTP_TLS = "opportunistic",
  CHATTO_SMTP_FROM = "chatto-dev@chatto.localhost",
}
run = "exec bin/chatto"

# =============================================================================
# Benchmarking
# =============================================================================

[tasks.bench-projections]
description = "Benchmark projection replay throughput and retained heap"
depends = ["setup-cli"]
dir = "cli"
run = [
    "go test -trimpath ./internal/core -run '^$' -bench '^BenchmarkProjectionReplay$' -benchmem -count=${CHATTO_BENCH_COUNT:-5}",
    "go test -trimpath ./internal/core -run '^$' -bench '^BenchmarkProjectionRetainedHeap$' -benchmem -benchtime=1x -count=${CHATTO_BENCH_COUNT:-5}",
]

[tasks.bench-projections-profile]
description = "Capture exact retained-heap profiles for projection replay"
depends = ["setup-cli"]
dir = "cli"
env = { CHATTO_BENCH_HEAP_PROFILE_DIR = "../.context/bench/projections" }
run = "go test -trimpath ./internal/core -run '^$' -bench '^BenchmarkProjectionRetainedHeap$' -benchmem -benchtime=1x -count=1"

# =============================================================================
# Testing
# =============================================================================

[tasks.test-cli]
description = "Run CLI tests"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
run = [
    "../tools/dev-supervisor_test.sh",
    "node ../tools/dev-seed-smoke.mjs",
    "go test -trimpath -p ${CHATTO_GO_TEST_P:-4} -tags test_endpoints ./...",
]
sources = ["**/*.go", "cmd/embedded/LICENSE", "cmd/embedded/NOTICE", "../mise.toml", "../tools/dev-seed-smoke.mjs"]

[tasks.test-appconfig]
description = "Run application configuration tests standalone and in the repository workspace"
depends = ["setup-appconfig"]
dir = "pkg/appconfig"
run = [
    "GOWORK=off go test -trimpath ./...",
    "go test -trimpath ./...",
]
sources = ["go.mod", "go.sum", "**/*.go"]

[tasks.test-events]
description = "Run event framework tests standalone and in the repository workspace"
depends = ["setup-events"]
dir = "pkg/events"
run = [
    "GOWORK=off go test -trimpath ./...",
    "go test -trimpath ./...",
]
sources = ["go.mod", "go.sum", "**/*.go"]

[tasks.test-datacrypto]
description = "Run data cryptography tests standalone and in the repository workspace"
depends = ["setup-datacrypto"]
dir = "pkg/datacrypto"
run = [
    "GOWORK=off go test -trimpath ./...",
    "go test -trimpath ./...",
]
sources = ["go.mod", "go.sum", "**/*.go"]

[tasks.test-natsruntime]
description = "Run embedded NATS runtime tests standalone and in the repository workspace"
depends = ["setup-natsruntime"]
dir = "pkg/natsruntime"
run = [
    "GOWORK=off go test -trimpath ./...",
    "go test -trimpath ./...",
]
sources = ["go.mod", "go.sum", "**/*.go"]

[tasks.test-cli-shutdown]
description = "Run backend process shutdown integration tests"
depends = ["setup-cli"]
dir = "cli"
run = "go test -trimpath -tags integration ./cmd -run TestRunCommandShutsDownOnSignals -count=1 -timeout 2m"
sources = ["**/*.go", "cmd/embedded/LICENSE", "cmd/embedded/NOTICE"]

[tasks.knip]
description = "Find unused frontend/docs files, dependencies, and exports"
depends = ["setup-frontend"]
run = "pnpm knip"

[tasks.lint-frontend]
description = "Run TypeScript and ESLint checks on frontend"
depends = ["setup-frontend"]
run = ["pnpm run check:frontend", "pnpm run lint:frontend"]

[tasks.lint-cli]
description = "Vet the Chatto CLI module and check it for unused code"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
tools = { "go:honnef.co/go/tools/cmd/staticcheck" = "0.8.1" }
# The build matrix makes staticcheck report a symbol as unused only when no
# build tag set uses it.
run = [
    "go vet ./...",
    '''
staticcheck -checks U1000 -matrix ./... <<'EOF'
default:
bootstrap: -tags bootstrap
test_endpoints: -tags test_endpoints
integration: -tags integration
EOF
''',
]

[tasks.lint-appconfig]
description = "Vet application configuration standalone and in the workspace"
depends = ["setup-appconfig"]
dir = "pkg/appconfig"
run = ["GOWORK=off go vet ./...", "go vet ./..."]

[tasks.lint-datacrypto]
description = "Vet data cryptography standalone and in the workspace"
depends = ["setup-datacrypto"]
dir = "pkg/datacrypto"
run = ["GOWORK=off go vet ./...", "go vet ./..."]

[tasks.lint-events]
description = "Vet the event framework standalone and in the workspace"
depends = ["setup-events"]
dir = "pkg/events"
run = ["GOWORK=off go vet ./...", "go vet ./..."]

[tasks.lint-natsruntime]
