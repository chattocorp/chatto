syntax = "proto3";

package chatto.core.job.v1;

option go_package = "github.com/chattocorp/chatto/cli/internal/pb/chatto/core/job/v1;jobv1";

// Durable JOBS dispatch reference. The latest record in RUNTIME_STATE owns the
// payload, retry budget, and claim. Generation rejects an old dispatch after a
// manual retry. Dispatches contain no content or credentials.
message JobDispatch {
  string id = 1;
  uint64 generation = 2;
}
