name: Setup Playwright
description: Verify Chromium in the E2E image, or install it on a host runner
inputs:
  use-image:
    description: Require the preinstalled browser from the E2E test image
    required: false
    default: 'false'
  working-directory:
    description: Directory whose Playwright dependency selects the browser build
    required: false
    default: apps/frontend
  save-cache:
    description: Save the shared browser cache when the job completes
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Verify image Playwright version and Chromium
      if: inputs.use-image == 'true'
      shell: bash
      env:
        PLAYWRIGHT_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        expected="$(cat /opt/media-e2e-playwright-version)"
        actual="$(pnpm --dir "$PLAYWRIGHT_DIRECTORY" exec playwright --version)"
        if test "$actual" != "Version $expected"; then
          echo '::error::Align Playwright versions, rebuild the E2E image, and update all workflow image digests in this branch.'
          exit 1
        fi
        mkdir -p "$GITHUB_WORKSPACE/.context"
        pnpm --dir "$PLAYWRIGHT_DIRECTORY" exec playwright screenshot --browser chromium about:blank "$GITHUB_WORKSPACE/.context/e2e-chromium.png"

    - name: Resolve Playwright version
      if: inputs.use-image != 'true'
      id: playwright-version
      shell: bash
      run: |
        version="$(pnpm --dir "${{ inputs.working-directory }}" exec playwright --version)"
        echo "version=${version// /-}" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      if: inputs.use-image != 'true' && inputs.save-cache != 'true'
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore and save Playwright browsers
      if: inputs.use-image != 'true' && inputs.save-cache == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-

    - name: Install Playwright dependencies
      if: inputs.use-image != 'true'
      shell: bash
      run: pnpm --dir "${{ inputs.working-directory }}" exec playwright install chromium --with-deps
