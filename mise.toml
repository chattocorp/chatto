[tools]
actionlint = "latest"
"aqua:axllent/mailpit" = "1.30.6"
buf = "latest"
go = "1.26.7"
goreleaser = "latest"
node = "22"
uv = "0.11.30"

[env]
_.file = '.env'
CHATTO_DEVELOPMENT_VERSION = "0.5.0-dev"

# =============================================================================
# Setup
# =============================================================================

[tasks.setup]
description = "Set up the development environment"
run = [
    { task = "setup-appconfig" },
    { task = "setup-cli" },
    { task = "setup-datacrypto" },
    { task = "setup-events" },
    { task = "setup-natsruntime" },
    { task = "setup-frontend" },
    { task = "build-api-types" },
    { task = "build-lingua" },
]

# =============================================================================
# Dependencies
# =============================================================================

[tasks.deps-cli]
description = "Install Go dependencies"
dir = "cli"
run = "go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-appconfig]
description = "Install application configuration dependencies"
dir = "pkg/appconfig"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-datacrypto]
description = "Install data cryptography dependencies"
dir = "pkg/datacrypto"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-events]
description = "Install event framework Go dependencies"
dir = "pkg/events"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-natsruntime]
description = "Install embedded NATS runtime Go dependencies"
dir = "pkg/natsruntime"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-frontend]
description = "Install frontend dependencies"
dir = "."
run = "pnpm install"
# package.json also contains app metadata and scripts; the lockfile is the
# dependency-resolution input that should trigger installs.
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", "apps/*/package.json", "packages/*/package.json"]

[tasks.deps]
description = "Install all dependencies"
run = { task = "deps-*" }

[tasks.setup-cli]
description = "Set up the CLI module"
depends = ["deps-cli", "sync-cli-legal"]

[tasks.setup-appconfig]
description = "Set up the application configuration module"
depends = ["deps-appconfig"]

[tasks.setup-datacrypto]
description = "Set up the data cryptography module"
depends = ["deps-datacrypto"]

[tasks.setup-events]
description = "Set up the event framework module"
depends = ["deps-events"]

[tasks.setup-natsruntime]
description = "Set up the embedded NATS runtime module"
depends = ["deps-natsruntime"]

[tasks.setup-frontend]
description = "Set up the frontend module"
depends = ["deps-frontend"]

# =============================================================================
# License Metadata
# =============================================================================

[tasks.license-check]
description = "Check SPDX/REUSE license metadata"
run = "uvx --with charset-normalizer 'reuse==6.2.0' lint"

# =============================================================================
# Code Generation
# =============================================================================

[tasks.codegen-proto]
description = "Generate Go and frontend code from protobuf schemas"
depends = ["setup-cli", "setup-frontend"]
dir = "proto"
run = [
    "pnpm --dir ../packages/api-types run clean",
    "buf generate",
    "node ../tools/split-connectrpc-docs.mjs",
    "node ../tools/trim-proto-codegen-output.mjs",
]

[tasks.codegen-emoji]
description = "Generate Go emoji map from gemoji npm package"
depends = ["setup-frontend"]
run = "node tools/gen-emoji-map.mjs"

[tasks.codegen]
description = "Run all code generation tasks"
run = { task = "codegen-*" }

# =============================================================================
# Build
# =============================================================================

# Chatto does not expose Gin's MessagePack binding. Keep the nomsgpack tag on
# every Chatto binary build so the large, unused ugorji codec is not linked.

[tasks.sync-cli-legal]
description = "Copy root legal files into the CLI module for go:embed"
run = [
    "mkdir -p cli/cmd/embedded",
    "cp LICENSES/AGPL-3.0-or-later.txt cli/LICENSE",
    "cp NOTICE cli/NOTICE",
    "cp LICENSES/AGPL-3.0-or-later.txt cli/cmd/embedded/LICENSE",
    "cp NOTICE cli/cmd/embedded/NOTICE",
]
sources = ["LICENSES/AGPL-3.0-or-later.txt", "NOTICE"]
outputs = ["cli/LICENSE", "cli/NOTICE", "cli/cmd/embedded/LICENSE", "cli/cmd/embedded/NOTICE"]

[tasks.build]
description = "Build Chatto and its bundled frontend"
run = [{ task = "build-*" }, "ls -lah cli/bin/*"]

[tasks.desktop-build]
description = "Build the experimental Chatto desktop app for the host platform"
depends = ["build-frontend"]
dir = "apps/desktop"
run = "pnpm build"

[tasks.build-api-types]
description = "Build the generated TypeScript API package"
depends = ["setup-frontend"]
dir = "packages/api-types"
run = "pnpm build"
sources = ["package.json", "tsconfig.json", "src/**/*"]

[tasks.build-lingua]
description = "Build the JSON internationalisation runtime package"
depends = ["setup-frontend"]
dir = "packages/lingua"
run = "pnpm build"
sources = ["package.json", "tsconfig.json", "src/**/*"]

[tasks.build-frontend]
description = "Build the frontend application"
depends = ["setup-frontend", "build-api-types", "build-lingua"]
dir = "apps/frontend"
run = [
    "pnpm svelte-kit sync",
    "pnpm build",
    "touch build/.mise-build-stamp",
    "bash ../../tools/prepare-embedded-frontend.sh build ../../cli/internal/http_server/.client",
]
sources = [
    "../../.npmrc",
    "../../package.json",
    "../../pnpm-lock.yaml",
    "../../pnpm-workspace.yaml",
    "../../packages/api-types/dist/**/*",
    "../../packages/lingua/dist/**/*",
    "package.json",
    "messages/**/*",
    "scripts/check-bundle-size.mjs",
    "../../tools/prepare-embedded-frontend.sh",
    "src/**/*",
    "!src/**/*.spec.*",
    "!src/**/*.test.*",
    "!src/**/*.stories.*",
    "!src/**/*TestHarness.svelte",
    "static/**/*",
    "svelte.config.js",
    "tsconfig.json",
    "vite.config.ts",
]
outputs = ["build/.mise-build-stamp", "../../cli/internal/http_server/.client/.gitkeep"]

[tasks.build-dev-cli]
description = "Build the development CLI application for the current architecture"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
run = "go build -trimpath -tags 'bootstrap nomsgpack' -ldflags \"-X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o bin/chatto ."
sources = [
    "go.mod",
    "go.sum",
    "**/*.go",
    "!**/*_test.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["bin/chatto"]

[tasks.build-e2e-server]
description = "Build the E2E test server binary with dev bootstrap and test endpoints enabled"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
# `bootstrap` enables the [bootstrap] section in chatto.toml, which seeds
# the e2eadmin user the harness logs in as. `test_endpoints` exposes the
# test-only HTTP endpoints (e.g. /auth/test/create-user) used by per-test
# fixtures. Deliberately scoped — the e2e binary should NOT pull in any
# future broader dev-only code that might land under a separate tag.
run = "CGO_ENABLED=0 go build -trimpath -tags 'bootstrap nomsgpack test_endpoints' -ldflags \"-s -w -X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o ../apps/frontend/e2e/fixtures/bin/chatto ."
sources = [
    "**/*.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["../apps/frontend/e2e/fixtures/bin/chatto"]

[tasks.build-compatibility-server]
description = "Build the production Chatto binary used as the current side of compatibility tests"
depends = ["setup-cli", "build-frontend"]
dir = "cli"
run = "CGO_ENABLED=0 go build -trimpath -tags nomsgpack -ldflags \"-s -w -X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o ../apps/frontend/e2e/fixtures/bin/chatto-current ."
sources = [
    "**/*.go",
    "cmd/embedded/LICENSE",
    "cmd/embedded/NOTICE",
    "internal/http_server/.client/**/*",
]
outputs = ["../apps/frontend/e2e/fixtures/bin/chatto-current"]

[tasks.storybook]
description = "Run the Storybook design-system catalog with Portless"
depends = ["setup-frontend", "build-api-types"]
dir = "apps/frontend"
tools = { node = "24", "npm:portless" = "0.15.5" }
env = {
  PORTLESS_PORT = "{{env.CHATTO_DEV_PROXY_PORT | default(value='42444')}}",
  PORTLESS_HTTPS = "1",
  PORTLESS_SYNC_HOSTS = "0",
  CHATTO_DEV_ROUTE_SUFFIX = "{{env.CONDUCTOR_WORKSPACE_NAME | default(value='local')}}",
}
run = '''
exec portless "storybook.$CHATTO_DEV_ROUTE_SUFFIX" -- \
  sh -c 'exec pnpm exec storybook dev --host "$HOST" --port "$PORT" --no-open'
'''

[tasks.dev-backend]
description = "Build and run the local development backend"
depends = ["setup-cli"]
dir = "cli"
run = "mkdir -p internal/http_server/.client && touch internal/http_server/.client/.gitkeep && go build -trimpath -tags 'bootstrap nomsgpack' -ldflags \"-X main.Version=$CHATTO_DEVELOPMENT_VERSION\" -o bin/chatto-dev . && exec ./bin/chatto-dev start"

[tasks.dev-frontend]
description = "Run the local development frontend"
depends = ["setup-frontend", "build-api-types"]
dir = "apps/frontend"
run = "exec ./node_modules/.bin/vite dev"

[tasks.desktop-dev]
description = "Run the experimental Chatto desktop app with the latest frontend build"
depends = ["build-frontend"]
dir = "apps/desktop"
run = "pnpm dev"

[tasks.dev-livekit]
description = "Run a local LiveKit server with workspace-safe ports"
env = {
  CHATTO_DEV_PORT_BASE = "{{env.CONDUCTOR_PORT | default(value='4000')}}",
  CHATTO_DEV_LIVEKIT_KEYS = "devkey: devsecret",
  CHATTO_DEV_LIVEKIT_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 5}}",
  CHATTO_DEV_LIVEKIT_RTC_TCP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 6}}",
  CHATTO_DEV_LIVEKIT_UDP_PORTS = "{{env.CHATTO_DEV_PORT_BASE | int + 7}}",
}
run = "exec mise x 'go:github.com/livekit/livekit-server/cmd/server@v1.13.5' -- server --dev --bind 127.0.0.1 --node-ip 127.0.0.1 --keys \"$CHATTO_DEV_LIVEKIT_KEYS\" --port \"$CHATTO_DEV_LIVEKIT_PORT\" --rtc.tcp_port \"$CHATTO_DEV_LIVEKIT_RTC_TCP_PORT\" --udp-port \"$CHATTO_DEV_LIVEKIT_UDP_PORTS\""

[tasks.dev-mailpit]
description = "Run a local Mailpit SMTP server with workspace-safe ports"
env = {
  CHATTO_DEV_PORT_BASE = "{{env.CONDUCTOR_PORT | default(value='4000')}}",
  CHATTO_DEV_MAILPIT_SMTP_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 8}}",
  CHATTO_DEV_MAILPIT_UI_PORT = "{{env.CHATTO_DEV_PORT_BASE | int + 9}}",
}
run = "exec mailpit --smtp \"127.0.0.1:$CHATTO_DEV_MAILPIT_SMTP_PORT\" --listen \"127.0.0.1:$CHATTO_DEV_MAILPIT_UI_PORT\""

[tasks.dev]
description = "Run the regular local development services with Portless"
depends = ["setup-frontend", "build-api-types", "build-lingua"]
env = {
  PORTLESS_PORT = "{{env.CHATTO_DEV_PROXY_PORT | default(value='42444')}}",
  PORTLESS_HTTPS = "1",
  PORTLESS_SYNC_HOSTS = "0",
  CHATTO_DEV_ROUTE_SUFFIX = "{{env.CONDUCTOR_WORKSPACE_NAME | default(value='local')}}",
}
run = '''
exec tools/dev-supervisor.sh mise run --jobs 5 --output prefix \
  dev-stack-mailpit ::: dev-stack-livekit ::: dev-stack-authling ::: \
  dev-stack-backend ::: dev-stack-frontend
'''

[tasks.dev-stack-mailpit]
hide = true
tools = { node = "24", "npm:portless" = "0.15.5" }
env = {
  CHATTO_DEV_MAILPIT_SMTP_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 8}}",
  CHATTO_DEV_MAILPIT_UI_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 9}}",
}
run = '''
set -eu
mailpit_url=$(portless get "mailpit.$CHATTO_DEV_ROUTE_SUFFIX" --no-worktree)
mailpit_url=${mailpit_url/http:/https:}
exec portless \
  "mailpit.$CHATTO_DEV_ROUTE_SUFFIX" --app-port "$CHATTO_DEV_MAILPIT_UI_PORT" -- \
  mailpit --smtp "127.0.0.1:$CHATTO_DEV_MAILPIT_SMTP_PORT" \
  --listen "127.0.0.1:$CHATTO_DEV_MAILPIT_UI_PORT" \
  --api-cors "${mailpit_url#https://}"
'''

[tasks.dev-stack-livekit]
hide = true
tools = { node = "24", "npm:portless" = "0.15.5" }
env = {
  CHATTO_DEV_BACKEND_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 1}}",
  CHATTO_DEV_LIVEKIT_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 5}}",
  CHATTO_DEV_LIVEKIT_RTC_TCP_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 6}}",
  CHATTO_DEV_LIVEKIT_UDP_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 7}}",
}
run = '''
set -eu
livekit_config=$(printf 'port: %s\nrtc:\n  tcp_port: %s\n  udp_port: %s\n  use_external_ip: false\n  enable_loopback_candidate: true\nkeys:\n  devkey: compose-only-livekit-secret-change-me\nwebhook:\n  urls:\n    - http://localhost:%s/webhooks/livekit\n  api_key: devkey\nlogging:\n  level: info\n' "$CHATTO_DEV_LIVEKIT_PORT" "$CHATTO_DEV_LIVEKIT_RTC_TCP_PORT" "$CHATTO_DEV_LIVEKIT_UDP_PORT" "$CHATTO_DEV_BACKEND_PORT")
exec portless \
  "livekit.$CHATTO_DEV_ROUTE_SUFFIX" --app-port "$CHATTO_DEV_LIVEKIT_PORT" -- \
  mise x 'go:github.com/livekit/livekit-server/cmd/server@v1.13.5' -- \
  server --bind 127.0.0.1 --node-ip 127.0.0.1 --config-body "$livekit_config"
'''

[tasks.dev-stack-authling]
hide = true
tools = { node = "24", "npm:portless" = "0.15.5" }
env = {
  AUTHLING_HTTP_BIND_ADDRESS = "127.0.0.1:{{env.CONDUCTOR_PORT | default(value='4000') | int + 2}}",
  AUTHLING_HTTP_TRUST_PROXY_HEADERS = "true",
  AUTHLING_AUTHENTICATION_PASSWORD_MINIMUM_LENGTH = "10",
  AUTHLING_NATS_REPLICAS = "1",
  AUTHLING_NATS_EMBEDDED_ENABLED = "true",
  AUTHLING_SMTP_ENABLED = "true",
  AUTHLING_SMTP_HOST = "127.0.0.1",
  AUTHLING_SMTP_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 8}}",
  AUTHLING_SMTP_TLS = "opportunistic",
  AUTHLING_SMTP_FROM = "authling@authling.local",
}
run = '''
set -eu
project_dir=$(pwd -P)
workspace_slug=${CONDUCTOR_WORKSPACE_NAME:-$(basename "$project_dir")}
chatto_url=$(portless get "chatto.$CHATTO_DEV_ROUTE_SUFFIX" --no-worktree)
authling_url=$(portless get "authling.$CHATTO_DEV_ROUTE_SUFFIX" --no-worktree)
chatto_url=${chatto_url/http:/https:}
authling_url=${authling_url/http:/https:}
chatto_host=${chatto_url#https://}
chatto_host=${chatto_host%%:*}
data_root="$project_dir/.context/dev-portless/$workspace_slug/nested/authling"
mkdir -p "$data_root/nats"
cd authling
mise build
export AUTHLING_HTTP_PUBLIC_URL="$authling_url"
export AUTHLING_NATS_EMBEDDED_DATA_DIR="$data_root/nats"
export AUTHLING_OIDC_CIMD_TRUSTED_LOOPBACK_HOSTS="$chatto_host"
exec portless \
  "authling.$CHATTO_DEV_ROUTE_SUFFIX" \
  --app-port "${AUTHLING_HTTP_BIND_ADDRESS##*:}" -- bin/authling run
'''

[tasks.dev-stack-backend]
hide = true
tools = { node = "24", "npm:portless" = "0.15.5" }
env = {
  CHATTO_WEBSERVER_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 1}}",
  CHATTO_NATS_EMBEDDED_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 4}}",
  CHATTO_SMTP_PORT = "{{env.CONDUCTOR_PORT | default(value='4000') | int + 8}}",
  CHATTO_LOG_LEVEL = "debug",
  CHATTO_LOG_FORMAT = "text",
  CHATTO_WEBSERVER_COOKIE_SIGNING_SECRET = "871a846584490a6153305533cce100b8e6f39d4184c2fb499d2ed198a9ed37a3",
  CHATTO_WEBSERVER_COOKIE_ENCRYPTION_SECRET = "a3955a342ba4cb4ffb457a1177295779fbbb73f8e22cd4f68ecb9fb584afcf66",
  CHATTO_METRICS_ENABLED = "false",
  CHATTO_EXPORTER_ENABLED = "false",
  CHATTO_OPERATOR_API_ENABLED = "false",
  CHATTO_SEARCH_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_ENABLED = "true",
  CHATTO_SEARCH_PROVIDER_LANGUAGES = "de,en",
  CHATTO_CORE_SECRET_KEY = "2ff88b0e8ceb09c399193d1b9339577e6b0fac883777176231e84f92aa78f794",
  CHATTO_CORE_PROJECTION_SNAPSHOTS = "true",
  CHATTO_CORE_ASSETS_SIGNING_SECRET = "2e5cac66f8ea81759952186886d233410c1e6e18e3048bc680792935206240e0",
  CHATTO_CORE_ASSETS_MAX_UPLOAD_SIZE = "25MB",
  CHATTO_CORE_ASSETS_CACHE_ENABLED = "true",
  CHATTO_CORE_ASSETS_CACHE_TTL = "7d",
  CHATTO_AUTH_ACCOUNT_CREATION_POLICY = "open",
