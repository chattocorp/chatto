# Copy this file to botto.toml. Keep credentials in .env or the environment.
# String settings support ${VARIABLE}, for example url = "${CHATTO_URL}".
# Use $${VARIABLE} for literal text. Numeric settings must remain TOML integers.
[chatto]
api_key = "${BOTTO_CHATTO_API_KEY}"
url = "https://chat.example.com"
# Enable every tool advertised by this server's /mcp endpoint, including writes.
mcp = false
# Show the bot account as online while Botto runs.
report_presence = true
# Messages that address Botto. Also possible: "role_mention", "here_mention",
# "all_mention".
respond_to = ["direct_message", "mention", "reply"]
# allowed_user_id = "one-user-id"
# Only these stable Chatto user IDs may request changes to Botto's overall behavior.
# Empty by default. allowed_user_id does not grant admin authority.
admin_user_ids = []

[participation]
# OpenRouter chat model; uses low reasoning and requires OPENROUTER_API_KEY.
model = "z-ai/glm-5.3-flash"

[agent]
name = "Botto"
model = "anthropic/claude-sonnet-4-6"
# Optional: off, minimal, low, medium, high, xhigh, max.
# Explicit values override saved sessions. Pi adapts unsupported levels to the model.
# reasoning_level = "low"
# Additional identity, personality, and workflow instructions for this bot.
# Botto supplies its own role and tool instructions to main agents and subagents.
system_prompt = """
You are a helpful assistant. Be friendly, clear, and concise.
"""

[titles]
# Optional independent model for short run titles. Defaults to agent.model.
# Choose a small model from a provider whose credentials are configured.
# model = "provider/small-model"
reasoning_level = "off"

[memory]
# Requires the means executable. Relative paths use this TOML file's directory.
enabled = false
command = "means"
path = "memory"

[web]
# Search the web and fetch pages through Exa's hosted MCP server. Exa receives
# the queries and URLs. Without a key, Exa applies low per-IP rate limits.
enabled = false
# exa_api_key = "${EXA_API_KEY}"

[runtime]
# React to the message that starts a new conversation. An empty string disables this.
acknowledgement_emoji = "eyes"
data_directory = ".botto"
# Quiet periods after the latest message or typing signal; minimum 2000ms.
debounce_ms = 2000
passive_debounce_ms = 5000
turn_timeout_ms = 900000
context_messages = 30
max_pending_messages = 100
max_threads = 8
