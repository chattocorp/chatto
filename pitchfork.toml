[daemons.chatto]
dir = "apps/frontend"
run = """
port_base=$(cat ../../.context/dev/port-base)
backend_port=$((port_base + 1))
mise setup-frontend
export VITE_PORT="$port_base"
export CHATTO_BACKEND_URL="http://127.0.0.1:$backend_port"
exec ./node_modules/.bin/vite dev --host 127.0.0.1
"""
ready_output = "Local:"
depends = ["chatto-backend"]
auto = ["stop"]
watch = [
  "package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "apps/frontend/package.json",
  "packages/api-types/package.json",
  "packages/lingua/package.json",
]

[groups.dev]
daemons = ["chatto"]
