# Sweet repository configuration.
# The sections appear in this order. The generated release pages show all of
# them. The in-app help shows only Highlights.
types:
  # A short, user-facing summary of a notable change, in one or two sentences.
  # Write it in addition to the feature or fix note of the same change. That
  # note sets the version bump.
  highlight:
    bump: none
    section: Highlights
  upgrade:
    bump: none
    section: Upgrade notes
  breaking:
    bump: minor
    section: Breaking changes
  feature:
    bump: minor
    section: Features
  fix:
    bump: patch
    section: Fixes
  performance:
    bump: patch
    section: Performance
  # Small visible changes that most readers can skip: spacing, colours, wording.
  polish:
    bump: patch
    section: Polish
  chore:
    bump: none
