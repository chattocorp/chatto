setup: mise setup
# Each task listens on named ports of its own. The `chatto` task uses its port
# and the spare workspace ports from GEORDI_PORT, with the offsets of the
# `[env]` section of mise.toml.
#
# The "Chatto (Full)" and "Full stack" tasks run the services of
# `mise dev-full` one by one.
# tools/geordi-dev-stack.sh gives every one of them the named ports of all the
# others, so each service can be started, stopped, and restarted alone.
# The chatto and full-stack Chatto tasks use the same NATS port and data
# directory, so only one of them runs at a time.
tasks:
  chatto:
    label: Chatto
    command: CHATTO_DEV_CHATTO_PORT_OVERRIDE=$PORT CHATTO_DEV_CHATTO_URL_OVERRIDE=http://localhost:$PORT mise dev
    ports: [chatto]
    url: http://localhost:{chatto}/
    default: true
  chatto-full:
    label: Chatto (Full)
    command: tools/geordi-dev-stack.sh dev-stack-chatto
    ports: [chatto-full]
    needs: [mailpit, livekit, authling]
    url: http://localhost:{chatto-full}/
  mailpit:
    label: Full stack / Mailpit
    command: tools/geordi-dev-stack.sh dev-stack-mailpit
    ports: [mailpit, smtp]
    url: http://localhost:{mailpit}/
  livekit:
    label: Full stack / LiveKit
    command: tools/geordi-dev-stack.sh dev-stack-livekit
    ports: [livekit, livekit-rtc]
  authling:
    label: Full stack / Authling
    command: tools/geordi-dev-stack.sh dev-stack-authling
    ports: [authling]
    needs: [mailpit]
  runling-bot:
    label: Full stack / Runling bot
    command: tools/geordi-dev-stack.sh dev-stack-runling-bot
    ports: [runling]
    needs: [chatto-full]
    url: http://localhost:{runling}/
  docs:
    label: Docs website
    command: mise dev-docs-website -- --port "$PORT"
    ports: [docs]
    url: http://localhost:{docs}/

sections:
  - path: cli
    title: Chatto server and CLI
  - path: proto
    title: Chatto protocols
  - path: packages/api-types
    title: Chatto API types
  - path: packages/chatto-client
    title: Chatto client SDK
  - path: apps/frontend
    title: Chatto web app
  - path: apps/desktop
    title: Chatto Desktop
  - path: apps/mobile
    title: Chatto Mobile
  - path: packages/chattobot
    title: ChattoBot
  - path: authling
    title: Authling
  - path: packages/runling
    title: Runling
  - path: packages/translatto
    title: Translatto
  - path: pkg
    title: Shared Go modules
  - path: docs
    title: Architecture and project docs
  - path: apps/docs-website
    title: Documentation website
