syntax = "proto3";

package chatto.api.v1;

import "google/protobuf/timestamp.proto";

// A newly issued single-use code. Unlike the administrative resource, this
// result is available only at creation; members cannot retrieve it later.
message IssuedInvitationCode {
  // Opaque invitation identifier, also visible in administrative records.
  string id = 1;
  // Share this secret with the recipient. Never log or persist it in client storage.
  string code = 2;
  // The code expires seven days after creation.
  google.protobuf.Timestamp expires_at = 3;
}

// Creates one invitation for the authenticated caller. No recipient is bound to it.
message CreateInvitationCodeRequest {}

// The code is returned only by this creation operation.
message CreateInvitationCodeResponse {
  IssuedInvitationCode invitation_code = 1;
}

// Member issuance only. Listing, retrieval, and revocation require the separate
// administrative service and user.manage-invites permission.
service InvitationCodeService {
  // Requires user.invite, without privileged mode. Creates one code with a
  // seven-day expiry. Not idempotent: retrying creates another code. A code is
  // consumed only when account creation succeeds; open registration does not
  // require or consume codes. Copy the result before dismissing it.
  rpc CreateInvitationCode(CreateInvitationCodeRequest) returns (CreateInvitationCodeResponse);
}
