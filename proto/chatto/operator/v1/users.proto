syntax = "proto3";

package chatto.operator.v1;

import "buf/validate/validate.proto";
import "chatto/admin/v1/members.proto";
import "chatto/admin/v1/roles.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/roles.proto";
import "chatto/api/v1/users.proto";

// Request to create a user as a local operator action.
message CreateUserRequest {
  // Required login for the new user.
  string login = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Optional display name. Defaults to login when empty.
  string display_name = 2 [(buf.validate.field).string.max_len = 80];
  // Optional password. When present, it must satisfy server password policy.
  string password = 3 [(buf.validate.field).string.max_len = 128];
  // Optional email to add as already verified.
  string verified_email = 4 [(buf.validate.field).string.max_len = 320];
  // Optional explicit roles to assign after creation.
  repeated string role_names = 5 [(buf.validate.field).repeated.max_items = 20];
}

// Result of creating a user.
message CreateUserResponse {
  // Created member row.
  chatto.admin.v1.AdminMember member = 1;
}

// Request operator-visible user rows.
message ListUsersRequest {
  // Case-insensitive login/display-name search term. Empty disables search.
  string search = 1;
  // Page request. Defaults to 20 results when absent or limit is zero.
  chatto.api.v1.PageRequest page = 2;
}

// Operator-visible user rows plus role summaries.
message ListUsersResponse {
  // Matching users.
  repeated chatto.admin.v1.AdminMember users = 1;
  // Roles for display-name lookup.
  repeated chatto.api.v1.Role roles = 2;
  // Page metadata.
  chatto.api.v1.PageInfo page = 3;
}

// Request one operator-visible user detail record.
message GetUserRequest {
  // Target user ID.
  string user_id = 1;
  // Target login. Provide exactly one lookup field.
  string login = 2;
  // Target verified email address. Provide exactly one lookup field.
  string email = 3;
}

// Operator-visible user detail payload.
message GetUserResponse {
  // Member record.
  chatto.admin.v1.AdminMember member = 1;
  // Roles for assignment.
  repeated chatto.admin.v1.AdminRole roles = 2;
  // Permissions available for per-user overrides.
  repeated string available_permissions = 3;
}

// Request to assign a role to a user.
message AssignRoleRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Role name to assign.
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of assigning a role.
message AssignRoleResponse {
  reserved 1;
  reserved "assigned";

  // Updated member row.
  chatto.admin.v1.AdminMember member = 2;
}

// Request to revoke a role from a user.
message RevokeRoleRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Role name to revoke.
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of revoking a role.
message RevokeRoleResponse {
  reserved 1;
  reserved "revoked";

  // Updated member row.
  chatto.admin.v1.AdminMember member = 2;
}

// Request to update a user's identity as an operator action.
message UpdateUserRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // New display name, when changing it.
  optional string display_name = 2;
  // New login identifier, when changing it.
  optional string login = 3;
}

// Result of an operator user update.
message UpdateUserResponse {
  // Updated user profile.
  chatto.api.v1.User user = 1;
  // Updated member row.
  chatto.admin.v1.AdminMember member = 2;
}

// Request to set a user's password as an operator action.
message SetUserPasswordRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // New password.
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

// Result of setting a user's password.
message SetUserPasswordResponse {
  // Updated member row.
  chatto.admin.v1.AdminMember member = 1;
}

// Request to permanently delete a user account.
message DeleteUserRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of deleting a user account.
message DeleteUserResponse {
  // True when the account was deleted.
  bool deleted = 1;
}

// Request to add a verified email address to a user.
message AddVerifiedEmailRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Email address to mark as verified.
  string email = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 320
  }];
}

// Result of adding a verified email address.
message AddVerifiedEmailResponse {
  // Updated member row.
  chatto.admin.v1.AdminMember member = 1;
}

// Request to clear a user's self-service username-change cooldown.
message ClearUsernameCooldownRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of clearing a user's username-change cooldown.
message ClearUsernameCooldownResponse {
  // True when the request completed.
  bool cleared = 1;
}

// Root-only external identity detail. Unlike public account responses, this
// record exposes the issuer and raw subject for explicit operator recovery.
message UserExternalIdentity {
  // Event-time provider ID. The provider can since have changed or been removed.
  string provider_id = 1;
  // Event-time provider type.
  string provider_type = 2;
  // Exact OIDC issuer URL or OAuth-only provider namespace.
  string issuer = 3;
  // Exact provider subject. Empty for historical hash-only links.
  string subject = 4;
  // Stable identity hash used to select a link for removal.
  string subject_hash = 5;
  // True when a currently configured provider accepts this identity namespace.
  // This does not test provider reachability or the provider account's status.
  bool login_available = 6;
}

// Lists all stored links for one existing human account, including stale links.
message ListUserExternalIdentitiesRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Current links, ordered by provider ID and stable identity hash.
message ListUserExternalIdentitiesResponse {
  repeated UserExternalIdentity identities = 1;
}

// Links an operator-verified identity to an existing human account. The operator
// must verify that the subject belongs to this user. No provider login occurs.
message LinkUserExternalIdentityRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Configured provider. Its current type and issuer determine the namespace.
  string provider_id = 2 [(buf.validate.field).string.min_len = 1];
  // Exact subject issued by that provider. It is not an email lookup.
  string subject = 3 [(buf.validate.field).string.min_len = 1];
}

// The linked identity. An existing link to the same user succeeds without a new write.
message LinkUserExternalIdentityResponse {
  UserExternalIdentity identity = 1;
}

// Removes one stored link. Another configured identity or an enabled password
// sign-in method must remain. Existing sessions remain valid.
message UnlinkUserExternalIdentityRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Identity hash returned by ListUserExternalIdentities.
  string subject_hash = 2 [(buf.validate.field).string.min_len = 1];
}

// Successful removal. A missing user or link returns NOT_FOUND.
message UnlinkUserExternalIdentityResponse {}

// Root-equivalent local operator user commands.
service OperatorUserService {
  // Creates a user as a local operator.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Lists users for operator inspection.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Gets one user plus role/permission metadata for operator inspection.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Assigns a role to a user.
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  // Revokes a role from a user.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // Updates a user's login and/or display name as an operator action.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Sets a user's password as a local operator.
  rpc SetUserPassword(SetUserPasswordRequest) returns (SetUserPasswordResponse);
  // Permanently deletes a user account.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Adds an already-verified email address to a user.
  rpc AddVerifiedEmail(AddVerifiedEmailRequest) returns (AddVerifiedEmailResponse);
  // Clears a user's self-service username-change cooldown.
  rpc ClearUsernameCooldown(ClearUsernameCooldownRequest) returns (ClearUsernameCooldownResponse);
  // Lists all external identities for a human account, including stale links.
  rpc ListUserExternalIdentities(ListUserExternalIdentitiesRequest) returns (ListUserExternalIdentitiesResponse);
  // Links an operator-verified subject through a configured provider. Conflicts
  // with another account's identity return ALREADY_EXISTS; ownership never moves.
  rpc LinkUserExternalIdentity(LinkUserExternalIdentityRequest) returns (LinkUserExternalIdentityResponse);
  // Removes a link, or returns FAILED_PRECONDITION for the last configured method.
  rpc UnlinkUserExternalIdentity(UnlinkUserExternalIdentityRequest) returns (UnlinkUserExternalIdentityResponse);
}
