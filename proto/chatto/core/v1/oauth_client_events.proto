syntax = "proto3";

package chatto.core.v1;

option go_package = "hmans.de/chatto/internal/pb/chatto/core/v1;corev1";

// How a public OAuth client establishes its identity with this server.
enum OAuthClientSource {
  OAUTH_CLIENT_SOURCE_UNSPECIFIED = 0;
  OAUTH_CLIENT_SOURCE_CIMD = 1;
  OAUTH_CLIENT_SOURCE_BUILT_IN = 2;
}

// Administrator policy for a public OAuth client.
enum OAuthClientPolicy {
  OAUTH_CLIENT_POLICY_UNSPECIFIED = 0;
  OAUTH_CLIENT_POLICY_DEFAULT = 1;
  OAUTH_CLIENT_POLICY_TRUSTED = 2;
  OAUTH_CLIENT_POLICY_BLOCKED = 3;
}

// OAuthClientAuthorizationRecordedEvent records one successful user
// authorization. Metadata retrieval by itself never creates durable state.
message OAuthClientAuthorizationRecordedEvent {
  string client_id = 1;
  string client_name = 2;
  string client_uri = 3;
  string redirect_origin = 4;
  OAuthClientSource source = 5;
}

// OAuthClientPolicyChangedEvent records an administrator policy decision.
message OAuthClientPolicyChangedEvent {
  string client_id = 1;
  OAuthClientPolicy policy = 2;
}
