syntax = "proto3";

package chatto.core.evt.v1;

option go_package = "github.com/chattocorp/chatto/cli/internal/pb/chatto/core/evt/v1;evtv1";

// ============================================================================
// DURABLE RBAC EVENTS (evt.rbac.>)
//
// Top-level Event oneof tags owned by this file:
//   - 800-813: durable RBAC role, assignment, and permission events
//
// Keep these tags coordinated with event.proto. Message-internal field numbers
// are local to each message and do not consume top-level Event tag space.
// ============================================================================

message RbacRoleCreatedEvent {
  string role_name = 1;
  string display_name = 2;
  string description = 3;
  int32 rank = 4;
  bool pingable = 5;
}

message RbacRoleDisplayNameChangedEvent {
  string role_name = 1;
  string display_name = 2;
}

message RbacRoleDescriptionChangedEvent {
  string role_name = 1;
  string description = 2;
}

message RbacRolePingableChangedEvent {
  string role_name = 1;
  bool pingable = 2;
}

message RbacRoleDeletedEvent {
  string role_name = 1;
}

message RbacRolesReorderedEvent {
  repeated string role_names = 1;
}

message RbacRoleAssignedEvent {
  string user_id = 1;
  string role_name = 2;
  // Why the role was assigned. Absent for admin assignments and for events
  // from older server versions.
  RbacRoleChangeReason reason = 3;
}

message RbacRoleRevokedEvent {
  string user_id = 1;
  string role_name = 2;
  // Why the role was revoked. Absent for admin revocations and for events
  // from older server versions.
  RbacRoleChangeReason reason = 3;
}

// RbacRoleChangeReason records an automatic cause of a role assignment or
// revocation. Each kind carries only its own data.
message RbacRoleChangeReason {
  oneof reason {
    RbacProviderGroupsReason provider_groups = 1;
    RbacConfiguredOwnerReason configured_owner = 2;
  }
}

// RbacProviderGroupsReason means that the group_roles mapping of an external
// login provider caused the change. The provider owns an assignment that it
// created and can later revoke it.
message RbacProviderGroupsReason {
  // Configured auth provider ID.
  string provider_id = 1;
}

// RbacConfiguredOwnerReason means that owners.emails in the server
// configuration caused an owner assignment.
message RbacConfiguredOwnerReason {}

enum RbacPermissionScopeKind {
  RBAC_PERMISSION_SCOPE_KIND_UNSPECIFIED = 0;
  RBAC_PERMISSION_SCOPE_KIND_SERVER = 1;
  RBAC_PERMISSION_SCOPE_KIND_GROUP = 2;
  RBAC_PERMISSION_SCOPE_KIND_ROOM = 3;
  RBAC_PERMISSION_SCOPE_KIND_DM = 4;
}

message RbacPermissionScope {
  RbacPermissionScopeKind kind = 1;

  // Empty for server and direct-message decisions. For group and room scope,
  // this is the target group ID or room ID.
  string id = 2;
}

enum RbacPermissionSubjectKind {
  RBAC_PERMISSION_SUBJECT_KIND_UNSPECIFIED = 0;
  RBAC_PERMISSION_SUBJECT_KIND_ROLE = 1;
  RBAC_PERMISSION_SUBJECT_KIND_USER = 2;
}

message RbacPermissionSubject {
  RbacPermissionSubjectKind kind = 1;

  // Role name for ROLE subjects; user ID for USER subjects.
  string id = 2;
}

message RbacPermissionGrantedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}

message RbacPermissionDeniedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}

// Removes any explicit allow or deny, returning this permission to inherited/no-decision state.
message RbacPermissionClearedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}
