name: recheck public API waiver

on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write

concurrency:
  group: proto-label-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  recheck:
    if: github.event.label.name == 'api-breaking-change'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # This privileged workflow must never load code from the PR revision.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { rerunProto } = await import(`${process.env.GITHUB_WORKSPACE}/tools/ci/rerun-proto.mjs`);
            await rerunProto({ github, context, core });
