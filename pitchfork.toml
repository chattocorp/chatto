  CHATTO_BOOTSTRAP_USERS_0_LOGIN = "alice",
  CHATTO_BOOTSTRAP_USERS_0_DISPLAY_NAME = "Alice",
  CHATTO_BOOTSTRAP_USERS_0_EMAIL = "alice@example.com",
  CHATTO_BOOTSTRAP_USERS_0_PASSWORD = "foobar123",
  CHATTO_BOOTSTRAP_USERS_0_SERVER_ROLE = "owner",
  CHATTO_BOOTSTRAP_USERS_1_LOGIN = "bob",
  CHATTO_BOOTSTRAP_USERS_1_DISPLAY_NAME = "Bob",
  CHATTO_BOOTSTRAP_USERS_1_EMAIL = "bob@example.com",
  CHATTO_BOOTSTRAP_USERS_1_PASSWORD = "foobar123",
  CHATTO_BOOTSTRAP_SERVER_NAME = "Chatto + Authling",
