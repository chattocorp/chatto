syntax = "proto3";

package chatto.core.projection.v1;

import "google/protobuf/timestamp.proto";
import "chatto/core/evt/v1/asset_events.proto";
import "chatto/core/evt/v1/event.proto";
import "chatto/core/evt/v1/event_values.proto";
import "chatto/core/evt/v1/notification_policy.proto";
import "chatto/core/notification/v1/notification.proto";
import "chatto/core/evt/v1/rbac_events.proto";
import "chatto/core/evt/v1/room_events.proto";
import "chatto/core/evt/v1/user_events.proto";
import "chatto/core/evt/v1/user_preferences.proto";

option go_package = "github.com/chattocorp/chatto/cli/internal/pb/chatto/core/projection/v1;projectionv1";

// ProjectionSnapshotGeneration is the encrypted, immutable unit published by
// the projection snapshot repository. It is derived cache data,
// not an authoritative domain record.
message ProjectionSnapshotGeneration {
  string generation_id = 1;
  string stream_name = 2;
  uint64 cutoff_sequence = 3;
  string projection_key = 4;
  // Snapshot contract ID. The field name is retained for wire compatibility.
  string compatibility_id = 5;
  string producer_version = 6;
  google.protobuf.Timestamp created_at = 7;
  bytes payload = 8;
  uint64 payload_size = 9;
  bytes payload_sha256 = 10;
  // Versioned identity of the EVT stream incarnation.
  string stream_identity = 11;
}

// ProjectionSnapshotPointer names the two most recently published immutable
// generations for one projection. It is encrypted and may safely be stale.
message ProjectionSnapshotPointer {
  string current_generation_id = 1;
  string previous_generation_id = 2;
  uint64 current_cutoff_sequence = 3;
  string current_stream_identity = 4;
  // Current generation's snapshot contract ID.
  string current_compatibility_id = 5;
  uint64 previous_cutoff_sequence = 6;
  string previous_stream_identity = 7;
  // Previous generation's snapshot contract ID.
  string previous_compatibility_id = 8;
  // Authenticated publication times used to coordinate refreshes across replicas.
  google.protobuf.Timestamp current_created_at = 9;
  google.protobuf.Timestamp previous_created_at = 10;
}

// ProjectionSnapshotCohortManifest binds independently stored component parts
// to one projection generation and one event-stream cutoff.
message ProjectionSnapshotCohortManifest {
  repeated ProjectionSnapshotCohortComponent components = 1;
}

// ProjectionSnapshotCohortComponent identifies the stored parts for one
// focused model in a componentized projection.
message ProjectionSnapshotCohortComponent {
  string component_key = 1;
  string contract_id = 2;
  repeated ProjectionSnapshotCohortPart parts = 3;
}

// ProjectionSnapshotCohortPart binds one stable component-local part key to
// its immutable stored generation.
message ProjectionSnapshotCohortPart {
  string part_key = 1;
  string generation_id = 2;
}

// ThreadProjectionSnapshot is the canonical restorable state for the
// Threads projection snapshot contract. Repeated fields are emitted in
// deterministic key order by the codec.
message ThreadProjectionSnapshot {
  repeated ThreadSnapshot threads = 1;
  repeated ThreadReplySnapshot replies = 2;
  repeated ThreadFollowSnapshot follows = 3;
  repeated string shredded_user_ids = 4;
  ProjectionReplayGuardSnapshot replay_guard = 5;
  repeated string channel_room_ids = 6;
  repeated ThreadMessageSnapshot messages = 7;
  repeated ThreadInteractionSnapshot interactions = 8;
  // DM membership at the snapshot position determines recipients of later posts.
  repeated RoomMembershipSnapshot direct_message_rooms = 9;
}

message ThreadSnapshot {
  string root_event_id = 1;
  repeated ThreadTimelineEntrySnapshot entries = 2;
}

message ThreadTimelineEntrySnapshot {
  string event_id = 1;
  uint64 stream_sequence = 2;
}

message ThreadReplySnapshot {
  string event_id = 1;
  string thread_root_event_id = 2;
  string actor_id = 3;
  google.protobuf.Timestamp created_at = 4;
  bool retracted = 5;
}

message ThreadFollowSnapshot {
  string user_id = 1;
  string room_id = 2;
  string thread_root_event_id = 3;
  string state = 4;
}

message ThreadMessageSnapshot {
  string event_id = 1;
  string room_id = 2;
  string thread_root_event_id = 3;
}

// One account-to-thread relationship. Relationships are durable post-time
// facts; the projection retains only their existence.
message ThreadInteractionSnapshot {
  string user_id = 1;
  string room_id = 2;
  string thread_root_event_id = 3;
}

message ProjectionReplayGuardSnapshot {
  uint64 highest_sequence = 1;
  bool compatibility_mode = 2;
  repeated string event_ids = 3;
  bool replay_complete = 4;
}

message RoomDirectoryProjectionSnapshot {
  repeated RoomSnapshot rooms = 1;
  repeated RoomMembershipSnapshot memberships = 2;
  repeated RoomBanSnapshot bans = 3;
  uint64 catalog_sequence = 4;
}

message RoomMembershipSnapshot {
  string room_id = 1;
  repeated string user_ids = 2;
}

message RoomBanSnapshot {
  string event_id = 1;
  string room_id = 2;
  string user_id = 3;
  string moderator_id = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message RoomGroupLayoutProjectionSnapshot {
  repeated RoomGroupStateSnapshot groups = 1;
  repeated string group_ids = 2;
  uint64 sequence = 3;
}

message RoomGroupStateSnapshot {
  RoomGroupSnapshot group = 1;
}

// NotificationDecisionProjectionSnapshot combines the exact event-time
// state needed to derive notifications and enforce persistent visibility
// boundaries.
message NotificationDecisionProjectionSnapshot {
  RoomDirectoryProjectionSnapshot room_directory = 1;
  RoomGroupLayoutProjectionSnapshot room_group_layout = 2;
  RBACProjectionSnapshot rbac = 3;
  ConfigProjectionSnapshot config = 4;
  repeated string active_user_ids = 5;
  repeated ThreadFollowSnapshot thread_follows = 6;
  repeated NotificationThreadStateSnapshot threads = 7;
  NotificationBadgeSourcesSnapshot badge_sources = 8;
}

// Badge source index of the notification decision projection. Room root and
// reply lists are rebuilt from the messages, which are in stream order.
message NotificationBadgeSourcesSnapshot {
  repeated NotificationBadgeMessageSnapshot messages = 1;
  // Targeted sources, grouped by room, user, and scope, in stream order
  // within each group.
  repeated NotificationBadgeTargetSnapshot targets = 2;
  repeated NotificationBadgeSinceSnapshot memberships = 3;
  // Account creation sequences; room_id is empty.
  repeated NotificationBadgeSinceSnapshot accounts = 4;
  // Universal-room start sequences; user_id is empty.
  repeated NotificationBadgeSinceSnapshot universal_rooms = 5;
  repeated NotificationBadgeFollowSnapshot follows = 6;
  // Creation time of the newest indexed source. Sources that are older than
  // the notification lifetime relative to it are left out.
  int64 latest_created_at_unix_nanos = 7;
}

message NotificationBadgeMessageSnapshot {
  string event_id = 1;
  string room_id = 2;
  string thread_root_event_id = 3;
  string actor_id = 4;
  string author_id = 5;
  uint64 sequence = 6;
  int64 created_at_unix_nanos = 7;
  bool retracted = 8;
  // False for echoes and historical imports.
  bool source = 9;
}

message NotificationBadgeTargetSnapshot {
  string user_id = 1;
  string room_id = 2;
  string message_event_id = 3;
  uint32 kind = 4;
  uint64 sequence = 5;
  int64 created_at_unix_nanos = 6;
  string reactor_id = 7;
  string emoji = 8;
}

message NotificationBadgeSinceSnapshot {
  string user_id = 1;
  string room_id = 2;
  uint64 sequence = 3;
}

message NotificationBadgeFollowSnapshot {
  string user_id = 1;
  string room_id = 2;
  string thread_root_event_id = 3;
  uint64 sequence = 4;
}

message NotificationThreadStateSnapshot {
  string thread_root_event_id = 1;
  uint64 reply_count = 2;
}

message CallStateProjectionSnapshot {
  repeated CallRoomStateSnapshot rooms = 1;
}

message CallRoomStateSnapshot {
  string room_id = 1;
  uint64 sequence = 2;
  CallSessionSnapshot call = 3;
  repeated CallParticipantSnapshot participants = 4;
}

message CallSessionSnapshot {
  string call_id = 1;
  string e2ee_key_ref = 2;
  int64 started_at = 3;
  chatto.core.evt.v1.CallParticipantEventSource source = 4;
}

message CallParticipantSnapshot {
  string user_id = 1;
  string call_id = 2;
  int64 joined_at = 3;
  chatto.core.evt.v1.CallParticipantEventSource source = 4;
}

message ContentKeyProjectionSnapshot {
  repeated chatto.core.evt.v1.UserDEKGeneratedEvent keys = 1;
  ProjectionReplayGuardSnapshot replay_guard = 2;
  repeated string shredded_user_ids = 3;
}

message RBACProjectionSnapshot {
  repeated RoleSnapshot roles = 1;
  repeated RBACAssignmentSnapshot assignments = 2;
  repeated RBACDecisionSnapshot decisions = 3;
  ProjectionReplayGuardSnapshot replay_guard = 4;
}

message RBACAssignmentSnapshot {
  string user_id = 1;
  repeated string role_names = 2;
  // Assignments that an external login provider owns, by role name.
  repeated RBACProviderAssignmentSnapshot provider_assignments = 3;
}

message RBACProviderAssignmentSnapshot {
  string role_name = 1;
  // Identity issuer of the owning provider.
  string issuer = 2;
}

message RBACDecisionSnapshot {
  string scope = 1;
  string scope_id = 2;
  chatto.core.evt.v1.RbacPermissionSubjectKind subject_kind = 3;
  string subject = 4;
  string permission = 5;
  string decision = 6;
}

message ConfigProjectionSnapshot {
  string server_name = 1;
  string description = 2;
  string welcome_message = 3;
  string motd = 4;
  optional string blocked_usernames = 5;
  chatto.core.evt.v1.AssetRecord logo = 6;
  chatto.core.evt.v1.AssetRecord banner = 7;
  repeated UserConfigSnapshot users = 8;
  repeated ServerNeighborSnapshot neighbors = 9;
}

// Restorable state for one advertised server in the Neighbor directory.
message ServerNeighborSnapshot {
  string id = 1;
  string origin = 2;
  string revision = 3;
  // Legacy testimonial retained only to decode old snapshot generations.
  // Current code ignores this field and never writes it.
  string testimonial = 4 [deprecated = true];
}

message UserConfigSnapshot {
  string user_id = 1;
  optional string timezone = 2;
  optional chatto.core.evt.v1.TimeFormat time_format = 3;
  chatto.core.evt.v1.NotificationDeliveryModes server_notification_modes = 4;
  repeated RoomNotificationModesSnapshot room_notification_modes = 5;
  repeated RoomGroupNotificationModesSnapshot room_group_notification_modes = 6;
  bool share_timezone = 7;
}

message RoomNotificationModesSnapshot {
  string room_id = 1;
  chatto.core.evt.v1.NotificationDeliveryModes modes = 2;
}

message RoomGroupNotificationModesSnapshot {
  string room_group_id = 1;
  chatto.core.evt.v1.NotificationDeliveryModes modes = 2;
}

message NotificationProjectionSnapshot {
  repeated chatto.core.notification.v1.NotificationOccurrence notifications = 1;
  repeated NotificationProjectionTombstone tombstones = 2;
}

message NotificationProjectionTombstone {
  string notification_id = 1;
  string recipient_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint64 signal_stream_sequence = 4;
}

message AssetProjectionSnapshot {
  repeated chatto.core.evt.v1.AssetCreatedEvent creations = 1;
  repeated AssetChildrenSnapshot children = 2;
  repeated AssetManifestSnapshot manifests = 3;
  repeated DeletedAssetSnapshot deleted_assets = 4;
  ProjectionReplayGuardSnapshot replay_guard = 5;
  repeated AssetMessageOwnerSnapshot message_owners = 6;
  repeated string public_link_preview_asset_ids = 7;
}

message AssetChildrenSnapshot {
  string parent_asset_id = 1;
  repeated string child_asset_ids = 2;
}

message AssetManifestSnapshot {
  string asset_id = 1;
  chatto.core.evt.v1.AssetProcessingStartedEvent started = 2;
  chatto.core.evt.v1.AssetProcessingSucceededEvent succeeded = 3;
  chatto.core.evt.v1.AssetProcessingFailedEvent failed = 4;
}

message DeletedAssetSnapshot {
  string asset_id = 1;
  string room_id = 2;
}

message ReactionProjectionSnapshot {
  repeated MessageReactionsSnapshot messages = 1;
  repeated StringUint64Snapshot room_sequences = 2;
  repeated StringStringSnapshot message_rooms = 3;
  repeated StringStringSnapshot echo_originals = 4;
  repeated StringStringSnapshot asset_rooms = 5;
  ProjectionReplayGuardSnapshot replay_guard = 6;
}

message MessageReactionsSnapshot {
  string message_event_id = 1;
  repeated EmojiReactionsSnapshot emojis = 2;
}

message EmojiReactionsSnapshot {
  string emoji = 1;
  repeated UserReactionSnapshot users = 2;
}

message UserReactionSnapshot {
  string user_id = 1;
  int64 added_at_nanos = 2;
  string source_event_id = 3;
}

message StringUint64Snapshot { string key = 1; uint64 value = 2; }
message StringStringSnapshot { string key = 1; string value = 2; }

message MentionablesProjectionSnapshot {
  repeated chatto.core.evt.v1.Event user_login_sources = 1;
  repeated chatto.core.evt.v1.UserDEKGeneratedEvent keys = 2;
  repeated string role_names = 3;
}

// UserProfileProjectionSnapshot contains only profile/read-model state. Auth
// credentials, external identity subjects, and OAuth consent are owned by the
// separate cold-replay UserAuthProjection and have no fields in this schema.
message UserProfileProjectionSnapshot {
  repeated ProjectedUserProfileSnapshot users = 1;
  repeated chatto.core.evt.v1.UserDEKGeneratedEvent keys = 2;
  ProjectionReplayGuardSnapshot replay_guard = 3;
  repeated StringStringSnapshot login_index = 4;
  repeated StringStringSnapshot email_index = 5;
}

message ProjectedUserProfileSnapshot {
  string user_id = 1;
  UserSnapshot user = 2;
  ProjectedEncryptedUserStringSnapshot login = 3;
  string login_hash = 4;
  ProjectedEncryptedUserStringSnapshot display_name = 5;
  bool deleted = 6;
  bool shredded = 7;
  chatto.core.evt.v1.AssetRecord avatar = 8;
  repeated ProjectedVerifiedEmailSnapshot verified_emails = 9;
  chatto.core.evt.v1.ServerUserPreferences preferences = 10;
  google.protobuf.Timestamp login_changed_at = 11;
  ProjectedEncryptedUserStringSnapshot bio = 12;
  // Event ID of the verified email selected for account-directed email.
  string primary_verified_email_event_id = 13;
}

message ProjectedEncryptedUserStringSnapshot {
  string event_id = 1;
  string event_type = 2;
  string purpose = 3;
  chatto.core.evt.v1.EncryptedUserString encrypted = 4;
}

message ProjectedVerifiedEmailSnapshot {
  string digest = 1;
  ProjectedEncryptedUserStringSnapshot value = 2;
  google.protobuf.Timestamp verified_at = 3;
}

message RoomTimelineProjectionSnapshot {
  repeated TimelineEntrySnapshot entries = 1;
  repeated TimelineBodySnapshot bodies = 2;
  repeated StringTimestampSnapshot tombstoned_at = 3;
  repeated StringTimestampSnapshot shredded_at = 4;
  repeated string retracted_event_ids = 5;
  repeated string hidden_echo_event_ids = 6;
  repeated string shredded_user_ids = 7;
  ProjectionReplayGuardSnapshot replay_guard = 8;
  repeated PinnedMessageSnapshot pinned_messages = 9;
  repeated LatestRoomPinSnapshot latest_room_pins = 10;
}

message PinnedMessageSnapshot {
  string pin_event_id = 1;
  string room_id = 2;
  string message_event_id = 3;
  // Durable EVT stream order of the pin fact.
  uint64 pin_sequence = 4;
}

message LatestRoomPinSnapshot {
  string room_id = 1;
  string pin_event_id = 2;
  // Durable EVT stream order of the latest pin fact.
  uint64 pin_sequence = 3;
}

message TimelineEntrySnapshot {
  // Exact EVT stream position of the complete event payload.
  uint64 stream_sequence = 1;
  string event_id = 2;
  string room_id = 3;
  string actor_id = 4;
  google.protobuf.Timestamp created_at = 5;
  // Stable EVT subject event-type token.
  string event_type = 6;
  // Canonical authorization root. A root message names itself.
  string thread_root_event_id = 7;
  string echo_of_event_id = 8;
  // Direct thread parent. Empty for room-visible entries.
  string in_thread_event_id = 9;
  bool historical_import = 10;
  string message_author_id = 11;
}

message TimelineBodySnapshot {
  string message_event_id = 1;
  // All body-event sequences in commit order, including the current one.
  repeated uint64 body_event_sequences = 2;
  uint64 current_body_sequence = 3;
  string current_body_event_id = 4;
  string author_id = 5;
  // Number of non-empty attachment references in the current body.
  uint32 attachment_count = 6;
  // False after retraction or key shredding. Sequence history remains stored.
  bool active = 7;
}

message StringTimestampSnapshot {
  string key = 1;
  google.protobuf.Timestamp value = 2;
}

message AssetMessageOwnerSnapshot {
  string asset_id = 1;
  string room_id = 2;
  string message_event_id = 3;
  string author_id = 4;
}

// Snapshot records are projection-owned serialization contracts, not runtime read models.

// RoomSnapshot stores room state for projection restore.
message RoomSnapshot {
  string id = 1;
  string name = 3;
  string description = 4;
  bool archived = 5;
  // Canonical kind discriminator.
  chatto.core.evt.v1.RoomKind kind = 8;
  // Universal channel rooms grant effective membership to every server member
  // who is currently eligible to join the room. Explicit memberships are
  // preserved separately so disabling universal restores the previous state.
  bool universal = 9;
  // Minimum number of seconds a non-exempt member must wait between original
  // message posts. Channel rooms only; zero disables slow mode.
  uint32 slow_mode_seconds = 10;
  // Thread policy for channel rooms. See chatto.core.evt.v1.RoomThreadingMode for legacy and DM
  // normalization rules.
  chatto.core.evt.v1.RoomThreadingMode threading_mode = 11;
  // Independent per-user thread interval. Absence in legacy records uses
  // slow_mode_seconds; explicit zero disables thread slow mode.
  optional uint32 thread_slow_mode_seconds = 12;
  // Creation-event timestamp, retained by the room catalog and its snapshot.
  google.protobuf.Timestamp created_at = 13;
  // Separate room purpose retained by history interchange.
  string purpose = 14;
  // Member-only notice state. Never expose this through room discovery.
  RoomNoticeSnapshot notice = 15;
  // Room-owned display setting. Membership facts remain available.
  bool show_membership_events = 16;
}

// RoomNoticeSnapshot stores room notice state for projection restore.
message RoomNoticeSnapshot {
  // ID of the latest notice-change event, including clear operations.
  string version = 1;
  // ID of the last announcement event. Empty after clear.
  string publication_id = 2;
  // Current Markdown source. Empty after clear.
  string body = 3;
  // Source event time of the current publication; corrections preserve it.
  google.protobuf.Timestamp published_at = 4;
}

// UserSnapshot stores non-hydrated user state. Login, display name, and bio
// exist only as encrypted values in ProjectedUserProfileSnapshot.
message UserSnapshot {
  string id = 1;
  google.protobuf.Timestamp created_at = 4; // When the user was created (null for users created before this field was added)
  bool deleted = 5; // True for public tombstones representing deleted/unresolvable users.
  chatto.core.evt.v1.CustomUserStatus custom_status = 6; // Optional durable user-authored status, hidden after expires_at.
  // True for an automated bot identity. False for human accounts, including
  // historical accounts created before bot identities existed.
  bool is_bot = 7;
  // Human owner of this bot. Empty for human accounts.
  string bot_owner_user_id = 8;
  // Reversible account access state, retained across snapshot restore.
  bool deactivated = 10;
}

// RoleSnapshot stores role state for projection restore.
message RoleSnapshot {
  string name = 1; // Unique identifier, lowercase + dashes only, e.g., "owner", "moderator", "content-reviewer"
  string display_name = 2; // Human-readable name, e.g., "Owner", "Moderator", "Content Reviewer"
  string description = 3;
  int32 position = 4; // Display/order position; not an authorization rank.
  bool pingable = 5; // Whether messages can ping users assigned to this role.
}

// RoomGroupSnapshot stores room group state for projection restore.
message RoomGroupSnapshot {
  string id = 1;                    // NanoID for stable identity across renames
  string name = 2;                  // Display name (e.g., "General", "Projects")
  repeated string room_ids = 3;     // Ordered list of room IDs in this group
  string description = 4;           // Optional public group description
  // Ordered mixed sidebar entries. ROOM entries reference Room records by ID;
  // SIDEBAR_LINK entries reference payloads in sidebar_links by ID.
  repeated chatto.core.evt.v1.SidebarGroupEntry entries = 5;

  // Link payloads owned by this group. Kept separate from entries so reorders
  // can move stable IDs without duplicating mutable label/URL data.
  repeated SidebarLinkSnapshot sidebar_links = 6;
}

// SidebarLinkSnapshot stores sidebar link state for projection restore.
message SidebarLinkSnapshot {
  string id = 1;     // NanoID for stable identity across renames/moves
  string label = 2;  // Display label shown in the server sidebar
  string url = 3;    // Absolute http(s) URL or server-local path starting with /
}
