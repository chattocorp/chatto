syntax = "proto3";

package chatto.api.v1;

// Runtime policy values resolved for a concrete resource and viewer.
message EffectivePolicies {
  // Maximum message age in seconds for author edits. Zero disables author
  // edits. Users with message.manage remain unrestricted by this window.
  int32 author_edit_window_seconds = 1;
}

// Scope that supplied an effective policy value.
enum PolicySourceScope {
  POLICY_SOURCE_SCOPE_UNSPECIFIED = 0;
  POLICY_SOURCE_SCOPE_PRODUCT_DEFAULT = 1;
  POLICY_SOURCE_SCOPE_SERVER = 2;
  POLICY_SOURCE_SCOPE_ROOM_GROUP = 3;
  POLICY_SOURCE_SCOPE_ROOM = 4;
}

// Source of one effective policy value.
message EffectivePolicySource {
  PolicySourceScope scope = 1;
  // Resource ID for room-group and room sources. Empty for product and server.
  string scope_id = 2;
}

// Sources corresponding field-for-field with EffectivePolicies.
message EffectivePolicySources {
  EffectivePolicySource author_edit_window = 1;
}
