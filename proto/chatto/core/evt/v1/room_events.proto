syntax = "proto3";

package chatto.core.evt.v1;
import "google/protobuf/timestamp.proto";

import "chatto/core/evt/v1/event_values.proto";

option go_package = "github.com/chattocorp/chatto/cli/internal/pb/chatto/core/evt/v1;evtv1";

// ============================================================================
// PERSISTED EVENT MESSAGE DEFINITIONS
// Changing field numbers or structure below affects JetStream-stored data.
//
// Top-level Event oneof tags owned by this file:
//   - 300-305, 307-309: room lifecycle and notice on evt.room.{roomId}.*
//   - 310-311: room membership on evt.room.{roomId}.*
//   - 320: server-wide account deletion fan-out
//   - 330-333: voice call lifecycle and participant lifecycle on evt.room.{roomId}.*
//
// Keep these tags coordinated with event.proto. Message-internal field numbers
// are local to each message and do not consume top-level Event tag space.
// ============================================================================

// ============================================================================
// ROOM LIFECYCLE EVENTS
// ============================================================================

// RoomNoticeChangedEvent replaces the current notice, or clears it when the
// body is empty. The envelope ID is the write version. An announcement also
// uses the envelope ID and time as the publication ID and publication time.
message RoomNoticeChangedEvent {
  // Channel room that owns the notice.
  string room_id = 1;
  // Complete Markdown source. Empty removes the active notice.
  string body = 2;
  // True for first publication or explicit announcement. False for corrections
  // and clear operations. Corrections retain the previous publication metadata.
  bool announced = 3;
}

message RoomCreatedEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
  string name = 3;
  string description = 4;
  // Room kind (channel or DM). Added when this event became durable
  // on the EVT stream — the room-catalog projection needs it to
  // distinguish DMs (which don't appear in group structures) from
  // channels.
  RoomKind kind = 5;
  // Whether this channel room grants effective membership to every
  // join-eligible server member. DM rooms must leave this false.
  bool universal = 6;
  // Threading policy for this channel. Historical events omit the field and
  // are interpreted as ENABLED. DM rooms leave it UNSPECIFIED.
  RoomThreadingMode threading_mode = 7;
  // Separate source room purpose, retained for interchange exports.
  string purpose = 8;
}

message RoomUpdatedEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
  string name = 3;
  string description = 4;
  // Absence preserves the existing purpose for ordinary room edits.
  optional string purpose = 5;
}

message RoomDeletedEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
}

// RoomArchivedEvent is published when a room is archived.
// Archived rooms are hidden from sidebars and Browse Rooms.
message RoomArchivedEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
}

// RoomUnarchivedEvent is published when a room is unarchived.
// The room becomes visible again in sidebars and Browse Rooms.
message RoomUnarchivedEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
}

// RoomUniversalChangedEvent is published when a channel room's universal
// membership flag changes. It is a single state-carrying configuration event
// rather than enabled/disabled lifecycle events so replay can apply the latest
// boolean value directly.
message RoomUniversalChangedEvent {
  string room_id = 1;
  bool universal = 2;
}

// RoomSlowModeChangedEvent is published when a channel room's per-user
// posting interval changes. Zero disables slow mode.
message RoomSlowModeChangedEvent {
  string room_id = 1;
  uint32 slow_mode_seconds = 2;
  // New writers store both intervals. Legacy absence uses slow_mode_seconds.
  optional uint32 thread_slow_mode_seconds = 3;
}

// RoomThreadingModeChangedEvent is published when a channel room's thread
// creation and reply-placement policy changes.
message RoomThreadingModeChangedEvent {
  string room_id = 1;
  RoomThreadingMode threading_mode = 2;
}

// RoomMembershipEventsVisibilityChangedEvent records a channel's display setting.
// It does not change membership facts, history reads, or realtime delivery.
message RoomMembershipEventsVisibilityChangedEvent {
  string room_id = 1;
  bool show_membership_events = 2;
}

// ============================================================================
// ROOM MEMBERSHIP EVENTS
// ============================================================================

message UserJoinedRoomEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
}

message UserLeftRoomEvent {
  reserved 1;
  reserved "space_id";
  string room_id = 2;
}

// ServerMemberDeletedEvent is published when a user's account is deleted.
// This notifies all server members that the user is gone, so they can:
// - Update their member lists
// - Refresh messages to show "Deleted User" and unavailable content
message ServerMemberDeletedEvent {
  reserved 1;
  reserved "space_id";
  string user_id = 2;
}

// ============================================================================
// VOICE CALL EVENTS
// ============================================================================

enum CallParticipantEventSource {
  CALL_PARTICIPANT_EVENT_SOURCE_UNSPECIFIED = 0;
  // The user explicitly requested the transition through Chatto.
  CALL_PARTICIPANT_EVENT_SOURCE_USER = 1;
  // LiveKit reported the transition through a webhook.
  CALL_PARTICIPANT_EVENT_SOURCE_LIVEKIT = 2;
  // Chatto reconciled its local projection against LiveKit's current room state.
  CALL_PARTICIPANT_EVENT_SOURCE_RECONCILIATION = 3;
}

// Event: a user joined or attempted to join a voice call in a room.
//
// The participant is identified by the parent Event.actor_id. USER-sourced
// facts represent explicit user intent and may be optimistic; LIVEKIT and
// RECONCILIATION facts represent observed media-server state.
message CallParticipantJoinedEvent {
  string room_id = 1;
  CallParticipantEventSource source = 2;
  string call_id = 3;
}

// Event: a user left or attempted to leave a voice call in a room.
//
// The participant is identified by the parent Event.actor_id. USER-sourced
// facts represent explicit user intent; LIVEKIT and RECONCILIATION facts
// represent observed media-server state.
message CallParticipantLeftEvent {
  string room_id = 1;
  CallParticipantEventSource source = 2;
  string call_id = 3;
}

// Event: a voice call session started in a room.
//
// The e2ee_key_ref points to a per-call LiveKit E2EE key stored behind the KMS
// boundary. The raw key is deliberately not stored in EVT.
message CallStartedEvent {
  string room_id = 1;
  string call_id = 2;
  string e2ee_key_ref = 3;
  CallParticipantEventSource source = 4;
}

// Event: a voice call session ended in a room.
//
// The associated KMS call key is shredded when this fact is committed.
message CallEndedEvent {
  string room_id = 1;
  string call_id = 2;
  CallParticipantEventSource source = 3;
}

// A member invited a human account to this room. The envelope records sender and time.
message RoomInvitationCreatedEvent {
  string room_id = 1;
  string invitation_id = 2;
  string recipient_id = 3;
  google.protobuf.Timestamp expires_at = 4;
}
// The recipient accepted; the membership fact commits in the same batch.
message RoomInvitationAcceptedEvent {
  string room_id = 1;
  string invitation_id = 2;
  string recipient_id = 3;
  string sender_id = 4;
}
// The recipient declined. Notification deletion does not produce this fact.
message RoomInvitationDeclinedEvent {
  string room_id = 1;
  string invitation_id = 2;
  string recipient_id = 3;
  string sender_id = 4;
}
