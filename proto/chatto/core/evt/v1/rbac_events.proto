syntax = "proto3";

package chatto.core.evt.v1;

option go_package = "hmans.de/chatto/internal/pb/chatto/core/evt/v1;evtv1";

// ============================================================================
// DURABLE RBAC EVENTS (evt.rbac.>)
//
// Top-level Event oneof tags owned by this file:
//   - 800-814: durable RBAC role, assignment, and permission events
//
// Keep these tags coordinated with event.proto. Message-internal field numbers
// are local to each message and do not consume top-level Event tag space.
// ============================================================================

message RbacRoleCreatedEvent {
  string role_name = 1;
  string display_name = 2;
  string description = 3;
  // Position for readers that do not support place_lowest.
  int32 rank = 4;
  bool pingable = 5;
  // When true, readers place the new role lowest, directly above everyone,
  // and renumber the role order (ADR-114). Older readers use rank.
  bool place_lowest = 6;
}

message RbacRoleDisplayNameChangedEvent {
  string role_name = 1;
  string display_name = 2;
}

message RbacRoleDescriptionChangedEvent {
  string role_name = 1;
  string description = 2;
}

message RbacRolePingableChangedEvent {
  string role_name = 1;
  bool pingable = 2;
}

message RbacRoleDeletedEvent {
  string role_name = 1;
}

// Replaces the order of custom roles. Servers before 0.5 wrote this event;
// current servers write RbacRoleMovedEvent. Readers assign positions upward
// from 1 to the listed custom roles, lowest first, and skip the fixed system
// positions (moderator 100, admin 900, owner 1000).
message RbacRolesReorderedEvent {
  // Custom role names, lowest first.
  repeated string role_names = 1;
}

// Moves one role in the role order. Role order is the administrative rank:
// an account ranks at its highest role and can manage only accounts and roles
// that rank below it (ADR-114). Readers place role_name directly above
// before_role_name, or lowest when before_role_name is empty, and renumber
// every role except owner and everyone upward from 1. Owner then ranks
// directly above the highest role, and everyone stays at 0.
message RbacRoleMovedEvent {
  string role_name = 1;
  // Role directly below the moved role. Empty places the role lowest.
  string before_role_name = 2;
}

message RbacRoleAssignedEvent {
  string user_id = 1;
  string role_name = 2;
}

message RbacRoleRevokedEvent {
  string user_id = 1;
  string role_name = 2;
}

enum RbacPermissionScopeKind {
  RBAC_PERMISSION_SCOPE_KIND_UNSPECIFIED = 0;
  RBAC_PERMISSION_SCOPE_KIND_SERVER = 1;
  RBAC_PERMISSION_SCOPE_KIND_GROUP = 2;
  RBAC_PERMISSION_SCOPE_KIND_ROOM = 3;
  RBAC_PERMISSION_SCOPE_KIND_DM = 4;
}

message RbacPermissionScope {
  RbacPermissionScopeKind kind = 1;

  // Empty for server and direct-message decisions. For group and room scope,
  // this is the target group ID or room ID.
  string id = 2;
}

enum RbacPermissionSubjectKind {
  RBAC_PERMISSION_SUBJECT_KIND_UNSPECIFIED = 0;
  RBAC_PERMISSION_SUBJECT_KIND_ROLE = 1;
  RBAC_PERMISSION_SUBJECT_KIND_USER = 2;
}

message RbacPermissionSubject {
  RbacPermissionSubjectKind kind = 1;

  // Role name for ROLE subjects; user ID for USER subjects.
  string id = 2;
}

message RbacPermissionGrantedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}

message RbacPermissionDeniedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}

// Removes any explicit allow or deny, returning this permission to inherited/no-decision state.
message RbacPermissionClearedEvent {
  reserved 1, 2;
  reserved "location";

  string permission = 3;
  RbacPermissionScope scope = 4;
  RbacPermissionSubject subject = 5;
}
