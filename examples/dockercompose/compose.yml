services:
  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir=/data", "--auth=${NATS_TOKEN}"]
    volumes:
      - nats_data:/data

  livekit:
    image: livekit/livekit-server:latest
    command:
      - --config
      - /etc/livekit.yaml
    ports:
      - "7882:7882/udp"  # WebRTC media (UDP, must be direct)
      - "7881:7881/tcp"  # WebRTC media fallback when UDP is unavailable
      - "3478:3478/udp"  # TURN/STUN relay for NAT traversal
    expose:
      - "7880"  # WebSocket signaling (proxied through Caddy)
    volumes:
      - ${LIVEKIT_CONFIG_FILE:-./livekit.yaml}:/etc/livekit.yaml:ro

  chatto:
    image: ghcr.io/chattocorp/chatto:latest
    env_file: .env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    depends_on:
      - nats
    expose:
      - "4000"

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-chat.example.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  nats_data:
  caddy_data:
  caddy_config:
