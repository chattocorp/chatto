syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";

// Private availability choice shared by the account's devices on this server.
// Other users only receive PresenceStatus, never this choice.
enum PresenceMode {
  // No choice supplied; rejected on selection.
  PRESENCE_MODE_UNSPECIFIED = 0;
  // Show Online while at least one device refreshes liveness.
  PRESENCE_MODE_ONLINE = 1;
  // Show Away while at least one device refreshes liveness.
  PRESENCE_MODE_AWAY = 2;
  // Suppress notification alerts on all devices until the choice changes.
  PRESENCE_MODE_DO_NOT_DISTURB = 3;
  // Public presence is indistinguishable from an offline account.
  PRESENCE_MODE_INVISIBLE = 4;
}

// Saved choice visible only to the authenticated account itself.
message PresencePreference {
  // The account's saved choice, independent of current connection liveness.
  PresenceMode mode = 1;
  // Opaque revision required when replacing this choice.
  string revision = 2;
}

// Read the authenticated account's own choice; accepts no other user ID.
message GetPresencePreferenceRequest {}
// Current private choice, or absence before first initialization.
message GetPresencePreferenceResponse {
  // Absent until the account first saves a choice.
  PresencePreference preference = 1;
}

// An explicit selection. Heartbeats must not call this operation.
message SetPresencePreferenceRequest {
  // Explicit new choice for every device on this server.
  PresenceMode mode = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // Revision from the last read; empty only when initializing an absent choice.
  string expected_revision = 2;
}
// Acknowledged current choice after the selection commits.
message SetPresencePreferenceResponse {
  PresencePreference preference = 1;
}

// Refresh the authenticated account's liveness without supplying a choice.
message RefreshPresenceRequest {}
// Current private choice after refreshing liveness.
message RefreshPresenceResponse {
  // Private saved choice; clients use this to recover missed device updates.
  PresencePreference preference = 1;
}

// Live presence status returned by public read APIs.
//
// Offline is a public read-side state. It reveals neither connection liveness
// nor whether the account selected Invisible. Use the private preference API
// for explicit choices and RefreshPresence for connection heartbeats.
enum PresenceStatus {
  // No presence status was specified.
  PRESENCE_STATUS_UNSPECIFIED = 0;
  // The user is actively available.
  PRESENCE_STATUS_ONLINE = 1;
  // The user is connected but away or idle.
  PRESENCE_STATUS_AWAY = 2;
  // The user does not want notifications while this live status is active.
  PRESENCE_STATUS_DO_NOT_DISTURB = 3;
  // The user has no public live presence.
  PRESENCE_STATUS_OFFLINE = 4;
}

// Legacy live report. A saved private choice takes precedence over this report.
message SetPresenceRequest {
  // Live status to store for the authenticated user. Offline is rejected.
  PresenceStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0, 4]
  }];
  // Legacy manual-selection flag. It cannot replace a saved private choice.
  // New clients use SetPresencePreference for explicit selections.
  bool user_selected = 2;
}

// Result of updating live presence.
message SetPresenceResponse {
  // Reportable status accepted and stored by the server.
  PresenceStatus status = 1;
}
