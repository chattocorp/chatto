[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@latest",
  "--headless",
  "--isolated",
]

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--headless",
  "--isolated",
  "--output-dir",
  ".context/playwright-mcp",
]

[mcp_servers.svelte]
url = "https://mcp.svelte.dev/mcp"

[mcp_servers.mdn]
url = "https://mcp.mdn.mozilla.net/"
