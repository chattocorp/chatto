min_version = "2026.8.9"

[tools]
# Keep this version equal to rust-toolchain.toml.
rust = "1.99.0"

[tasks.dev]
description = "Run the native app"
dir = "{{config_root}}"
run = "cargo run --locked"

[tasks.build]
description = "Build the native release binary"
dir = "{{config_root}}"
run = "cargo build --locked --release"

[tasks.check]
description = "Check Rust formatting and lint all targets"
dir = "{{config_root}}"
run = ["cargo fmt --all -- --check", "cargo clippy --locked --all-targets -- -D warnings"]

[tasks.test]
description = "Run the native app test targets"
dir = "{{config_root}}"
run = "cargo test --locked --all-targets"

[tasks.preview]
description = "Open the offline interface preview"
dir = "{{config_root}}"
run = "cargo run --locked -- --preview"
