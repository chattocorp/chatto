syntax = "proto3";

package chatto.operator.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/member_directory.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/rooms.proto";

// Request a page of channel rooms through the local Operator API.
message ListRoomsRequest {
  // Exact stored channel name. Empty lists all channel names.
  string name = 1;
  // Offset page. The default limit is 20 and the maximum is 100.
  chatto.api.v1.PageRequest page = 2;
}

// Channel rooms and page metadata for an operator lookup.
message ListRoomsResponse {
  // Active and archived channel rooms, ordered by stable room ID.
  repeated chatto.api.v1.Room rooms = 1;
  // Count and next-page status after the name filter.
  chatto.api.v1.PageInfo page = 2;
}

// Create one channel room through the local Operator API.
message CreateRoomRequest {
  // Required channel name. Chatto applies normal room-name validation.
  string name = 1;
  // Optional room description.
  string description = 2;
  // Optional group ID. Empty selects the current default group.
  string group_id = 3;
}

// The room created by this request.
message CreateRoomResponse {
  // The created room, with its stable Chatto ID.
  chatto.api.v1.Room room = 1;
}

// Request to add an existing user to a channel room as an explicit member.
message AddMemberRequest {
  // Required Chatto channel room ID.
  string room_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required Chatto user ID.
  string user_id = 2 [(buf.validate.field).string.min_len = 1];
}

// The resulting channel room membership.
message AddMemberResponse {
  // Chatto channel room ID.
  string room_id = 1;
  // User who is now an explicit member of the room.
  chatto.api.v1.DirectoryMember member = 2;
}

// Root-equivalent local room commands.
service OperatorRoomService {
  // Lists channel rooms, including archived rooms, without a user session or
  // room membership. Pages are live reads; changes between requests can shift
  // offsets. The service is available only on the Operator Unix socket.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // Creates a channel room as Chatto's system actor. A repeated request for
  // an existing name returns ALREADY_EXISTS.
  // The service is available only on the Operator Unix socket.
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  // Adds an explicit channel member as Chatto's system actor. An existing
  // membership succeeds without another join event. Archived, universal, and
  // DM rooms cannot gain explicit members. The service is available only on
  // the Operator Unix socket.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
}
