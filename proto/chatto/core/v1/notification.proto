syntax = "proto3";

package chatto.core.v1;

import "google/protobuf/timestamp.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/v1;corev1";

/*
   Notification is the unified wrapper for all notification types.

   Notifications are stored in the RUNTIME_STATE KV bucket with key format:
   notification.{recipientId}.{notificationId}

   This enables efficient user-scoped queries via prefix filtering.
*/
message Notification {
  // Unique notification identifier (NanoID)
  string id = 1;

  // User who receives this notification
  string recipient_id = 2;

  // When this notification was created
  google.protobuf.Timestamp created_at = 3;

  // User who triggered this notification (message author)
  string actor_id = 4;

  // The concrete notification payload
  oneof notification {
    // ===== NOTIFICATION TYPES (100-199) =====
    DMMessageNotification dm_message = 100;
    MentionNotification mention = 101;
    ReplyNotification reply = 102;
    RoomMessageNotification room_message = 103;
  }
}

// ============================================================================
// NOTIFICATION TYPES
// ============================================================================

// DMMessageNotification is created when someone sends a message in a DM conversation.
// The recipient is any participant in the DM except the sender.
message DMMessageNotification {
  // Room ID of the DM conversation
  string room_id = 1;

  // Event ID of the message
  string event_id = 2;
}

// MentionNotification is created when someone @mentions a user in a message.
// The recipient is the mentioned user.
message MentionNotification {
  reserved 1;
  reserved "space_id";

  // Room where the mention occurred
  string room_id = 2;

  // Event ID of the message containing the mention
  string event_id = 3;

  // Thread root event ID if the mention was on a message inside a thread.
  // Empty for room-level mentions.
  string in_thread = 4;
}

// ReplyNotification is created when someone replies to a user's message.
// The recipient is the original message author.
message ReplyNotification {
  reserved 1;
  reserved "space_id";

  // Room where the reply occurred
  string room_id = 2;

  // Event ID of the reply message
  string event_id = 3;

  // Event ID of the message being replied to (may be thread root or direct reply target)
  string in_reply_to_id = 4;

  // Thread root event ID if this reply was in a thread. Empty for room-level replies.
  string in_thread = 5;
}

// RoomMessageNotification is created for users with ALL_MESSAGES notification level.
// The recipient is any room member with the ALL_MESSAGES level, except the author.
// Only fires for root messages (thread replies do not generate ALL_MESSAGES
// notifications), so no in_thread field is needed.
message RoomMessageNotification {
  reserved 1;
  reserved "space_id";

  // Room where the message was posted
  string room_id = 2;

  // Event ID of the message
  string event_id = 3;
}

// NotificationReason identifies why one source activity qualified for a
// recipient's notification list. One occurrence can retain several reasons.
enum NotificationReason {
  NOTIFICATION_REASON_UNSPECIFIED = 0;
  NOTIFICATION_REASON_DIRECT_MESSAGE = 1;
  NOTIFICATION_REASON_DIRECT_MENTION = 2;
  NOTIFICATION_REASON_REPLY = 3;
  NOTIFICATION_REASON_ROLE_MENTION = 4;
  NOTIFICATION_REASON_HERE = 5;
  NOTIFICATION_REASON_ALL = 6;
  NOTIFICATION_REASON_FOLLOWED_THREAD = 7;
  NOTIFICATION_REASON_FOLLOWED_ROOM = 8;
  NOTIFICATION_REASON_REACTION = 9;
  NOTIFICATION_REASON_ROOM_INVITATION = 10;
}

// NotificationDeliveryIntensity controls whether qualifying activity is
// omitted, recorded silently, or eligible for an interruptive alert.
enum NotificationDeliveryIntensity {
  NOTIFICATION_DELIVERY_INTENSITY_UNSPECIFIED = 0;
  NOTIFICATION_DELIVERY_INTENSITY_OFF = 1;
  NOTIFICATION_DELIVERY_INTENSITY_BADGE = 2;
  NOTIFICATION_DELIVERY_INTENSITY_ALERT = 3;
}

// NotificationInboxState is the persisted attention state. DONE is retained
// only for compatibility with Notifications 2.0 development records written
// before the single-list model; visible DONE records are treated as read.
enum NotificationInboxState {
  NOTIFICATION_INBOX_STATE_UNSPECIFIED = 0;
  NOTIFICATION_INBOX_STATE_UNREAD = 1;
  NOTIFICATION_INBOX_STATE_READ = 2;
  NOTIFICATION_INBOX_STATE_DONE = 3;
}

// NotificationRemovalReason explains why an occurrence is represented only by
// an anti-recreation tombstone.
enum NotificationRemovalReason {
  NOTIFICATION_REMOVAL_REASON_UNSPECIFIED = 0;
  NOTIFICATION_REMOVAL_REASON_DELETED = 1;
  NOTIFICATION_REMOVAL_REASON_TARGET_RETRACTED = 2;
  NOTIFICATION_REMOVAL_REASON_REACTION_REMOVED = 3;
  NOTIFICATION_REMOVAL_REASON_VISIBILITY_LOST = 4;
  NOTIFICATION_REMOVAL_REASON_ACCOUNT_DELETED = 5;
}

// NotificationAlertState tracks recoverable interruptive delivery for an
// occurrence. List and badge visibility do not depend on this state.
enum NotificationAlertState {
  NOTIFICATION_ALERT_STATE_UNSPECIFIED = 0;
  NOTIFICATION_ALERT_STATE_NOT_APPLICABLE = 1;
  NOTIFICATION_ALERT_STATE_PENDING = 2;
  NOTIFICATION_ALERT_STATE_CLAIMED = 3;
  NOTIFICATION_ALERT_STATE_DELIVERED = 4;
  NOTIFICATION_ALERT_STATE_SILENCED = 5;
}

// NotificationReasonMatch records one matched cause and its effective policy
// result at the source activity's evaluation boundary.
message NotificationReasonMatch {
  NotificationReason reason = 1;
  NotificationDeliveryIntensity intensity = 2;
}

// NotificationTarget identifies the exact activity destination without
// copying message, room, or user presentation data.
message NotificationTarget {
  string room_id = 1;
  optional string thread_root_event_id = 2;
  string event_id = 3;
  optional string parent_event_id = 4;
}

// NotificationOccurrence is recipient-specific bounded runtime state derived
// from one canonical source event. It is stored under a deterministic
// notification_v2 key with an absolute 90-day lifetime.
message NotificationOccurrence {
  string id = 1;
  string recipient_id = 2;
  string source_event_id = 3;
  google.protobuf.Timestamp source_created_at = 4;
  string actor_id = 5;
  NotificationTarget target = 6;
  repeated NotificationReasonMatch reasons = 7;
  NotificationDeliveryIntensity strongest_intensity = 8;
  NotificationInboxState inbox_state = 9;
  // Exact reaction discriminator for reaction-caused occurrences. Empty for
  // every other cause.
  string reaction_emoji = 10;
  google.protobuf.Timestamp evaluated_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp expires_at = 13;
  NotificationRemovalReason removal_reason = 14;
  google.protobuf.Timestamp removed_at = 15;
  NotificationAlertState alert_state = 16;
  google.protobuf.Timestamp alert_claimed_until = 17;
  // Internal EVT stream position of the source fact. Used for causal lifecycle
  // cleanup and read-boundary reconciliation; never exposed through the public
  // API.
  uint64 source_stream_sequence = 18;
}
