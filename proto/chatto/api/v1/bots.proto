syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/users.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

// A managed bot account. Raw API keys are returned only when Chatto issues
// them.
message Bot {
  // Canonical public bot identity.
  User user = 1;
  // Stable human owner user ID.
  string owner_user_id = 2;
  // Account creation time.
  google.protobuf.Timestamp created_at = 3;
  // Legacy time for the initial API key. Use api_keys for active credentials.
  google.protobuf.Timestamp api_key_created_at = 4;
  reserved 5;
  reserved "api_key_rotated_at";
  // Active incoming webhook credentials, ordered by creation time.
  repeated BotIncomingWebhook incoming_webhooks = 6;
  // Active API keys, ordered by creation time.
  repeated BotApiKey api_keys = 7;
}

// Availability of best-effort credential last-use telemetry.
enum CredentialLastUsedState {
  // The server did not return a last-use state.
  CREDENTIAL_LAST_USED_STATE_UNSPECIFIED = 0;
  // The server has no recorded use for the credential.
  CREDENTIAL_LAST_USED_STATE_NO_USE_RECORDED = 1;
  // last_used_at contains the most recent recorded authentication time.
  CREDENTIAL_LAST_USED_STATE_RECORDED = 2;
  // Last-use telemetry is temporarily unavailable.
  CREDENTIAL_LAST_USED_STATE_UNAVAILABLE = 3;
}

// Safe metadata for one active bot API key. The raw key is returned only when
// Chatto creates it.
message BotApiKey {
  // Stable API-key credential ID.
  string id = 1;
  // Manager-defined name.
  string name = 2;
  // Time the API key was created.
  google.protobuf.Timestamp created_at = 3;
  // Availability of best-effort last-use telemetry.
  CredentialLastUsedState last_used_state = 4;
  // Most recent recorded successful authentication time.
  optional google.protobuf.Timestamp last_used_at = 5;
}

// Safe metadata for one active bot incoming webhook. The webhook URL is
// returned only when the credential is created.
message BotIncomingWebhook {
  reserved 4;
  reserved "rotated_at";

  // Stable webhook credential ID.
  string id = 1;
  // Manager-defined name for the credential.
  string name = 2;
  // Time the incoming webhook credential was created.
  google.protobuf.Timestamp created_at = 3;
  // Availability of best-effort last-use telemetry.
  CredentialLastUsedState last_used_state = 5;
  // Most recent recorded successful authentication time.
  optional google.protobuf.Timestamp last_used_at = 6;
}

// Request bots visible to the caller. Owners see their own bots. Callers with
// bot.manage or user.manage-accounts see every bot.
message ListBotsRequest {
  // Optional case-insensitive login or display-name search.
  string search = 1 [(buf.validate.field).string.max_len = 100];
  // Page request. Defaults to 20 results when absent or limit is zero.
  PageRequest page = 2;
}

// Page of visible bots.
message ListBotsResponse {
  // Visible bots.
  repeated Bot bots = 1;
  // Page metadata.
  PageInfo page = 2;
}

// Request one bot by stable user ID.
message GetBotRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Response containing one bot.
message GetBotResponse {
  // Requested bot.
  Bot bot = 1;
}

// Request several bots by stable user ID.
message BatchGetBotsRequest {
  // Required bot user IDs. Missing or inaccessible bots are omitted.
  repeated string bot_user_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {string: {min_len: 1}}
  }];
}

// Response containing accessible bots in first-seen request order.
message BatchGetBotsResponse {
  // Found bots.
  repeated Bot bots = 1;
}

// Request creation of a bot owned by the authenticated human caller.
message CreateBotRequest {
  // Bot login. Must end in `_bot`.
  string login = 1 [(buf.validate.field).string = {min_len: 2, max_len: 32}];
  // Public display name.
  string display_name = 2 [(buf.validate.field).string.max_len = 32];
  // Optional name for the initial API key. Defaults to "Default key".
  optional string api_key_name = 3 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

// Result of creating a bot. api_key is shown once and cannot be retrieved.
message CreateBotResponse {
  // Created bot.
  Bot bot = 1;
  // Newly issued API key.
  string api_key = 2;
  // Safe metadata for the newly issued API key.
  BotApiKey api_key_metadata = 3;
}

// Request deletion of a bot account.
message DeleteBotRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of deleting a bot account.
message DeleteBotResponse {
  // True when the bot was deleted.
  bool deleted = 1;
}

// Request creation of one named API key for a bot.
message CreateBotApiKeyRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required manager-defined name. Names do not need to be unique.
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

// Result of creating one API key. api_key is shown once and cannot be
// retrieved later.
message CreateBotApiKeyResponse {
  // Updated bot metadata.
  Bot bot = 1;
  // Newly issued API key.
  string api_key = 2;
  // Safe metadata for the newly issued API key.
  BotApiKey api_key_metadata = 3;
}

// Request irreversible revocation of one bot API key.
message RevokeBotApiKeyRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required API-key credential ID.
  string key_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of revoking one bot API key.
message RevokeBotApiKeyResponse {
  // Updated bot metadata.
  Bot bot = 1;
}

// Request creation of one named incoming webhook for a bot.
message CreateBotIncomingWebhookRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required manager-defined name. Names do not need to be unique.
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
}

// Result of creating an incoming webhook. webhook_url is shown once and cannot
// be retrieved later.
message CreateBotIncomingWebhookResponse {
  // Updated bot metadata.
  Bot bot = 1;
  // Newly issued incoming webhook URL.
  string webhook_url = 2;
}

// Request irreversible revocation of one incoming webhook credential.
message RevokeBotIncomingWebhookRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required webhook credential ID.
  string webhook_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of revoking an incoming webhook.
message RevokeBotIncomingWebhookResponse {
  // Updated bot metadata.
  Bot bot = 1;
}

// Request an administrative reassignment of a bot to another human owner.
message ReassignBotOwnerRequest {
  // Required bot user ID.
  string bot_user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required user ID of the new human owner.
  string owner_user_id = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of reassigning a bot owner. The bot's API keys and configured
// permission allowlist are unchanged.
message ReassignBotOwnerResponse {
  // Reassigned bot.
  Bot bot = 1;
}

// Creates and manages bot accounts owned by human users. Bot API keys cannot
// call this service.
service BotService {
  // Lists bots visible to the authenticated caller.
  rpc ListBots(ListBotsRequest) returns (ListBotsResponse);
  // Gets one visible bot. Returns NOT_FOUND for an unknown bot. Returns
  // PERMISSION_DENIED when the caller is not the owner and has neither
  // bot.manage nor user.manage-accounts.
  rpc GetBot(GetBotRequest) returns (GetBotResponse);
  // Gets several visible bots. Missing and inaccessible bots are omitted.
  rpc BatchGetBots(BatchGetBotsRequest) returns (BatchGetBotsResponse);
  // Creates a bot owned by the authenticated human caller. Requires bot.create.
  rpc CreateBot(CreateBotRequest) returns (CreateBotResponse);
  // Deletes a bot and invalidates all of its API keys.
  rpc DeleteBot(DeleteBotRequest) returns (DeleteBotResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Creates one named API key. A bot can have at most 20 active API keys.
  rpc CreateBotApiKey(CreateBotApiKeyRequest) returns (CreateBotApiKeyResponse);
  // Revokes one API key without changing other active keys.
  rpc RevokeBotApiKey(RevokeBotApiKeyRequest) returns (RevokeBotApiKeyResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Creates a named incoming webhook. A bot can have at most 20 active
  // incoming webhooks.
  rpc CreateBotIncomingWebhook(CreateBotIncomingWebhookRequest) returns (CreateBotIncomingWebhookResponse);
  // Revokes one incoming webhook without changing other webhooks.
  rpc RevokeBotIncomingWebhook(RevokeBotIncomingWebhookRequest) returns (RevokeBotIncomingWebhookResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Reassigns a bot to another active human owner. Requires bot.manage. The
  // current API keys and configured permission allowlist remain unchanged,
  // while effective permissions immediately use the new owner's ceiling.
  rpc ReassignBotOwner(ReassignBotOwnerRequest) returns (ReassignBotOwnerResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}
