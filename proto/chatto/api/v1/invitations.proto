syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/pagination.proto";
import "google/protobuf/timestamp.proto";

// Current lifecycle state of an invite link.
enum InviteLinkStatus {
  INVITE_LINK_STATUS_UNSPECIFIED = 0;
  INVITE_LINK_STATUS_ACTIVE = 1;
  INVITE_LINK_STATUS_EXPIRED = 2;
  INVITE_LINK_STATUS_EXHAUSTED = 3;
  INVITE_LINK_STATUS_REVOKED = 4;
}

// An invite link visible to its creator or a caller with effective
// invite.manage. The link is a bearer capability: anyone who has it can
// create an account while the link is active and admission requires an invite.
message InviteLink {
  // Identifier used to read or revoke the link.
  string id = 1;
  // Fully qualified bearer URL. Anyone who has it can use the link while active.
  string link = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  optional uint32 max_uses = 5;
  google.protobuf.Timestamp expires_at = 6;
  uint32 use_count = 7;
  InviteLinkStatus status = 8;
  google.protobuf.Timestamp revoked_at = 9;
}

// Requests a page of owned invite links, newest first. Effective
// invite.manage expands the result to all links. Counts include only
// visible links. Refresh and clear cached links when authority changes.
message ListInviteLinksRequest {
  // Defaults to 20 results when absent or limit is zero. Maximum: 100.
  chatto.api.v1.PageRequest page = 1;
}

message ListInviteLinksResponse {
  repeated InviteLink invite_links = 1;
  chatto.api.v1.PageInfo page = 2;
}

message GetInviteLinkRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetInviteLinkResponse {
  InviteLink invite_link = 1;
}

// Creates an invite link. Absent constraints mean unlimited uses and no expiry.
message CreateInviteLinkRequest {
  optional uint32 max_uses = 1 [(buf.validate.field).uint32.gte = 1];
  google.protobuf.Timestamp expires_at = 2;
}

message CreateInviteLinkResponse {
  InviteLink invite_link = 1;
}

message RevokeInviteLinkRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RevokeInviteLinkResponse {
  InviteLink invite_link = 1;
}

// Creates and manages links for invite-only account admission. Creators can
// read and revoke their own links without a permission or privileged mode.
// Effective invite.manage permits reads and revocation of any link and
// requires privileged mode for human sessions. It does not permit creation.
// Removing creation permission does not invalidate existing links.
service InviteLinkService {
  // Lists visible links. Filters by authorization before pagination and counts.
  rpc ListInviteLinks(ListInviteLinksRequest) returns (ListInviteLinksResponse);
  // Gets a visible link. Missing and inaccessible links both return NOT_FOUND.
  rpc GetInviteLink(GetInviteLinkRequest) returns (GetInviteLinkResponse);
  // Creates a link. Requires invite.create, without privileged mode.
  rpc CreateInviteLink(CreateInviteLinkRequest) returns (CreateInviteLinkResponse);
  // Permanently revokes a visible link and retains its history. Repeated calls
  // return the revoked link. Missing and inaccessible links return NOT_FOUND.
  rpc RevokeInviteLink(RevokeInviteLinkRequest) returns (RevokeInviteLinkResponse);
}
