syntax = "proto3";

package chatto.api.v1;

import "chatto/api/v1/presence.proto";
import "chatto/api/v1/user_status.proto";

// Public user fields.
message User {
  // Stable user ID.
  string id = 1;
  // Login name.
  string login = 2;
  // Display name, when set.
  string display_name = 3;
  // True when the user account has been deleted.
  bool deleted = 4;
  // Avatar image URL, when available.
  optional string avatar_url = 5;
  // Current live presence status.
  PresenceStatus presence_status = 6;
  // Custom profile status, when set.
  CustomUserStatus custom_status = 7;
  // True when this identity represents an automated bot.
  bool is_bot = 8;
  // Short self-authored biography shown on the user's profile, when set.
  optional string bio = 9;
  // IANA time zone the user shares on their profile (for example
  // "Europe/Berlin"), when set. Absent means the user has not chosen a
  // shareable time zone.
  optional string timezone = 10;
}
