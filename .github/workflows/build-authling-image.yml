name: build Authling image

# Build and check the Authling image for linux/amd64 and linux/arm64, each on
# a runner of its own architecture. The two callers are:
# - ci.yml, for each change that selects the Authling jobs. The `tag` job
#   waits for this build. A push to main also publishes the commit image and
#   moves `dev`.
# - publish-releases.yml, for each Authling version that Sweet tags. The
#   release image moves `latest` only for the highest stable version.
#
# To publish a release tag again, run ci.yml manually with the tag; see
# docs/RELEASING.md.
on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Authling release tag to build and publish, such as authling/v0.3.0. Empty builds the commit of the calling run.'
        required: false
        default: ''
        type: string
      highest:
        description: 'Sweet tag entry: the version is the highest stable Authling version. Only then the image moves `latest`.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      stream_tag: ${{ steps.metadata.outputs.stream_tag }}
      publish: ${{ steps.metadata.outputs.publish }}
      published: ${{ steps.metadata.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      # The scripts come from this run, also for an older release tag.
      - name: Check out the publication scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .context/release-tools
          persist-credentials: false
          sparse-checkout: tools/release
      - name: Log in to GitHub Container Registry
        if: inputs.release_tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image metadata
        id: metadata
        env:
          # Untrusted input: the script validates it.
          RELEASE_TAG: ${{ inputs.release_tag }}
          HIGHEST: ${{ inputs.highest }}
        run: bash .context/release-tools/tools/release/authling-image-metadata.sh

  # An already published release image stays unchanged, so it needs no build.
  build:
    needs: metadata
    if: needs.metadata.outputs.published != 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Each matrix job sets only the output of its own architecture.
    outputs:
      digest-amd64: ${{ steps.digest.outputs.amd64 }}
      digest-arm64: ${{ steps.digest.outputs.arm64 }}
    env:
      IMAGE_LABELS: |
        org.opencontainers.image.source=https://github.com/chattocorp/chatto
        org.opencontainers.image.revision=${{ needs.metadata.outputs.sha }}
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.licenses=AGPL-3.0-or-later
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Start BuildKit from the mirror before its registry configuration applies.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Try the public mirror first to reduce Docker Hub rate limits.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authling/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: authling:check
          cache-from: type=gha,scope=authling-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=authling-${{ matrix.arch }}
          labels: ${{ env.IMAGE_LABELS }}
      - name: Check executable
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          actual="$(docker run --rm --network none --read-only authling:check version)"
          test "$actual" = "authling version ${VERSION}"
      - name: Log in to GitHub Container Registry
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The builder has the checked build in its cache, so this pushes the
      # same image. It gets no tag: the publish job tags the image index.
      - name: Push checked image
        id: push
        if: needs.metadata.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authling/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/chattocorp/authling,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=authling-${{ matrix.arch }}
          labels: ${{ env.IMAGE_LABELS }}
      - name: Record image digest
        id: digest
        if: needs.metadata.outputs.publish == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${ARCH}=${DIGEST}" >> "$GITHUB_OUTPUT"

  publish:
    needs: [metadata, build]
    if: >-
      ${{ !cancelled() && needs.metadata.outputs.publish == 'true'
          && (needs.build.result == 'success'
              || (needs.build.result == 'skipped' && needs.metadata.outputs.published == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release publications share a group because they all can move `latest`.
    # A push to main uses a group of its own run: GitHub cancels a pending job
    # when a newer job waits in its group, and a cancelled job in ci.yml stops
    # the release tags. Thus two close pushes to main can set `dev` out of order
    # until the next Authling change.
    concurrency:
      group: authling-image-${{ inputs.release_tag != '' && 'release' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the publication scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: tools/release
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          STREAM_TAG: ${{ needs.metadata.outputs.stream_tag }}
          RELEASE: ${{ inputs.release_tag != '' }}
          DIGEST_AMD64: ${{ needs.build.outputs.digest-amd64 }}
          DIGEST_ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: bash tools/release/publish-authling-image.sh
