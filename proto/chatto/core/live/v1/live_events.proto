syntax = "proto3";

package chatto.core.live.v1;

import "google/protobuf/timestamp.proto";
import "chatto/core/event/v1/options.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/live/v1;livev1";

// ============================================================================
// LIVE-ONLY EVENT DEFINITIONS
//
// LiveEvent oneof tags are local to this legacy envelope. They do not match
// Event oneof numbers and are never stored in EVT.
// ============================================================================

// ============================================================================

/*
   LiveEvent is the legacy wire envelope for transient pubsub signals. New
   publishers use chatto.core.evt.v1.Event for both durable and transient
   events. During rolling replacement, the transient serializer also appends
   this legacy oneof tag to canonical Event bytes. Old and new replicas can
   then decode the same live.sync.> message.
*/
message LiveEvent {
  option deprecated = true;
  // Universal event identifier (NanoID) for dedupe and client-side idempotency.
  string id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

  // When this live signal was created.
  google.protobuf.Timestamp created_at = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

  // ID of the user or system actor that triggered this signal.
  string actor_id = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

  reserved 10, 21, 24, 41, 50, 51, 70, 71;
  reserved "config_updated", "notification_level_changed", "video_processing_completed",
    "mention_notification", "new_direct_message_notification", "notification_created", "notification_dismissed",
    "user_deleted";

  oneof event {
    // ----- User lifecycle / preferences -----
    UserCreatedSyncEvent user_created = 20 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    // Transient current-profile snapshot derived after a durable profile change.
    UserProfileSyncEvent user_profile_updated = 22 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    ServerUserPreferencesSyncEvent server_user_preferences_updated = 23 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    ThreadFollowChangedEvent thread_follow_changed = 25 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Server membership / lifecycle -----
    ServerMemberDeletedEvent server_member_deleted = 30 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    ServerUpdatedEvent server_updated = 31 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Typing -----
    UserTypingEvent user_typing = 40 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Presence -----
    PresenceChangedEvent presence_changed = 45 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Voice calls -----
    CallParticipantJoinedEvent call_participant_joined = 60 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    CallParticipantLeftEvent call_participant_left = 61 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Notification sync -----
    NotificationOccurrencesInvalidatedEvent notification_occurrences_invalidated = 72 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    NotificationUnreadChangedEvent notification_unread_changed = 73 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Unread indicators -----
    RoomMarkedAsReadEvent room_marked_as_read = 80 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
    MentionStatusClearedEvent mention_status_cleared = 81 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Room layout -----
    RoomGroupsUpdatedEvent room_groups_updated = 90 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

    // ----- Session termination -----
    SessionTerminatedEvent session_terminated = 100 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  }
}

// ============================================================================
// SUBSCRIPTION LIVENESS
// ============================================================================

// HeartbeatEvent is a synthetic event with no payload. StreamMyEvents
// emits one every ~15 seconds so clients can detect a dead subscription
// on an otherwise-healthy WebSocket. It is never persisted and never
// travels over NATS.
message HeartbeatEvent {}

// TimeFormat is the transient preference value used by live synchronization.
// Durable preference facts use the independent EVT enum.
enum TimeFormat {
  TIME_FORMAT_UNSPECIFIED = 0;
  TIME_FORMAT_12H = 1;
  TIME_FORMAT_24H = 2;
}

// ServerMemberDeletedEvent invalidates server member views after account
// deletion. It is a transient signal and is independent from the durable EVT
// payload with the same fields.
message ServerMemberDeletedEvent {
  reserved 1;
  reserved "space_id";
  string user_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// CallParticipantEventSource describes the source of a transient call
// participant update.
enum CallParticipantEventSource {
  CALL_PARTICIPANT_EVENT_SOURCE_UNSPECIFIED = 0;
  CALL_PARTICIPANT_EVENT_SOURCE_USER = 1;
  CALL_PARTICIPANT_EVENT_SOURCE_LIVEKIT = 2;
  CALL_PARTICIPANT_EVENT_SOURCE_RECONCILIATION = 3;
}

// CallParticipantJoinedEvent is the transient call-participant join signal.
message CallParticipantJoinedEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  CallParticipantEventSource source = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string call_id = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// CallParticipantLeftEvent is the transient call-participant leave signal.
message CallParticipantLeftEvent {
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  CallParticipantEventSource source = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string call_id = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// USER LIFECYCLE, PROFILE, AND PREFERENCE SYNC
// ============================================================================

// UserCreatedSyncEvent reports a newly created public user profile.
message UserCreatedSyncEvent {
  string user_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string login = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string display_name = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// UserProfileSyncEvent is a transient, projection-derived live snapshot. It
// is published after a public profile field changes and is never stored in EVT.
// Durable user events remain the authoritative profile facts.
message UserProfileSyncEvent {
  string user_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string display_name = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // URL to the user's avatar, or empty if no avatar is set.
  string avatar_url = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // The user's current login/username.
  string login = 4 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // The user's current public bio, or empty when unset.
  string bio = 5 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // The user's shared IANA time zone, or empty when none is shared.
  string timezone = 6 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ServerUserPreferencesSyncEvent reports updated user display preferences for
// synchronization between the user's active clients.
message ServerUserPreferencesSyncEvent {
  // IANA time zone name. An empty value selects the browser default.
  string timezone = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // Preferred time display format.
  TimeFormat time_format = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // Whether the stored time zone may appear on the user's public profile.
  bool share_timezone = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// SERVER LIFECYCLE EVENTS (deployment-scoped)
// ============================================================================

message ServerUpdatedEvent {
  string server_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string name = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  string description = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // URL to the server's logo, or empty if no logo is set.
  string logo_url = 4 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // URL to the server's banner, or empty if no banner is set.
  string banner_url = 5 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// TYPING INDICATOR EVENTS (room-scoped)
// ============================================================================

// Notifies clients that a user is typing in a room or thread.
// Published directly to NATS Core (bypasses JetStream storage).
// Clients should implement timeout-based clearing (e.g., 6 seconds).
message UserTypingEvent {
  reserved 1;
  reserved "space_id";

  // Room ID where the user is typing
  string room_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];

  // Thread root event ID (optional). If set, the user is typing a reply in this thread.
  // If empty, the user is typing in the main room view.
  optional string thread_root_event_id = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// PRESENCE EVENTS (server-scoped, constructed from KV watcher)
// ============================================================================

// Notifies clients that a user's presence status changed.
// Published when a user comes online, goes offline, or changes their status.
// The user whose presence changed is identified by the parent envelope's actor_id.
// Presence is server-wide; the server context is implicit in the subscription.
message PresenceChangedEvent {
  // The user's new presence status ("ONLINE", "OFFLINE", "AWAY", "DO_NOT_DISTURB")
  string status = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// NOTIFICATION SYNC EVENTS (server-scoped)
// ============================================================================

// User-scoped invalidation for Notifications 2.0 authoritative replacement.
message NotificationOccurrencesInvalidatedEvent {
  // Legacy candidate for a one-shot local sound on a push-eligible
  // occurrence. Consumers must still validate the candidate against the
  // current occurrence and policy. Retained for rolling compatibility.
  optional string alert_candidate_notification_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // Candidate occurrence for one-shot in-app sound. New publishers set this
  // for both in-app and push-notification modes. Older consumers ignore it.
  optional string sound_candidate_notification_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// THREAD FOLLOW EVENTS (user-scoped)
// ============================================================================

// ThreadFollowChangedEvent invalidates one user's viewer-specific thread state.
// It is published for follow/unfollow and read-marker changes and is user-scoped
// for multi-tab/multi-device projection convergence.
message ThreadFollowChangedEvent {
  reserved 1;
  reserved "space_id";
  // The room containing the thread.
  string room_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // The root event ID of the thread.
  string thread_root_event_id = 3 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // Whether the user is now following (true) or not following (false).
  bool is_following = 4 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// UNREAD INDICATOR EVENTS (server-scoped)
// ============================================================================

// Published to the user who marked a room as read. This enables real-time
// updates to other tabs/devices for the same user.
message RoomMarkedAsReadEvent {
  reserved 1;
  reserved "space_id";

  // Room ID that was marked as read
  string room_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// Invalidates neutral unread attention after a Badge delivery decision or a
// read/visibility change. The signal is user-scoped and carries no message
// content. Projection transports hydrate authoritative room and thread state.
message NotificationUnreadChangedEvent {
  // Room whose unread state changed.
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
  // Thread root whose unread state changed. Empty means room-level activity.
  string thread_root_event_id = 2 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// Published to the user whose mention indicator for a room was cleared.
// Fires whenever the server-side mention KV flag (`room_mention_status.*`) is
// deleted — that happens when the user marks a room as read (auto on entry or
// explicit) or dismisses a mention notification on any device. Other devices
// use this to drop the orange dot for the room without waiting for a refetch.
message MentionStatusClearedEvent {
  // Room ID whose mention indicator was cleared
  string room_id = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}

// ============================================================================
// ROOM LAYOUT EVENTS (server-scoped — KV bucket is source of truth)
// ============================================================================

// Notifies clients that the channel-room groups (their ordering, names,
// or membership) were updated. Clients should refetch `Server.roomGroups`.
// Published as a live server event (not stored in JetStream).
message RoomGroupsUpdatedEvent {
  reserved 1;
  reserved "space_id";
}

// ============================================================================
// SESSION TERMINATION EVENTS (user-scoped)
// ============================================================================

// Notifies a user that their session has been terminated.
// Published as a user-scoped event on logout or admin boot.
// The subscription handler closes the stream after forwarding this event,
// ensuring the WebSocket connection is torn down server-side.
message SessionTerminatedEvent {
  // Reason for termination: "logout", "admin_boot", "account_deleted"
  string reason = 1 [(chatto.core.event.v1.event_field_surface) = EVENT_FIELD_SURFACE_SHARED];
}
