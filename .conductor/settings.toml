"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[[preview_urls]]
name = "Chatto"
url = "https://chatto-$CONDUCTOR_WORKSPACE_NAME.localhost:42443"

[[preview_urls]]
name = "Authling"
url = "https://authling-$CONDUCTOR_WORKSPACE_NAME.localhost:42443"

[[preview_urls]]
name = "Mailpit"
url = "https://mailpit-$CONDUCTOR_WORKSPACE_NAME.localhost:42443"

[[preview_urls]]
name = "LiveKit"
url = "https://livekit-$CONDUCTOR_WORKSPACE_NAME.localhost:42443"

[scripts]
setup = "mise trust && mise install && mise setup && (cd authling && mise trust && mise install && mise deps)"
archive = "mise dev-archive"
run_mode = "concurrent"

[scripts.run.dev]
command = "exec tools/dev-supervisor.sh mise dev"
available_in = [ "local" ]
default = true
icon = "git-fork"

[prompts]
create_pr = "Create a full GitHub pull request for the current branch, not a draft PR."

[git]
delete_branch_on_archive = false
worktree_push_auto_setup_remote = true
