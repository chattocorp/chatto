syntax = "proto3";

package chatto.admin.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/roles.proto";
import "chatto/api/v1/users.proto";
import "chatto/admin/v1/roles.proto";
import "chatto/admin/v1/users.proto";
import "google/protobuf/timestamp.proto";

// Compatibility user row returned by member-management reads and commands.
// New account integrations use AdminUser through GetUser and BatchGetUsers.
//
// The embedded user record carries public identity fields; remaining fields are
// admin/member metadata with visibility controlled by the service.
message AdminMember {
  reserved 1 to 4;
  reserved "id", "login", "display_name", "avatar_url";

  // Explicit role assignments. The implicit everyone role is omitted.
  repeated string roles = 5;
  // Account creation time, when known.
  google.protobuf.Timestamp created_at = 6;
  reserved 7;
  reserved "deleted";
  // Whether the caller may see that the user has a verified email and one exists.
  bool has_verified_email = 8;
  // Verified email addresses visible to the caller.
  repeated string verified_emails = 9;
  // Whether the caller may delete this account.
  bool viewer_can_delete_account = 10;
  // Start of the current username-change cooldown, when visible and known.
  google.protobuf.Timestamp last_login_change = 11;
  // Public identity fields for this user.
  chatto.api.v1.User user = 12;
  // Selected primary verified email visible to the caller. Absence can mean
  // that no primary email exists or that the field is not visible.
  optional string primary_verified_email = 13;
  // Deactivated accounts retain their data but cannot use the server.
  bool deactivated = 14;
  // Whether the caller may deactivate or reactivate this account.
  // Absent on servers that do not support account deactivation.
  optional bool viewer_can_change_deactivation = 15;
}

// Request server-admin member IDs.
// Results use creation time, oldest first. Users without a creation time
// appear last, ordered by case-insensitive login. User IDs break ties.
message ListMembersRequest {
  reserved 2, 3;
  reserved "limit", "offset";

  // Case-insensitive login/display-name search term. Empty disables search.
  string search = 1;
  // Defaults to 20 results when absent or limit is zero. Maximum: 100.
  chatto.api.v1.PageRequest page = 4;
}

// Ordered server-admin member IDs. Load rows and role summaries with
// BatchGetMembers. Advance the offset by the number of IDs, including IDs
// omitted by a later batch read.
message ListMembersResponse {
  reserved 1 to 4;
  reserved "members", "roles", "total_count", "has_more";

  // Page metadata.
  chatto.api.v1.PageInfo page = 5;
  // Matching member IDs in list order.
  repeated string user_ids = 6;
}

// Request one server-admin member detail record.
message GetMemberRequest {
  oneof target {
    // Target stable user ID.
    string user_id = 1 [(buf.validate.field).string.min_len = 1];
    // Target login identifier.
    string login = 2 [(buf.validate.field).string.min_len = 1];
  }
}

// Server-admin member detail payload.
message GetMemberResponse {
  // Member record.
  AdminMember member = 1;
  // Roles for assignment UI.
  repeated AdminRole roles = 2;
  // Permissions available for per-user overrides.
  repeated string available_permissions = 3;
  // Whether the caller may assign/revoke roles.
  bool viewer_can_assign_roles = 4;
  // Whether the caller may edit role definitions.
  bool viewer_can_manage_roles = 5;
  // Whether the caller may edit direct user permissions.
  bool viewer_can_manage_user_permissions = 6;
  // Roles the caller may assign without granting authority the caller does not
  // possess. Populated when assignment limits are enforced.
  repeated string assignable_role_names = 7;
  // Roles the caller may revoke without removing restrictions or authority
  // beyond the caller's own. Populated when assignment limits are enforced.
  repeated string revocable_role_names = 8;
  // True when assignable_role_names and revocable_role_names are authoritative.
  // Older servers leave this false and clients may retain legacy behaviour.
  bool role_assignment_limits_enforced = 9;
}

// Request server-admin member rows for a set of stable user IDs.
message BatchGetMembersRequest {
  // Required target user IDs. Unknown IDs are omitted from the response.
  repeated string user_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
}

// Batch server-admin member response.
message BatchGetMembersResponse {
  // Found members. The server preserves first-seen request order and
  // de-duplicates repeated IDs.
  repeated AdminMember members = 1;
  // Public roles for display-name lookup.
  repeated chatto.api.v1.Role roles = 2;
}

// Explicit role assignments and current assignment limits for one human user.
// This resource contains no account details. The implicit everyone role is
// omitted from all lists. List order is not significant. Limits are advisory:
// commands check current authority again. Read this resource again after an
// assignment, revocation, or permission change.
message UserRoleAssignments {
  // Target stable user ID.
  string user_id = 1;
  // Roles explicitly assigned to the target.
  repeated string role_names = 2;
  // Roles within the caller's current grant authority.
  repeated string assignable_role_names = 3;
  // Roles within the caller's current revoke authority for this target,
  // including self-protection and configured-owner restrictions. A listed role
  // need not currently be assigned.
  repeated string revocable_role_names = 4;
}

// Request role assignments without administrative account details.
message GetUserRoleAssignmentsRequest {
  // Required stable ID of a human user.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Current role assignments and limits for the requested user.
message GetUserRoleAssignmentsResponse {
  // Requested assignment state. Resolve role metadata with RoleService.
  UserRoleAssignments assignments = 1;
}

// Request to assign a role to a user.
message AssignRoleRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Role name to assign.
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of assigning a role.
message AssignRoleResponse {
  // Canonical command outcome. Read GetUserRoleAssignments for current limits.
  UserRoleAssignment assignment = 3;
  reserved 1;
  reserved "assigned";

  // Updated admin member row.
  AdminMember member = 2;
}

// Request to revoke a role from a user.
message RevokeRoleRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // Role name to revoke.
  string role_name = 2 [(buf.validate.field).string.min_len = 1];
}

// Result of revoking a role.
message RevokeRoleResponse {
  // Canonical command outcome, independent of administrative account access.
  UserRoleAssignment assignment = 3;
  reserved 1;
  reserved "revoked";

  // Updated admin member row.
  AdminMember member = 2;
}

// Request to update a user's password as a server-admin action.
message ChangeUserPasswordRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  // New password. The server applies the same password policy as registration
  // and password reset.
  string password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}

// Result of an admin password update.
message ChangeUserPasswordResponse {
  // Updated admin member row.
  AdminMember member = 1;
}

// Request to clear a user's self-service username-change cooldown.
message ClearUsernameCooldownRequest {
  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of clearing a user's username-change cooldown.
message ClearUsernameCooldownResponse {
  reserved 1;
  reserved "cleared";
}

// Request to delete a user account as a server-admin action.
message DeleteUserRequest {
  reserved 2;
  reserved "current_password";

  // Target user ID.
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of deleting a user account.
message DeleteUserResponse {
  reserved 1;
  reserved "deleted";
}

// Set account access without deleting user data.
message SetUserDeactivatedRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  bool deactivated = 2;
}

message SetUserDeactivatedResponse {
  // Updated public profile, available under the command's existing authority.
  chatto.api.v1.User profile = 2;
  // Updated administrative member record.
  AdminMember member = 1;
}

// Server-admin user management commands and member-detail reads.
service AdminUserService {
  // Lists administrative user IDs. Requires admin.view-users.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Gets one administrative account without catalogues or editor state.
  // Requires admin.view-users. Unknown or deleted users return NOT_FOUND.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Gets administrative accounts in first-seen request order. Requires
  // admin.view-users. Unknown or deleted users are omitted; repeated IDs are
  // returned once. The whole request fails if access or account hydration fails.
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  // Compatibility account-ID read. New integrations use ListUsers.
  // Requires admin.view-users.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Compatibility detail bootstrap with role/permission editor metadata.
  // New integrations use GetUser and the separate role and permission reads.
  // Requires admin.view-users. Returns NOT_FOUND when the user does not exist.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  // Compatibility account rows with a role catalogue. New integrations use
  // BatchGetUsers. Requires admin.view-users.
  rpc BatchGetMembers(BatchGetMembersRequest) returns (BatchGetMembersResponse);
  // Gets explicit roles and current assignment limits for one human user.
  // Requires role.assign, with privileged mode active for human sessions;
  // admin.view-users is not required. Returns NOT_FOUND for an unknown or
  // deleted user, and FAILED_PRECONDITION for a bot account.
  rpc GetUserRoleAssignments(GetUserRoleAssignmentsRequest) returns (GetUserRoleAssignmentsResponse);
  // Assigns a role to a user. Requires role.assign, and non-owner callers may
  // only assign roles whose granted authority they already possess.
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);
  // Revokes a role from a user. Requires role.assign, and non-owner callers may
  // only revoke roles whose permission decisions are within their authority.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // Updates another user's password as an admin action. Requires
  // user.manage-accounts and a fresh credential for the caller; the caller
  // cannot target their own account.
  rpc ChangeUserPassword(ChangeUserPasswordRequest) returns (ChangeUserPasswordResponse);
  // Clears the target user's self-service username-change cooldown. Requires
  // user.manage-accounts, including when the caller targets their own account.
  rpc ClearUsernameCooldown(ClearUsernameCooldownRequest) returns (ClearUsernameCooldownResponse);
  // Deletes a user account as an admin action. Requires user.delete-any for
  // other users or user.delete-self for the caller.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Deactivates or reactivates a human account. Requires user.manage-accounts.
  // The caller cannot target their own account or an owner account.
  // Deactivation immediately invalidates existing sessions and prevents sign-in.
  // Reactivation permits new sign-ins; old sessions remain invalid.
  // Repeating the current state succeeds without changing it.
  rpc SetUserDeactivated(SetUserDeactivatedRequest) returns (SetUserDeactivatedResponse);
}
