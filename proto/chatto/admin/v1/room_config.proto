syntax = "proto3";

package chatto.admin.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/room_config.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

// Scope at which one room-configuration layer is administered.
message RoomConfigScope {
  oneof scope {
    // Server scope. Must be true when selected.
    bool server = 1;
    // Room-group scope.
    string room_group_id = 2 [(buf.validate.field).string.min_len = 1];
    // Channel-room scope.
    string room_id = 3 [(buf.validate.field).string.min_len = 1];
  }
}

// Sparse room-configuration values contributed by one scope.
message RoomConfigLayer {
  // Maximum message age for author edits. Zero disables author edits. Absence
  // means inherit. Maximum: 30 days.
  google.protobuf.Duration author_edit_window = 1 [(buf.validate.field).duration = {
    gte: {}
    lte: {seconds: 2592000}
  }];
}

// Stored and resolved room-configuration state for one administrative scope.
message RoomConfigState {
  // Sparse values stored directly at the scope.
  RoomConfigLayer layer = 1;
  // Fully resolved configuration at the scope.
  chatto.api.v1.RoomConfig effective = 2;
}

// Requests room-configuration state at one administrative scope.
message GetRoomConfigRequest {
  // Scope to inspect.
  RoomConfigScope scope = 1 [(buf.validate.field).required = true];
}

// Returns stored and resolved room-configuration state.
message GetRoomConfigResponse {
  // Current state at the requested scope.
  RoomConfigState state = 1;
}

// Updates selected values in one room-configuration layer. For a path selected
// by update_mask, omitting its value removes it from the layer and resumes
// inheritance for that field.
message UpdateRoomConfigRequest {
  // Scope whose layer is changed.
  RoomConfigScope scope = 1 [(buf.validate.field).required = true];
  // New values for fields selected by update_mask.
  RoomConfigLayer layer = 2 [(buf.validate.field).required = true];
  // Layer field paths to set or remove.
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
}

// Returns the stored and resolved state after an update.
message UpdateRoomConfigResponse {
  // Updated state at the requested scope.
  RoomConfigState state = 1;
}

// Provides administrator reads and updates for hierarchical room configuration.
service AdminRoomConfigService {
  // Returns the stored layer and effective values. Requires server.manage for
  // server scope and room.manage for room-group or room scope.
  rpc GetRoomConfig(GetRoomConfigRequest) returns (GetRoomConfigResponse);
  // Updates selected values in one layer. Uses the same
  // authorization as Get.
  rpc UpdateRoomConfig(UpdateRoomConfigRequest) returns (UpdateRoomConfigResponse);
}
