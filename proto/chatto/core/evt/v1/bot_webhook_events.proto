syntax = "proto3";
package chatto.core.evt.v1;
import "chatto/core/evt/v1/user_events.proto";
import "google/protobuf/timestamp.proto";
option go_package = "hmans.de/chatto/internal/pb/chatto/core/evt/v1;evtv1";

// Tags 940-942 in Event own outbound bot webhook configuration and delivery.
message BotOutboundWebhookConfiguredEvent {
  string bot_user_id = 1;
  // Configuration generation. Replacement cancels work for earlier generations.
  string webhook_id = 2;
  bool enabled = 3;
  // JSON endpoint credentials encrypted with the bot's PII key.
  EncryptedUserString credentials = 4;
}

// A committed obligation to attempt delivery to one configuration generation.
// References retain no message plaintext or destination credentials.
message BotWebhookDeliveryRequestedEvent {
  string delivery_id = 1;
  string bot_user_id = 2;
  string webhook_id = 3;
  string source_event_id = 4;
  string room_id = 5;
  repeated string triggers = 6;
  google.protobuf.Timestamp occurred_at = 7;
  // Immutable source-time deadline; restart and restore never extend it.
  google.protobuf.Timestamp expires_at = 8;
  uint32 max_attempts = 9;
  int64 retry_delay_ms = 10;
}

// Exactly one terminal fact is appended per delivery aggregate using OCC.
message BotWebhookDeliveryCompletedEvent {
  string delivery_id = 1;
  string bot_user_id = 2;
  string webhook_id = 3;
  string source_event_id = 4;
  // delivered, failed, or skipped.
  string status = 5;
  // Fixed safe category; never a transport error string or response body.
  string reason = 6;
  uint32 attempts = 7;
  uint32 http_status = 8;
}
