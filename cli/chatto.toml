# Chatto configuration for local development. `mise dev`, `mise dev-full`, and
# `mise chatto` use this file from the `cli/` directory. The `chatto` task in
# the root `mise.toml` sets the values that depend on the workspace: ports,
# URLs, data paths, and TestBot. `mise dev-full` also enables email and LiveKit
# and adds the Authling login provider.

[general]
log_level = 'debug'
log_format = 'text'

[webserver]
url = 'http://chatto.local.localhost:4000'
port = 4000
cookie_signing_secret = '871a846584490a6153305533cce100b8e6f39d4184c2fb499d2ed198a9ed37a3'
cookie_encryption_secret = 'a3955a342ba4cb4ffb457a1177295779fbbb73f8e22cd4f68ecb9fb584afcf66'

[operator_api]
enabled = true
socket_path = './data/operator/operator.sock'

# Metrics and the exporter use fixed ports, so concurrent workspaces would
# collide. Enable them for one workspace when you need them.
[metrics]
enabled = false
bind_address = '127.0.0.1'
port = 9090
path = '/metrics'

[exporter]
enabled = false
bind_address = '127.0.0.1'
port = 9100
path = '/metrics'
# s3_refresh_interval = '15m'
# s3_timeout = '30s'

# Experimental MCP routes on the public HTTP server.
[mcp]
enabled = true

[search]
enabled = true

[search_provider]
enabled = true
directory = './data/search'
languages = ['de', 'en']

[core]
secret_key = '2ff88b0e8ceb09c399193d1b9339577e6b0fac883777176231e84f92aa78f794'
projection_snapshots = true

[core.assets]
signing_secret = '2e5cac66f8ea81759952186886d233410c1e6e18e3048bc680792935206240e0'
max_upload_size = '25MB'

# Image resize cache (optional). When enabled, resized images are cached in
# NATS Object Store to avoid re-processing on subsequent requests.
[core.assets.cache]
enabled = true
ttl = '7d'

[auth]
account_creation_policy = 'open'

# `mise dev-full` enables email. Its Mailpit receives the mail.
[smtp]
enabled = false
host = '127.0.0.1'
port = 4008
tls = 'opportunistic'
from = 'chatto@chatto.local'

# Development-only Web Push keys.
[push]
enabled = true
vapid_public_key = 'BKBVYBi1oSQ0rOjiS86KCNa2VfxnH03kON54RUqm3X7Q2JQMBkspTHlgBo27OV3wfcX36cxVyJ2h2I_Zd4Yz_DI'
vapid_private_key = 'rOYtIsUZwE3_91odhvbJX7W6sEFjxCAPeC1FO3CtPEc'
vapid_subject = 'mailto:dev@chatto.run'

[video]
enabled = true

[asset_processing]
enabled = true

# LiveKit voice calls. `mise dev-full` enables them and runs a LiveKit server
# with these keys.
[livekit]
enabled = false
url = 'ws://localhost:4005'
webhook_url = 'http://127.0.0.1:4000/webhooks/livekit'
api_key = 'devkey'
api_secret = 'compose-only-livekit-secret-change-me'

[nats.embedded]
enabled = true
port = 4004
# http_port = 8555
# Keep NATS data separate from the disposable search index in './data/search'.
data_dir = './data/nats'
# For a single NATS server, use 'always' to sync every JetStream write to disk.
# sync_interval = 'always'
auth_token = 'a4a3102bf032b2d8ec14cf4c23fe54cb6a2054e1ad5e24aa4ada78768340e263'

# Dev-only bootstrap. Creates these users + the initial instance only when the
# server is otherwise empty. Plaintext passwords are fine because release
# binaries don't compile this code path.
[[bootstrap.users]]
login = 'alice'
display_name = 'Alice'
email = 'alice@example.com'
password = 'foobar123'
server_role = 'owner'

[[bootstrap.users]]
login = 'bob'
display_name = 'Bob'
email = 'bob@example.com'
password = 'foobar123'

[bootstrap.server]
name = 'Local Development'
