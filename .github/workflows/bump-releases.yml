name: Prepare releases

on:
  push:
    branches: [main]
    paths:
      - '**/.sweet/**'
      - '**/.sweet.yml'
      - '.sweet.config.yml'
      - '.github/workflows/bump-releases.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Unreleased Sweet Release commit (PRs #62, #63, and #64): keep it equal to the
    # tag.yml pin in ci.yml, and move both to the next Sweet release tag.
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@7e618be0b38acb105fe128f030f2f9b71527a0f6
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_PAT }}
