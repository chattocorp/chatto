# Authling config for local development

# Public site identity. These values do not change the issuer URL below.
# Override with AUTHLING_SITE_NAME and AUTHLING_SITE_DESCRIPTION.
[site]
name = 'chatto.id'
description = 'Your account for Chatto.'

[http]
bind_address = '127.0.0.1:8080'
public_url = 'http://localhost:8080'

[authentication]
password_minimum_length = 10

[oidc]
signing_key_rotation_interval_days = 90

[nats]
replicas = 1

[nats.embedded]
enabled = true
data_dir = './.authling/nats'

[smtp]
enabled = true
host = '127.0.0.1'
port = 1025
tls = 'opportunistic'
from = 'authling-dev@authling.localhost'
