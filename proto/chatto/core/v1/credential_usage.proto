syntax = "proto3";

package chatto.core.v1;

option go_package = "hmans.de/chatto/internal/pb/chatto/core/v1;corev1";

// CredentialUsageState stores approximate last-use telemetry for credentials
// that share one owning resource. Keys identify a credential kind and opaque
// credential ID. Values are Unix times in milliseconds.
message CredentialUsageState {
  map<string, int64> last_used_unix_millis = 1;
}
