syntax = "proto3";
package chatto.operator.v1;

// Optional literal name decorations. Defaults preserve source names.
message ImportNaming {
  string channel_prefix = 1;
  string channel_suffix = 2;
  string username_prefix = 3;
  string username_suffix = 4;
}

// One bounded directory archive. Keys are relative archive paths. Values are
// exact file bytes. The server validates all files before the first write.
message ImportArchiveRequest {
  map<string, bytes> metadata = 1;
  map<string, bytes> files = 2;
  ImportNaming naming = 3;
  bool validate_only = 4;
  // Explicit acceptance of omissions declared by the source archive.
  bool accept_omissions = 5;
}

// Counts contain no source identities or content.
message ImportArchiveResponse {
  uint32 users = 1;
  uint32 rooms = 2;
  uint32 assets = 3;
  uint32 events = 4;
  uint32 omissions = 5;
  bool complete = 6;
}

// Root-equivalent history import available only on the local operator socket.
service OperatorImportService {
  // Validate or resume an immutable archive. Retrying after an interrupted
  // response is safe. Changed input or naming options cannot resume an import.
  rpc ImportArchive(ImportArchiveRequest) returns (ImportArchiveResponse);
}
