[tools]
buf = "latest"
go = "1.26.2"
node = "22"
"aqua:axllent/mailpit" = "latest"

# Run these tasks from the Authling directory. Authling owns this task catalog
# so it can move to its own repository without extracting product-specific
# workflow from Chatto's root mise configuration.

[tasks.deps-go]
description = "Install Go dependencies"
run = "GOWORK=off go mod download"
sources = ["go.mod", "go.sum"]

[tasks.deps-web]
description = "Install browser asset dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc", "web/package.json"]

[tasks.deps-playwright]
description = "Install the Chromium browser used by Authling E2E tests"
depends = ["deps-web"]
run = "pnpm exec playwright install chromium"

[tasks.setup]
description = "Set up Authling development dependencies"
depends = ["deps-go", "deps-playwright"]

[tasks.deps]
description = "Install all Authling dependencies"
depends = ["deps-go", "deps-web"]

[tasks.codegen-proto]
description = "Generate Authling Go code from protobuf schemas"
depends = ["deps-go"]
run = "GOWORK=off buf generate"

[tasks.codegen-templates]
description = "Generate templ renderers"
depends = ["deps-go"]
run = "GOWORK=off go tool templ generate"
# The generated Go is committed. Cache by source changes because Git may give
# the template and renderer identical mtimes, causing perpetual output rebuilds.
sources = ["**/*.templ"]

[tasks.codegen]
description = "Generate all Authling code"
depends = ["codegen-proto", "codegen-templates"]

[tasks.build-web]
description = "Build embedded browser assets"
depends = ["deps-web"]
dir = "web"
run = "pnpm build"
sources = [
    "package.json",
    "src/**/*",
    "vite.config.ts",
    "../internal/web/**/*.templ",
]
outputs = [
    "../internal/web/assets/app.css",
    "../internal/web/assets/ibm-plex-sans-cyrillic-ext-wght-normal.woff2",
    "../internal/web/assets/ibm-plex-sans-cyrillic-wght-normal.woff2",
    "../internal/web/assets/ibm-plex-sans-greek-wght-normal.woff2",
    "../internal/web/assets/ibm-plex-sans-latin-ext-wght-normal.woff2",
    "../internal/web/assets/ibm-plex-sans-latin-wght-normal.woff2",
    "../internal/web/assets/ibm-plex-sans-vietnamese-wght-normal.woff2",
]

[tasks.build]
description = "Build the Authling executable"
depends = ["deps-go", "codegen-templates", "build-web"]
run = [
    "GOWORK=off go build -trimpath -o bin/authling ./cmd/authling",
    "go build -trimpath -o bin/authling ./cmd/authling",
]
sources = [
    "go.mod",
    "**/*.go",
    "!**/*_test.go",
]
outputs = ["bin/authling"]

[tasks.test]
description = "Run Authling tests standalone and in the repository workspace"
depends = ["deps-go", "codegen-templates", "build-web"]
run = [
    "GOWORK=off go test -trimpath ./...",
    "go test -trimpath ./...",
]
sources = ["go.mod", "go.sum", "**/*.go"]

[tasks.test-e2e]
description = "Run Authling browser end-to-end tests with isolated processes"
depends = ["build"]
env = { AUTHLING_E2E_SKIP_BUILD = "1" }
run = [
    "pnpm run check:e2e",
    "pnpm exec playwright test",
]

[tasks.authling]
description = "Build and run the Authling CLI command"
depends = ["build"]
raw_args = true
env = {
  AUTHLING_HTTP_BIND_ADDRESS = "127.0.0.1:{{env.CONDUCTOR_PORT | default(value=env.PASEO_PORT | default(value='8080'))}}",
  AUTHLING_HTTP_PUBLIC_URL = "http://localhost:{{env.CONDUCTOR_PORT | default(value=env.PASEO_PORT | default(value='8080'))}}",
  AUTHLING_SMTP_PORT = "{% if env.CONDUCTOR_PORT is defined and env.CONDUCTOR_PORT != '' %}{{env.CONDUCTOR_PORT | int + 8}}{% elif env.PASEO_PORT is defined and env.PASEO_PORT != '' %}{{env.PASEO_PORT | int + 8}}{% else %}1025{% endif %}",
}
run = "exec bin/authling"

[tasks.mailpit]
description = "Run Mailpit for Authling development email"
env = {
  AUTHLING_DEV_MAILPIT_SMTP_PORT = "{% if env.CONDUCTOR_PORT is defined and env.CONDUCTOR_PORT != '' %}{{env.CONDUCTOR_PORT | int + 8}}{% elif env.PASEO_PORT is defined and env.PASEO_PORT != '' %}{{env.PASEO_PORT | int + 8}}{% else %}1025{% endif %}",
  AUTHLING_DEV_MAILPIT_UI_PORT = "{% if env.CONDUCTOR_PORT is defined and env.CONDUCTOR_PORT != '' %}{{env.CONDUCTOR_PORT | int + 9}}{% elif env.PASEO_PORT is defined and env.PASEO_PORT != '' %}{{env.PASEO_PORT | int + 9}}{% else %}8025{% endif %}",
}
run = "exec mailpit --smtp \"127.0.0.1:$AUTHLING_DEV_MAILPIT_SMTP_PORT\" --listen \"127.0.0.1:$AUTHLING_DEV_MAILPIT_UI_PORT\""

[tasks.dev]
description = "Run Authling and its local Mailpit dependency"
run = { tasks = ["mailpit", "authling run"] }

[tasks.clean]
description = "Clean Authling build artifacts"
run = [
    "rm -rf bin",
    "rm -rf internal/web/assets",
]
