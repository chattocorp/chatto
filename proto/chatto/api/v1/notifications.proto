syntax = "proto3";

package chatto.api.v1;

import "buf/validate/validate.proto";
import "chatto/api/v1/pagination.proto";
import "chatto/api/v1/rooms.proto";
import "chatto/api/v1/users.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";

// Why source activity matched the authenticated viewer's notification policy.
enum NotificationReason {
  // No cause was specified. This value is not valid in preference writes.
  NOTIFICATION_REASON_UNSPECIFIED = 0;
  // A message was posted in a direct-message conversation.
  NOTIFICATION_REASON_DIRECT_MESSAGE = 1;
  // The viewer's username was mentioned directly.
  NOTIFICATION_REASON_DIRECT_MENTION = 2;
  // Activity replied directly to the viewer's message.
  NOTIFICATION_REASON_REPLY = 3;
  // A role held by the viewer was mentioned.
  NOTIFICATION_REASON_ROLE_MENTION = 4;
  // An `@here` mention included the viewer.
  NOTIFICATION_REASON_HERE = 5;
  // An `@all` mention included the viewer.
  NOTIFICATION_REASON_ALL = 6;
  // New activity appeared in a thread followed by the viewer.
  NOTIFICATION_REASON_FOLLOWED_THREAD = 7;
  // New activity appeared in a room followed by the viewer.
  NOTIFICATION_REASON_FOLLOWED_ROOM = 8;
  // Someone reacted to the viewer's message.
  NOTIFICATION_REASON_REACTION = 9;
}

// Delivery strength for one notification cause.
enum NotificationDeliveryIntensity {
  // In preference writes, unspecified clears the override (Inherit).
  NOTIFICATION_DELIVERY_INTENSITY_UNSPECIFIED = 0;
  // Matching activity does not create a notification occurrence.
  NOTIFICATION_DELIVERY_INTENSITY_OFF = 1;
  // Matching activity appears in the notification list without interruptive delivery.
  NOTIFICATION_DELIVERY_INTENSITY_BADGE = 2;
  // Matching activity appears in the notification list and may trigger sound or push.
  NOTIFICATION_DELIVERY_INTENSITY_ALERT = 3;
}

// Visual importance of an unread notification. This is independent from
// whether the notification is eligible for sound or push delivery.
enum NotificationAttentionLevel {
  // No attention level was provided.
  NOTIFICATION_ATTENTION_LEVEL_UNSPECIFIED = 0;
  // Ambient activity appears with a neutral unread indicator.
  NOTIFICATION_ATTENTION_LEVEL_AMBIENT = 1;
  // Important activity appears with Chatto's notification orange.
  NOTIFICATION_ATTENTION_LEVEL_IMPORTANT = 2;
}

// One cause that matched an occurrence and its evaluated delivery intensity.
message NotificationReasonMatch {
  // Cause that matched the viewer.
  NotificationReason reason = 1;
  // Effective intensity when the source activity occurred.
  NotificationDeliveryIntensity intensity = 2;
}

// Exact visible message destination of one notification occurrence.
message NotificationRoomMessageTarget {
  // Room containing the source activity.
  RoomSummary room = 1;
  // Exact source or reacted-to message event to reveal.
  string event_id = 2;
  // Thread root when the target is inside a thread.
  optional string thread_root_event_id = 3;
  // Direct reply target when the occurrence was caused by a reply.
  optional string parent_event_id = 4;
}

// Typed resource or activity represented by one notification occurrence.
// Clients must not infer navigation semantics for unsupported variants; they
// may retain the occurrence as a generic, non-navigating triage row.
message NotificationTarget {
  oneof kind {
    // Exact room-message destination.
    NotificationRoomMessageTarget room_message = 1;
  }
}

// One exact Notifications 2.0 source occurrence.
message NotificationOccurrence {
  reserved 11;
  reserved "thread_root_message_excerpt";

  // Stable occurrence ID.
  string id = 1;
  // Durable source event from which this occurrence was derived.
  string source_event_id = 2;
  // Time of the source activity.
  google.protobuf.Timestamp created_at = 3;
  // User who caused the source activity, when still visible.
  User actor = 4;
  // Typed resource or activity represented by this occurrence.
  NotificationTarget target = 5;
  // Every cause that matched when the source activity occurred.
  repeated NotificationReasonMatch reasons = 6;
  // Strongest evaluated intensity across all matching causes.
  NotificationDeliveryIntensity strongest_intensity = 7;
  // Whether this occurrence still contributes unread attention.
  bool unread = 8;
  // Exact emoji for a reaction occurrence. Empty for every other cause.
  string reaction_emoji = 9;
  // Absolute expiry, 90 days after the source activity.
  google.protobuf.Timestamp expires_at = 10;
  // Source-time visual importance of this occurrence.
  NotificationAttentionLevel attention_level = 12;
}

// Request for one page of notification occurrences.
message ListNotificationOccurrencesRequest {
  // Page request. Defaults to 50 results when absent or limit is zero.
  PageRequest page = 1;
}

// One page of exact notification occurrences.
message ListNotificationOccurrencesResponse {
  // Occurrences newest activity first.
  repeated NotificationOccurrence occurrences = 1;
  // Page metadata.
  PageInfo page = 2;
  // Total unread occurrence count, independent of presentation grouping.
  int32 unread_count = 3;
  // Earliest expiry in the complete list, including occurrences outside this page.
  // Clients refresh authoritative notification state at this boundary.
  google.protobuf.Timestamp next_expiry_at = 4;
  // Complete unread-occurrence counts by target room. This is independent of
  // the bounded page so room indicators remain authoritative.
  repeated NotificationRoomUnreadCount room_unread_counts = 5;
  // Exact unread occurrences with Important attention. Absent servers predate
  // attention tiers, so clients should conservatively treat all unread
  // occurrences as Important.
  optional int32 important_unread_count = 6;
}

// Request one exact notification occurrence by stable ID.
message GetNotificationOccurrenceRequest {
  // Required stable occurrence ID.
  string notification_id = 1 [(buf.validate.field).string.min_len = 1];
}

// One exact notification occurrence.
message GetNotificationOccurrenceResponse {
  // Visible occurrence. Absence is reported as NOT_FOUND.
  NotificationOccurrence notification = 1;
}

// Request an explicit bounded set of notification occurrences.
message BatchGetNotificationOccurrencesRequest {
  // Stable occurrence IDs. Unknown, deleted, and currently invisible IDs are
  // omitted. Repeated IDs are de-duplicated in first-seen request order.
  repeated string notification_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
}

// Exact visible notification occurrences requested by stable ID.
message BatchGetNotificationOccurrencesResponse {
  // Found occurrences in first-seen request order.
  repeated NotificationOccurrence notifications = 1;
}

// Unread notification occurrences currently targeting one room.
message NotificationRoomUnreadCount {
  // Target room ID.
  string room_id = 1;
  // Number of unread occurrences targeting this room.
  int32 unread_count = 2;
  // Unread occurrences in this room with Important attention. Absence has the
  // same compatibility meaning as the response-level field.
  optional int32 important_unread_count = 3;
}

// Request to mark one notification occurrence read.
message MarkNotificationReadRequest {
  // Required stable occurrence ID.
  string notification_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Notification occurrence after marking it read.
message MarkNotificationReadResponse {
  // Updated occurrence.
  NotificationOccurrence notification = 1;
}

// Request permanent deletion of one notification occurrence.
message DeleteNotificationOccurrenceRequest {
  // Required stable occurrence ID.
  string notification_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Result of deleting one notification occurrence.
message DeleteNotificationOccurrenceResponse {
  // True when this call replaced a visible occurrence with a deletion tombstone.
  // False when the occurrence was already absent or deleted.
  bool deleted = 1;
}

// Request permanent deletion of an explicit bounded set of occurrences.
message BatchDeleteNotificationOccurrencesRequest {
  // Stable occurrence IDs to delete. Duplicates and already absent IDs are
  // ignored. The server accepts at most 100 IDs.
  repeated string notification_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
}

// Result of deleting exact notification occurrences.
message BatchDeleteNotificationOccurrencesResponse {
  // Number of visible occurrences replaced by deletion tombstones.
  int32 deleted_count = 1;
}

// Request permanent deletion of every currently visible notification occurrence.
message DeleteAllNotificationOccurrencesRequest {}

// Result of deleting every currently visible notification occurrence.
message DeleteAllNotificationOccurrencesResponse {
  // Number of visible occurrences replaced by deletion tombstones.
  int32 deleted_count = 1;
}

// Explicit and effective delivery policy for one notification cause.
message NotificationPolicyPreference {
  // Notification cause controlled by this row.
  NotificationReason reason = 1;
  // Explicit server override, or unspecified when inherited from product defaults.
  NotificationDeliveryIntensity server_intensity = 2;
  // Explicit room override, or unspecified when inherited from server scope.
  NotificationDeliveryIntensity room_intensity = 3;
  // Effective intensity after applying product, server, and room inheritance.
  NotificationDeliveryIntensity effective_intensity = 4;
}

// Request the authenticated viewer's notification policy.
message GetNotificationPolicyRequest {
  // Empty returns server-scoped preferences. A room ID returns the inherited
  // effective policy for that room and requires current membership.
  optional string room_id = 1 [(buf.validate.field).string.min_len = 1];
}

// Complete supported notification policy for one scope.
message GetNotificationPolicyResponse {
  // Room scope when requested; absent for server scope.
  optional string room_id = 1;
  // One row for every supported notification cause.
  repeated NotificationPolicyPreference preferences = 2;
}

// Set or clear one notification preference override.
message SetNotificationPolicyPreferenceRequest {
  // Room scope to change; absent changes the server scope.
  optional string room_id = 1 [(buf.validate.field).string.min_len = 1];
  // Required notification cause.
  NotificationReason reason = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Unspecified clears the selected server or room override.
  NotificationDeliveryIntensity intensity = 3 [(buf.validate.field).enum.defined_only = true];
}

// Complete supported notification policy after one preference change.
message SetNotificationPolicyPreferenceResponse {
  // Room scope when changed; absent for server scope.
  optional string room_id = 1;
  // One row for every supported notification cause.
  repeated NotificationPolicyPreference preferences = 2;
}

// Reads, marks read, and deletes notifications for the authenticated viewer.
service NotificationService {
  // Gets one exact visible occurrence. Returns NOT_FOUND when it is absent,
  // deleted, expired, or no longer visible to the authenticated viewer.
  rpc GetNotificationOccurrence(GetNotificationOccurrenceRequest) returns (GetNotificationOccurrenceResponse);
  // Gets an explicit bounded set of visible occurrences. Missing or
  // inaccessible IDs are omitted and duplicate IDs are de-duplicated.
  rpc BatchGetNotificationOccurrences(BatchGetNotificationOccurrencesRequest) returns (BatchGetNotificationOccurrencesResponse);
  // Lists exact Notifications 2.0 occurrences. Clients may derive temporary
  // presentation groups without changing occurrence identity or counts.
  rpc ListNotificationOccurrences(ListNotificationOccurrencesRequest) returns (ListNotificationOccurrencesResponse);
  // Marks one occurrence read. Repeating the call is safe.
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Permanently deletes one occurrence while retaining its anti-recreation
  // tombstone through the original expiry. Repeating the call is safe.
  rpc DeleteNotificationOccurrence(DeleteNotificationOccurrenceRequest) returns (DeleteNotificationOccurrenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Permanently deletes an exact set of occurrences. Repeating the call is
  // safe because later activity receives different occurrence IDs.
  rpc BatchDeleteNotificationOccurrences(BatchDeleteNotificationOccurrencesRequest) returns (BatchDeleteNotificationOccurrencesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Permanently deletes every visible occurrence current at the server's
  // authoritative mutation boundary. Callers must not retry this mutation
  // automatically because later activity may arrive after that boundary.
  rpc DeleteAllNotificationOccurrences(DeleteAllNotificationOccurrencesRequest) returns (DeleteAllNotificationOccurrencesResponse);
  // Gets every supported cause and its effective inherited delivery intensity.
  rpc GetNotificationPolicy(GetNotificationPolicyRequest) returns (GetNotificationPolicyResponse);
  // Sets or clears one server- or room-scoped cause override.
  rpc SetNotificationPolicyPreference(SetNotificationPolicyPreferenceRequest) returns (SetNotificationPolicyPreferenceResponse) {
    option idempotency_level = IDEMPOTENT;
  }

}
