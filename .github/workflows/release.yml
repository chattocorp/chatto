name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - main
      - 'release-[0-9]*'
  push:
    tags:
      - "v*"
      - "chatto-desktop/v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact to build"
        required: true
        default: image
        type: choice
        options:
          - image
          - desktop
      ref:
        description: "Git ref or SHA to build. Defaults to the selected workflow ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-please:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CONFIG_FILE: .release-please-config.json
      MANIFEST_FILE: .release-please-manifest.json
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: ${{ env.CONFIG_FILE }}
          manifest-file: ${{ env.MANIFEST_FILE }}
          target-branch: ${{ env.TARGET_BRANCH }}

  build-image:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'image' }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Resolve image metadata
        id: image
        run: |
          set -euo pipefail

          sha="$(git rev-parse HEAD)"
          development_version="$(mise env --json | jq -r '.CHATTO_DEVELOPMENT_VERSION // empty')"
          if [[ -n "$development_version" ]]; then
            version="${development_version}+${sha:0:12}"
          else
            # Historical refs predate CHATTO_DEVELOPMENT_VERSION. Preserve the
            # arbitrary-ref build contract by using their checked-in release
            # version instead.
            release_version="$(sed -n 's/.*Version = "\([^"]*\)".*/\1/p' cli/version.go)"
            if [[ -z "$release_version" ]]; then
              echo "::error::Could not determine the Chatto version."
              exit 1
            fi
            version="${release_version}+${sha:0:12}"
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          {
            echo "### Image"
            echo
            echo "- Commit: \`${sha}\`"
            echo "- Version: \`${version}\`"
            echo "- Image: \`ghcr.io/chattocorp/chatto:${sha}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend assets for CLI image
        run: mise build-frontend
        env:
          CHATTO_BUILD_VERSION: ${{ steps.image.outputs.version }}
          CHATTO_FRONTEND_PRECOMPRESS: "1"

      - name: Prepare Docker context
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          context="/tmp/chatto-docker/linux-amd64"
          mkdir -p "$context"
          cp docker/Dockerfile.goreleaser "$context/Dockerfile"
          mkdir -p "$context/docker"
          cp docker/docker-entrypoint.sh "$context/docker/docker-entrypoint.sh"
          cp docker/nats-wrapper.sh "$context/docker/nats-wrapper.sh"
          mkdir -p "$context/LICENSES"
          cp LICENSES/AGPL-3.0-or-later.txt "$context/LICENSES/AGPL-3.0-or-later.txt"
          cp NOTICE "$context/NOTICE"

          (
            cd cli
            # Chatto does not expose Gin's MessagePack binding; omit its large codec.
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -tags=nomsgpack \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "$context/chatto" .
          )

      - name: Build and push Chatto image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/chatto-docker/linux-amd64
          file: /tmp/chatto-docker/linux-amd64/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/chattocorp/chatto:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=chatto-manual-amd64
          cache-to: type=gha,mode=max,scope=chatto-manual-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  build-desktop-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chatto-desktop/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    name: build-desktop-release (${{ matrix.platform }})
    environment: desktop-signing
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-15
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          install-cli-deps: "false"

      - name: Resolve desktop version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#chatto-desktop/v}"
          else
            version="$(jq -r '.version' apps/desktop/package.json)"
          fi
          sha="$(git rev-parse HEAD)"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "::error::Could not determine the Chatto Desktop version."
            exit 1
          fi
          if [[ -z "$sha" ]]; then
            echo "::error::Could not determine the checked-out commit."
            exit 1
          fi

          frontend_version="${version}+${sha:0:12}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_version}" >> "$GITHUB_OUTPUT"

          {
            echo "### Chatto Desktop"
            echo
            echo "- Commit: \`${sha}\`"
            echo "- Desktop version: \`${version}\`"
            echo "- Bundled frontend version: \`${frontend_version}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check and test desktop shell
        run: mise test-desktop

      - name: Test macOS game-capture helper
        if: runner.os == 'macOS'
        run: mise test-desktop-macos-capture

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.CHATTO_MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CHATTO_MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.CHATTO_MACOS_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          for variable in \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            NOTARY_API_KEY_BASE64 \
            NOTARY_API_KEY_ID \
            NOTARY_API_ISSUER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::The ${variable} macOS release secret is not configured."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/chatto-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_API_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/chatto-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          {
            echo "CHATTO_MACOS_NOTARY_API_KEY=${api_key_path}"
            echo "CHATTO_MACOS_SIGNING_KEYCHAIN=${keychain_path}"
            echo "CHATTO_MACOS_SIGNING_CERTIFICATE=${certificate_path}"
          } >> "$GITHUB_ENV"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Developer ID Application:/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::The certificate does not contain a Developer ID Application identity."
            exit 1
          fi

          {
            echo "CHATTO_MACOS_SIGN_IDENTITY=${signing_identity}"
            echo "CHATTO_MACOS_NOTARY_API_KEY_ID=${NOTARY_API_KEY_ID}"
            echo "CHATTO_MACOS_NOTARY_API_ISSUER_ID=${NOTARY_API_ISSUER_ID}"
          } >> "$GITHUB_ENV"

      - name: Build desktop bundle
        shell: bash
        env:
          CHATTO_BUILD_VERSION: ${{ steps.version.outputs.frontend_version }}
          DEBUG: ${{ runner.os == 'macOS' && 'electron-notarize*' || '' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            mise desktop-build 2>&1 | tee "$RUNNER_TEMP/chatto-macos-notarization.log"
          else
            mise desktop-build
          fi

      - name: Verify bundled frontend version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.frontend_version }}
        run: |
          jq -e --arg expected "$EXPECTED_VERSION" \
            '.version == $expected' \
            apps/frontend/build/_app/version.json

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helper="apps/desktop/dist/Chatto Desktop.app/Contents/Helpers/Chatto Capture Helper.app/Contents/MacOS/chatto-macos-capture-probe"
          test -x "$helper"
          codesign --verify --deep --strict --verbose=2 "apps/desktop/dist/Chatto Desktop.app"
          xcrun stapler validate "apps/desktop/dist/Chatto Desktop.app"
          spctl --assess --type execute --verbose=4 "apps/desktop/dist/Chatto Desktop.app"
          mkdir -p .context/desktop-release
          ditto -c -k --sequesterRsrc --keepParent \
            "apps/desktop/dist/Chatto Desktop.app" \
            ".context/desktop-release/chatto-desktop_${VERSION}_macOS_${RUNNER_ARCH}.zip"

      - name: Upload macOS notarisation log
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-notarisation-log-${{ github.run_id }}-${{ runner.arch }}
          path: ${{ runner.temp }}/chatto-macos-notarization.log
          if-no-files-found: warn
          retention-days: 90

      - name: Remove macOS signing credentials
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [[ -n "${CHATTO_MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CHATTO_MACOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${CHATTO_MACOS_SIGNING_CERTIFICATE:-$RUNNER_TEMP/chatto-developer-id.p12}" \
            "${CHATTO_MACOS_NOTARY_API_KEY:-$RUNNER_TEMP/chatto-notary-api-key.p8}"

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .context/desktop-release
          tar -C apps/desktop/dist -czf \
            ".context/desktop-release/chatto-desktop_${VERSION}_Linux_${RUNNER_ARCH}.tar.gz" \
            chatto-desktop

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force .context/desktop-release | Out-Null
          Compress-Archive `
            -Path "apps/desktop/dist/windows" `
            -DestinationPath ".context/desktop-release/chatto-desktop_$env:VERSION`_Windows_$env:RUNNER_ARCH.zip"

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-${{ matrix.platform }}-${{ runner.arch }}
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 1

  assemble-desktop-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chatto-desktop/v')) || (github.event_name == 'workflow_dispatch' && inputs.target == 'desktop') }}
    needs: build-desktop-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-release-*
          path: .context/desktop-release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd .context/desktop-release
          sha256sum chatto-desktop_* > chatto-desktop_checksums.txt

      - name: Upload desktop release verification
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-verification-${{ github.run_id }}
          path: .context/desktop-release
          if-no-files-found: error
          retention-days: 1

      - name: Upload and publish desktop release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" .context/desktop-release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    # runs-on: ubicloud-standard-4
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    outputs:
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch release branches
        run: git fetch origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release-*:refs/remotes/origin/release-*'

      - name: Verify release-please tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"

          source_branch=""
          if git merge-base --is-ancestor "$tag_commit" origin/main; then
            source_branch="main"
          else
            while IFS= read -r ref; do
              if git merge-base --is-ancestor "$tag_commit" "$ref"; then
                source_branch="${ref#refs/remotes/origin/}"
                break
              fi
            done < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release-*')
          fi

          if [[ -z "$source_branch" ]]; then
            echo "::error::Refusing to release ${GITHUB_REF_NAME}: tagged commit is not reachable from origin/main or an origin/release-* branch."
            exit 1
          fi

          echo "source_branch=${source_branch}" >> "$GITHUB_OUTPUT"

          parent_count="$(git rev-list --parents -n 1 "$tag_commit" | awk '{ print NF - 1 }')"
          if [[ "$parent_count" -lt 1 ]]; then
            echo "::error::Refusing to release ${GITHUB_REF_NAME}: tagged commit has no parent to compare against."
            exit 1
          fi

          disallowed=()
          while IFS= read -r path; do
            case "$path" in
              .release-please-config.json|\
              .release-please-config-main.json|\
              .release-please-manifest.json|\
              .release-please-manifest-main.json|\
              CHANGELOG.md|\
              cli/version.go|\
              apps/frontend/package.json)
                ;;
              *)
                disallowed+=("$path")
                ;;
            esac
          done < <(git diff --name-only "${tag_commit}^" "$tag_commit")

          if (( ${#disallowed[@]} > 0 )); then
            echo "::error::Refusing to release ${GITHUB_REF_NAME}: tagged commit contains non-release-please files."
            printf 'Disallowed file: %s\n' "${disallowed[@]}"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          push_latest=false
          is_stable=false
          if [[ "$version" != *-* ]]; then
            is_stable=true
            highest_stable="$(
              git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
                sed 's/^v//' |
                grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
                sort -V |
                tail -n 1
            )"

            if [[ "$version" == "$highest_stable" ]]; then
              push_latest=true
            fi
          fi

          echo "push_latest=${push_latest}" >> "$GITHUB_OUTPUT"
          echo "is_stable=${is_stable}" >> "$GITHUB_OUTPUT"

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build frontend once
        run: mise build-frontend
        env:
          CHATTO_FRONTEND_PRECOMPRESS: "1"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Use a PAT so the release is authored by a user account rather
          # than github-actions[bot]. Bot-authored releases don't get
          # GitHub's autolink rendering for commit SHAs and #NNN PR refs.
          GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          CHATTO_PUSH_LATEST: ${{ steps.release_meta.outputs.push_latest }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build frontend Docker tags
        id: frontend_tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/chattocorp/chatto-client:${{ steps.version.outputs.version }}"
            if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
              echo "ghcr.io/chattocorp/chatto-client:next"
            elif [[ "${{ steps.release_meta.outputs.push_latest }}" == "true" ]]; then
              echo "ghcr.io/chattocorp/chatto-client:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend.prebuilt
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend_tags.outputs.tags }}
          cache-from: type=gha,scope=chatto-client
          cache-to: type=gha,scope=chatto-client,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/chattocorp/chatto
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          gh release edit "v${VERSION}" \
            --repo chattocorp/chatto \
            --draft=false

      - name: Update Homebrew tap
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is required to update chattocorp/homebrew-tap."
            exit 1
          fi

          workdir="$(mktemp -d)"
          checksums="${workdir}/chatto_${VERSION}_checksums.txt"

          gh release download "v${VERSION}" \
            --repo chattocorp/chatto \
            --pattern "chatto_${VERSION}_checksums.txt" \
            --dir "${workdir}"

          checksum_for() {
            awk -v artifact="$1" '$2 == artifact { print $1 }' "${checksums}"
          }

          darwin_arm64_sha="$(checksum_for chatto_Darwin_arm64.tar.gz)"
          linux_arm64_sha="$(checksum_for chatto_Linux_arm64.tar.gz)"
          linux_x86_64_sha="$(checksum_for chatto_Linux_x86_64.tar.gz)"

          for checksum in darwin_arm64_sha linux_arm64_sha linux_x86_64_sha; do
            if [[ -z "${!checksum}" ]]; then
              echo "::error::Missing ${checksum} in ${checksums}."
              exit 1
            fi
          done

          tap_dir="${workdir}/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/chattocorp/homebrew-tap.git" "${tap_dir}"

          mkdir -p "${tap_dir}/Formula"
          cat > "${tap_dir}/Formula/chatto.rb" <<FORMULA
          class Chatto < Formula
            desc "Real-time chat app CLI and server"
            homepage "https://github.com/chattocorp/chatto"
            version "${VERSION}"
            license "AGPL-3.0-or-later"

            on_macos do
              on_arm do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Darwin_arm64.tar.gz"
                sha256 "${darwin_arm64_sha}"
              end

              on_intel do
                odie "Chatto currently provides Homebrew builds for Apple Silicon macOS only."
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Linux_arm64.tar.gz"
                sha256 "${linux_arm64_sha}"
              end

              on_intel do
                url "https://github.com/chattocorp/chatto/releases/download/v#{version}/chatto_Linux_x86_64.tar.gz"
                sha256 "${linux_x86_64_sha}"
              end
            end

            def install
              bin.install "chatto"
              system "codesign", "--force", "--sign", "-", bin/"chatto" if OS.mac?
            end

            test do
              assert_match "chatto version #{version}", shell_output("#{bin}/chatto version")
            end
          end
          FORMULA

          git -C "${tap_dir}" config user.name "github-actions[bot]"
          git -C "${tap_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git -C "${tap_dir}" diff --quiet -- Formula/chatto.rb; then
            echo "Homebrew tap already contains Chatto ${VERSION}."
            exit 0
          fi

          git -C "${tap_dir}" add Formula/chatto.rb
          git -C "${tap_dir}" commit -m "chore: update chatto to v${VERSION}"
          git -C "${tap_dir}" push origin HEAD:main

  publish-stable-docs:
    needs: release
    if: ${{ github.event_name == 'push' && needs.release.outputs.is_stable == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docs-image.yml
