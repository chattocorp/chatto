syntax = "proto3";

package chatto.realtime.v1;

import "chatto/api/v1/room_directory.proto";
import "chatto/api/v1/server.proto";
import "chatto/api/v1/user_service.proto";
import "chatto/api/v1/voice_calls.proto";
import "chatto/realtime/v1/events.proto";
import "google/protobuf/timestamp.proto";

// Client-to-server frame for Chatto's protobuf WebSocket realtime protocol.
//
// Clients send binary protobuf frames to `/api/realtime`. The first frame must
// be `hello`. After the server replies with `hello`, clients send
// `subscribe_events` to start one authorized public event stream.
message RealtimeClientFrame {
  reserved 4, 5;
  reserved "ack", "hydrate_room", "catch_up";

  oneof frame {
    // Opens the protocol session and optionally carries a bearer token.
    RealtimeClientHello hello = 1;
    // Starts the caller's authorized public event stream.
    RealtimeSubscribeEvents subscribe_events = 2;
    // Application-level ping. The server replies with `pong`.
    RealtimePing ping = 3;
  }
}

// Server-to-client frame for Chatto's protobuf WebSocket realtime protocol.
message RealtimeServerFrame {
  oneof frame {
    // Confirms protocol and server versions.
    RealtimeServerHello hello = 1;
    // Confirms the stream and the recovery mode that the server selected.
    RealtimeSubscribed subscribed = 2;
    // One authorized public event copy.
    RealtimeEvent event = 3;
    // Application-level heartbeat used for liveness checks.
    RealtimeHeartbeat heartbeat = 4;
    // Protocol or authorization error.
    RealtimeError error = 5;
    // Server-requested close with reconnect guidance.
    RealtimeClose close = 6;
    // Reply to a client ping.
    RealtimePong pong = 7;
    // Confirms that recovery reached the live-stream boundary.
    RealtimeCaughtUp caught_up = 8;
    // One canonical resource family in an exact server-content snapshot.
    RealtimeSnapshot snapshot = 9;
  }
}

// Initial client hello.
message RealtimeClientHello {
  reserved 3;
  reserved "resume_cursor";

  // Behavioral protocol version requested by the client. The only supported
  // version is 4.
  uint32 protocol_version = 1;
  // Optional bearer token. When present, it takes precedence over cookie auth.
  optional string bearer_token = 2;
}

// Initial server hello.
message RealtimeServerHello {
  reserved 3, 5;
  reserved "resume_supported", "capabilities";

  // Behavioral protocol version accepted by the server.
  uint32 protocol_version = 1;
  // Chatto server software version.
  string server_version = 2;
  // Approximate heartbeat interval clients should expect.
  uint32 heartbeat_interval_seconds = 4;
}

// Startup behavior when a subscription cannot resume from its cursor.
enum RealtimeInitialState {
  // Invalid value. The server rejects subscriptions that use it.
  REALTIME_INITIAL_STATE_UNSPECIFIED = 0;
  // Start at the current event boundary without sending current resources.
  REALTIME_INITIAL_STATE_LIVE_ONLY = 1;
  // Send an exact authorized snapshot before later public events.
  REALTIME_INITIAL_STATE_SNAPSHOT = 2;
}

// Recovery path selected for one subscription.
enum RealtimeRecoveryMode {
  // Invalid value.
  REALTIME_RECOVERY_MODE_UNSPECIFIED = 0;
  // Delivery starts at the current boundary without current resources or history.
  REALTIME_RECOVERY_MODE_LIVE_ONLY = 1;
  // The server sends an exact authorized snapshot before later events.
  REALTIME_RECOVERY_MODE_SNAPSHOT = 2;
  // Durable events resume after the supplied cursor.
  REALTIME_RECOVERY_MODE_RESUME = 3;
}

// Request to start the caller's authorized public event stream.
message RealtimeSubscribeEvents {
  reserved 2;
  reserved "retained_room_ids";

  // Opaque cursor from a previously received durable event or `caught_up`
  // frame. A usable cursor receives bounded authorized durable events after
  // that position. Cursors expire 15 minutes after issue.
  optional string resume_cursor = 1;
  // Required fallback when the cursor is absent or cannot resume safely.
  RealtimeInitialState initial_state = 3;
}

// Confirms that event streaming has started.
message RealtimeSubscribed {
  reserved 1, 2;
  reserved "cursor", "start_cursor";

  // Recovery path selected after cursor validation and admission checks.
  RealtimeRecoveryMode recovery_mode = 3;
}

// One resource family from an authorized snapshot of `ServerContentView`.
//
// The server sends all snapshot frames between `subscribed(SNAPSHOT)` and
// `caught_up`. The client must discard an incomplete snapshot if the socket
// closes before `caught_up`. List values replace the complete local family.
// Large and paginated resources, such as message history, are not part of the
// snapshot and remain available through ConnectRPC.
message RealtimeSnapshot {
  oneof resource {
    // Current public server profile.
    chatto.api.v1.ServerPublicProfile server = 1;
    // Complete visible room directory.
    chatto.api.v1.ListRoomsResponse rooms = 2;
    // Complete visible room-group layout.
    chatto.api.v1.ListRoomGroupsResponse room_groups = 3;
    // Users referenced by this snapshot. This is not the server directory.
    chatto.api.v1.BatchGetUsersResponse users = 4;
    // Complete visible active-call state.
    chatto.api.v1.ListActiveCallsResponse active_calls = 5;
  }
}

// Confirms that recovery is complete and live delivery has begun.
//
// Clients can retain `cursor` after they apply every preceding event.
// Transient events are never replayed.
message RealtimeCaughtUp {
  // Opaque cursor at the recovery-to-live handoff boundary.
  string cursor = 1;
}

// One authorized public event with its optional resume cursor.
//
// Each payload uses a realtime-owned public message. The union is the public
// event catalogue. A canonical event that is absent from this union is not
// part of the realtime API. The server creates a fresh caller-specific value
// after authorization. Durable events have a resume cursor. Transient events
// do not.
message RealtimeEvent {
  reserved "state";

  // Universal event identifier (NanoID).
  string id = 1;
  // Time when the source event was created.
  google.protobuf.Timestamp created_at = 2;
  // ID of the user that caused the event. An empty value means no user actor.
  string actor_id = 3;
  // Opaque cursor safe to retain after this complete event is accepted.
  optional string resume_cursor = 4;

  // Authorized semantic payload.
  oneof event {
    RoomCreatedEvent room_created = 300;
    RoomUpdatedEvent room_updated = 301;
    RoomDeletedEvent room_deleted = 302;
    RoomArchivedEvent room_archived = 303;
    RoomUnarchivedEvent room_unarchived = 304;
    RoomUniversalChangedEvent room_universal_changed = 305;
    RoomSlowModeChangedEvent room_slow_mode_changed = 307;
    RoomThreadingModeChangedEvent room_threading_mode_changed = 308;
    UserJoinedRoomEvent user_joined_room = 310;
    UserLeftRoomEvent user_left_room = 311;
    VoiceCallParticipantJoinedEvent voice_call_participant_joined = 330;
    VoiceCallParticipantLeftEvent voice_call_participant_left = 331;
    VoiceCallStartedEvent voice_call_started = 332;
    VoiceCallEndedEvent voice_call_ended = 333;
    MessagePostedEvent message_posted = 400;
    MessageEditedEvent message_edited = 401;
    MessageRetractedEvent message_retracted = 402;
    MessagePinnedEvent message_pinned = 405;
    MessageUnpinnedEvent message_unpinned = 406;
    ThreadCreatedEvent thread_created = 425;
    AssetProcessingStartedEvent asset_processing_started = 451;
    AssetProcessingSucceededEvent asset_processing_succeeded = 452;
    AssetProcessingFailedEvent asset_processing_failed = 453;
    AssetDeletedEvent asset_deleted = 454;
    ServerMotdChangedEvent server_motd_changed = 504;
    UserAccountCreatedEvent user_account_created = 700;
    UserLoginChangedEvent user_login_changed = 701;
    UserDisplayNameChangedEvent user_display_name_changed = 702;
    UserAvatarSetEvent user_avatar_set = 703;
    UserAvatarClearedEvent user_avatar_cleared = 704;
    UserAccountDeletedEvent user_account_deleted = 710;
    UserCustomStatusSetEvent user_custom_status_set = 715;
    UserCustomStatusClearedEvent user_custom_status_cleared = 716;
    UserBioChangedEvent user_bio_changed = 722;
    RoomMemberBannedEvent room_member_banned = 840;
    RoomMemberUnbannedEvent room_member_unbanned = 841;
    RoomMemberAddedEvent room_member_added = 842;
    RoomMemberRemovedEvent room_member_removed = 843;
    ReactionAddedEvent reaction_added = 1050;
    ReactionRemovedEvent reaction_removed = 1051;

    UserCreatedSyncEvent user_created_sync = 20000;
    UserProfileSyncEvent user_profile_sync = 20001;
    ServerUserPreferencesSyncEvent server_user_preferences_sync = 20002;
    ThreadFollowChangedSyncEvent thread_follow_changed_sync = 20003;
    ServerMemberDeletedSyncEvent server_member_deleted_sync = 20004;
    ServerUpdatedSyncEvent server_updated_sync = 20005;
    UserTypingSignalEvent user_typing_signal = 20006;
    PresenceChangedSignalEvent presence_changed_signal = 20007;
    CallParticipantJoinedSignalEvent call_participant_joined_signal = 20008;
    CallParticipantLeftSignalEvent call_participant_left_signal = 20009;
    NotificationOccurrencesInvalidatedEvent notification_occurrences_invalidated = 20010;
    NotificationUnreadChangedEvent notification_unread_changed = 20011;
    RoomMarkedAsReadSyncEvent room_marked_as_read_sync = 20012;
    MentionStatusClearedSyncEvent mention_status_cleared_sync = 20013;
    RoomGroupsUpdatedSyncEvent room_groups_updated_sync = 20014;
    SessionTerminatedSignalEvent session_terminated_signal = 20015;
  }
}

// Application-level ping.
message RealtimePing {
  // Opaque value that the server copies to `pong`.
  string nonce = 1;
}

// Application-level pong.
message RealtimePong {
  // Opaque value copied from the client `ping`.
  string nonce = 1;
}

// Application-level heartbeat.
message RealtimeHeartbeat {
  // Stable heartbeat event ID.
  string id = 1;
  // Time the server created the heartbeat.
  google.protobuf.Timestamp created_at = 2;
  // Fresh resume cursor for the latest durable boundary delivered on this
  // socket. A client can retain it only after all earlier frames have been
  // applied.
  optional string resume_cursor = 3;
}

// Protocol error.
message RealtimeError {
  // Stable machine-readable error code.
  string code = 1;
  // Safe human-readable error message.
  string message = 2;
  // Whether the client must stop processing this socket.
  bool fatal = 3;
  // Suggested delay before retry, when applicable.
  optional uint32 retry_after_ms = 4;
  // Affected room for a room-scoped non-fatal error.
  optional string room_id = 5;
}

// Close instruction sent before the socket closes when possible.
message RealtimeClose {
  // Stable machine-readable close code.
  string code = 1;
  // Safe human-readable close message.
  string message = 2;
  // Whether the client should reconnect automatically.
  bool reconnect = 3;
  // Suggested delay before reconnect.
  uint32 retry_after_ms = 4;
}
