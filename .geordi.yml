setup: mise setup
# Each server task listens on a named port of its own. Chatto uses that port. The other
# development services use fixed offsets from GEORDI_PORT, the first of the ten
# spare workspace ports; see the `[env]` section of mise.toml.
# The chatto and chatto-full tasks use the same NATS port and data directory,
# so only one runs at a time. The port check of the second task stops it early.
tasks:
  chatto:
    label: Chatto
    command: CHATTO_DEV_CHATTO_PORT_OVERRIDE=$PORT CHATTO_DEV_CHATTO_URL_OVERRIDE=http://localhost:$PORT mise dev
    ports: [chatto]
    url: http://localhost:{chatto}/
    default: true
  chatto-full:
    label: Chatto with Authling, Runling, Mailpit, and LiveKit
    command: CHATTO_DEV_CHATTO_PORT_OVERRIDE=$PORT CHATTO_DEV_CHATTO_URL_OVERRIDE=http://localhost:$PORT mise dev-full
    ports: [chatto-full]
    url: http://localhost:{chatto-full}/
  desktop:
    label: Chatto Desktop / Run from source
    command: CHATTO_DESKTOP_DEV_PROFILE="$PWD/.context/desktop-profile" mise desktop-dev
  desktop-full:
    label: Chatto Desktop / Run with local voice server
    command: CHATTO_DESKTOP_DEV_PROFILE="$PWD/.context/desktop-profile" mise desktop-dev
    needs: [chatto-full]
  docs:
    label: Docs website
    command: mise dev-docs-website -- --port "$PORT"
    ports: [docs]
    url: http://localhost:{docs}/

sections:
  - path: cli
    title: Chatto server and CLI
  - path: proto
    title: Chatto protocols
  - path: packages/api-types
    title: Chatto API types
  - path: packages/chatto-client
    title: Chatto client SDK
  - path: apps/frontend
    title: Chatto web app
  - path: apps/desktop
    title: Chatto Desktop
  - path: apps/mobile
    title: Chatto Mobile
  - path: packages/chattobot
    title: ChattoBot
  - path: authling
    title: Authling
  - path: packages/runling
    title: Runling
  - path: packages/translatto
    title: Translatto
  - path: pkg
    title: Shared Go modules
  - path: docs
    title: Architecture and project docs
  - path: apps/docs-website
    title: Documentation website
