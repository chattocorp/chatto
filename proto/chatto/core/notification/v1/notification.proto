syntax = "proto3";

package chatto.core.notification.v1;

import "google/protobuf/timestamp.proto";

option go_package = "hmans.de/chatto/internal/pb/chatto/core/notification/v1;notificationv1";

// Notification is the retained Notifications 1.0 storage contract. Current
// code does not write or read it; do not reuse it for Notifications 2.0.
message Notification {
  option deprecated = true;
  // Unique notification identifier (NanoID)
  string id = 1;

  // User who receives this notification
  string recipient_id = 2;

  // When this notification was created
  google.protobuf.Timestamp created_at = 3;

  // User who triggered this notification (message author)
  string actor_id = 4;

  // The concrete notification payload
  oneof notification {
    // ===== NOTIFICATION TYPES (100-199) =====
    DMMessageNotification dm_message = 100;
    MentionNotification mention = 101;
    ReplyNotification reply = 102;
    RoomMessageNotification room_message = 103;
  }
}

// ============================================================================
// NOTIFICATION TYPES
// ============================================================================

// DMMessageNotification is created when someone sends a message in a DM conversation.
// The recipient is any participant in the DM except the sender.
message DMMessageNotification {
  option deprecated = true;
  // Room ID of the DM conversation
  string room_id = 1;

  // Event ID of the message
  string event_id = 2;
}

// MentionNotification is created when someone @mentions a user in a message.
// The recipient is the mentioned user.
message MentionNotification {
  option deprecated = true;
  reserved 1;
  reserved "space_id";

  // Room where the mention occurred
  string room_id = 2;

  // Event ID of the message containing the mention
  string event_id = 3;

  // Thread root event ID if the mention was on a message inside a thread.
  // Empty for room-level mentions.
  string in_thread = 4;
}

// ReplyNotification is created when someone replies to a user's message.
// The recipient is the original message author.
message ReplyNotification {
  option deprecated = true;
  reserved 1;
  reserved "space_id";

  // Room where the reply occurred
  string room_id = 2;

  // Event ID of the reply message
  string event_id = 3;

  // Event ID of the message being replied to (may be thread root or direct reply target)
  string in_reply_to_id = 4;

  // Thread root event ID if this reply was in a thread. Empty for room-level replies.
  string in_thread = 5;
}

// RoomMessageNotification is created for users with ALL_MESSAGES notification level.
// The recipient is any room member with the ALL_MESSAGES level, except the author.
// Only fires for root messages (thread replies do not generate ALL_MESSAGES
// notifications), so no in_thread field is needed.
message RoomMessageNotification {
  option deprecated = true;
  reserved 1;
  reserved "space_id";

  // Room where the message was posted
  string room_id = 2;

  // Event ID of the message
  string event_id = 3;
}

// NotificationAttentionLevel records how strongly an unread occurrence should
// be emphasized in notification lists and navigation indicators. It is
// independent from interruptive delivery policy.
enum NotificationAttentionLevel {
  NOTIFICATION_ATTENTION_LEVEL_UNSPECIFIED = 0;
  NOTIFICATION_ATTENTION_LEVEL_AMBIENT = 1;
  NOTIFICATION_ATTENTION_LEVEL_IMPORTANT = 2;
}

// NotificationMessageReference identifies one exact message destination
// without copying message, room, or user presentation data.
message NotificationMessageReference {
  string room_id = 1;
  optional string thread_root_event_id = 2;
  string event_id = 3;
}

message DirectMessageReceived {
  NotificationMessageReference message = 1;
}

message DirectMentionReceived {
  NotificationMessageReference message = 1;
}

message ReplyReceived {
  NotificationMessageReference message = 1;
}

message RoleMentionReceived {
  NotificationMessageReference message = 1;
  repeated string role_names = 2;
}

message HereMentionReceived {
  NotificationMessageReference message = 1;
}

message AllMentionReceived {
  NotificationMessageReference message = 1;
}

message FollowedThreadActivity {
  NotificationMessageReference message = 1;
}

message FollowedRoomActivity {
  option deprecated = true;

  NotificationMessageReference message = 1;
}

message RoomMessageReceived {
  NotificationMessageReference message = 1;
}

message ReactionReceived {
  NotificationMessageReference message = 1;
  string emoji = 2;
}

// NotificationSignal is the immutable, event-shaped cause and target of one
// recipient notification. New signal kinds are additive oneof branches whose
// payload owns all data required to authorize, render, and navigate it.
message NotificationSignal {
  oneof kind {
    DirectMessageReceived direct_message_received = 1;
    DirectMentionReceived direct_mention_received = 2;
    ReplyReceived reply_received = 3;
    RoleMentionReceived role_mention_received = 4;
    HereMentionReceived here_mention_received = 5;
    AllMentionReceived all_mention_received = 6;
    FollowedThreadActivity followed_thread_activity = 7;
    FollowedRoomActivity followed_room_activity = 8 [deprecated = true];
    ReactionReceived reaction_received = 9;
    RoomMessageReceived room_message_received = 10;
  }
}

// NotificationOccurrence is the projected current state of one immutable
// notification signal and its monotonic lifecycle.
message NotificationOccurrence {
  string id = 1;
  string recipient_id = 2;
  string source_event_id = 3;
  google.protobuf.Timestamp source_created_at = 4;
  string actor_id = 5;
  NotificationSignal signal = 6;
  bool read = 7;
  google.protobuf.Timestamp expires_at = 8;
  // Internal EVT stream position of the source fact. Used for causal lifecycle
  // cleanup and read-boundary reconciliation; never exposed through the public
  // API.
  uint64 source_stream_sequence = 9;
  // Visual importance selected when the source is materialized.
  NotificationAttentionLevel attention_level = 10;
  // Immutable interruptive-delivery deadline derived from source_created_at.
  google.protobuf.Timestamp alert_expires_at = 11;
  // Sequence of the NotificationSignalled record in NOTIFICATIONS. This is
  // retained only by projections so explicit dismissal can remove the rich
  // source record after the dismissal event becomes visible.
  uint64 notification_stream_sequence = 12;
  // Terminal alert result. Absence means Pending when alert_expires_at is
  // present and the occurrence is unread; false means Suppressed.
  optional bool alert_delivered = 13;
}

// NotificationSignalled is the immutable materialized fact from which the
// current NotificationOccurrence is projected.
message NotificationSignalled {
  string source_event_id = 1;
  google.protobuf.Timestamp source_created_at = 2;
  string actor_id = 3;
  NotificationSignal signal = 4;
  bool initially_read = 5;
  // Internal EVT position used only for causal visibility reconciliation.
  uint64 source_stream_sequence = 6;
  NotificationAttentionLevel attention_level = 7;
  google.protobuf.Timestamp alert_expires_at = 8;
}

message NotificationRead {}

message NotificationRemoved {
  // Internal NOTIFICATIONS coordinate for retryable secure deletion of the
  // corresponding rich signal record. This is never exposed by public APIs.
  uint64 signal_stream_sequence = 1;
}

// NotificationAlertResolved is the single terminal fact for interruptive
// delivery. A deterministic lifecycle ID prevents competing workers from
// recording contradictory outcomes.
message NotificationAlertResolved {
  bool delivered = 1;
}

// NotificationEvent is one bounded lifecycle fact in the NOTIFICATIONS
// stream. The envelope expiry is the notification's immutable application
// expiry; JetStream retains each record for a small physical-cleanup grace.
message NotificationEvent {
  string id = 1;
  string recipient_id = 2;
  string notification_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  google.protobuf.Timestamp expires_at = 5;

  oneof event {
    NotificationSignalled signalled = 100;
    NotificationRead read = 101;
    NotificationRemoved removed = 102;
    NotificationAlertResolved alert_resolved = 103;
  }
}
