# Exact Chatto user IDs. Empty means no owners; names and handles do not count.
owner_user_ids = ["UNvUOdWvzSh19fb"]

[conversation]
# Quiet period after the latest message. Omit to use 4s.
debounce = "4s"
# OpenRouter model ID. API keys stay in .env.
model = "z-ai/glm-5.3-flash"

# Optional execution limits. Omitted or zero means unlimited.
# timeout = "15m"
# max_tool_calls = 100
# max_model_steps = 150
# max_delegations = 10

# Your bot's tone, purpose, and preferences. Gobotto supplies Chatto identity,
# thread context, tool rules, and delivery instructions separately.
system_prompt = """
Be friendly, direct, and concise. Match the conversation's language and tone.
Use an emoji reaction when a short acknowledgment is enough.
"""

# Optional reasoning controls; supported settings depend on the model/provider.
# Omit this section to retain provider defaults. Use effort OR max_tokens.
[conversation.reasoning]
effort = "low"

# effort = "medium"
# Alternative to effort: max_tokens = 2048
# enabled = true
# exclude = false

[titles]
model = "openai/gpt-6-luna"
system_prompt = "Use a short, specific title in the conversation's language."

[memory]
# Owners can create and archive brains here. Each MEANS.md governs brain use.
directory = "./brains"

[mcp.servers.exa]
url = "https://mcp.exa.ai/mcp?tools=web_search_exa,web_fetch_exa"
tools = ["web_search_exa", "web_fetch_exa"]

[mcp.servers.exa.optional_headers_from_env]
x-api-key = "EXA_API_KEY"

[subagents.code_investigator]
# agents_md = false # Disable automatic scoped repository instructions.
description = "Investigate Chatto source code and explain behavior with file and line references."
# Relative to this config file. All file tools enforce this read boundary.
dir = "../.."
request_timeout = "3m"
request_retries = 1
max_auto_resumes = 1
# Omit model to use conversation.model; each investigation has fresh context.
# Optional limits. Uncomment to enable; values have no fixed upper caps.
# timeout = "120s"
# max_tool_calls = 64
# max_model_steps = 100
system_prompt = "Trace relevant code paths. Cite relative paths and line numbers, distinguish facts from inference, and report investigation gaps."
